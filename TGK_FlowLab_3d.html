<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TGK Flow Lab 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--teal:#0d9488;--teal-d:#0b7d73;--orange:#ea580c;--side:#f7f8fa;--line:#e2e5e9;--ink:#1d2731;--mute:#66707a;--field:#0b0f14}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:13px;color:var(--ink);background:#fff;overflow:hidden}
.topbar{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line);background:#fff}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{font-weight:700;font-size:17px;letter-spacing:1px;color:var(--teal)}
.logo-sep{width:1px;height:18px;background:var(--line)}
.logo-sub{font-weight:600;font-size:14px}
.crumb{color:var(--mute);margin-left:4px}
.crumb:before{content:'/ ';color:#b6bec6}
.ver{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--mute);margin-left:6px}
.sp{flex:1}
.body{display:flex;height:calc(100vh - 48px)}
.sidebar-wrap{width:200px;flex:0 0 200px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow-y:auto}
.nav-group{padding:16px 18px 5px;font-size:11.5px;font-weight:600;color:var(--mute)}
.nav-item{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;font-weight:500;padding:8px 18px 8px 15px;border-left:3px solid transparent;cursor:pointer;color:var(--ink)}
.nav-item:hover{background:#eef1f3}
.nav-item.on{background:#e6f2f1;border-left-color:var(--teal);color:var(--teal-d);font-weight:600}
.nav-item:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.nav-foot{margin-top:auto;padding:12px 18px;font-size:11.5px;color:var(--mute);border-top:1px solid var(--line)}
.main{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.work{overflow-y:auto;padding:16px 20px 32px}
.panel{overflow-y:auto;border-left:1px solid var(--line);padding:14px 16px 32px;background:#fff}
.ph{font-size:14px;font-weight:700;margin:0 0 10px}
.model{margin:0 0 12px;padding:0 0 10px;border-bottom:1px dashed #d5dadf}
.model:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.mh{font-weight:600;margin:0 0 8px;color:var(--teal-d)}
.row{margin:0 0 9px}
.rl{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px}
.rl label{font-weight:500}
.val{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--mute)}
select,input[type=text],input[type=number]{width:100%;font:inherit;font-size:12.5px;padding:5px 7px;border:1px solid #cfd5db;border-radius:3px;background:#fff;color:var(--ink)}
select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
input[type=range]{width:100%;margin:2px 0;accent-color:var(--teal)}
.colorin{width:100%;height:30px;padding:2px;border:1px solid #cfd5db;border-radius:3px;background:#fff;cursor:pointer}
.chk{display:flex;align-items:center;gap:7px;font-weight:500;cursor:pointer;margin:0 0 6px}
.chk input{accent-color:var(--teal);margin:0}
.hint{font-size:11.5px;color:var(--mute);line-height:1.45;margin-top:4px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.btn{font:inherit;font-size:12.5px;font-weight:500;padding:5px 10px;border:1px solid #cfd5db;background:#fff;color:var(--ink);border-radius:3px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#eef1f3}
.btn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.pri:hover{background:var(--teal-d)}
.btn.rec{color:var(--orange);border-color:var(--orange)}
.btn.rec.on{background:var(--orange);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px 8px}
.two label{display:block;font-size:11.5px;color:var(--mute);margin-bottom:2px}
#viewwrap{position:relative;background:var(--field);line-height:0;cursor:grab;touch-action:none;aspect-ratio:16/9}
#viewwrap:active{cursor:grabbing}
#viewwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#viewwrap.drop{outline:3px dashed var(--teal);outline-offset:-3px}
#viewwrap .err{position:absolute;inset:0;line-height:1.5;background:#fff;padding:30px;font-size:14px;color:#b42318}
table.met{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:14px}
.met th,.met td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.met th{font-weight:600;color:var(--mute);background:var(--side)}
.met td.n,.met th.n{text-align:right;white-space:nowrap}
.met td.n{font-family:'JetBrains Mono',monospace}
.met td.unsettled{color:#a3acb5}
.met .what{display:block;color:var(--mute);font-size:11.5px;margin-top:1px}
.summary{margin:14px 0 6px;font-size:14px;font-weight:600}
.caveat{font-size:11.5px;color:var(--mute);line-height:1.5;max-width:780px}
.rmode #viewpage{display:none}
#resultspage{display:none;max-width:1100px}
.rmode #resultspage{display:block}
.rmode .panel{display:none}
.rmode .main{grid-template-columns:minmax(0,1fr)}
body:not([data-tab="rpm"]) #rpmres{display:none}
.r-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.r-head h2{font-size:18px;margin:0}
.r-h{font-size:14px;font-weight:700;margin:26px 0 6px}
#res-meta table.met,#res-key table.met{margin-top:10px}
#res-ref input,#res-ref select{min-width:70px}
#res-ref td{vertical-align:middle}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.shot img{width:100%;display:block;border:1px solid var(--line)}
.shot input{margin-top:6px}
.hide{display:none!important}
#guide{position:absolute;top:0;bottom:0;border-left:2px dashed #0d9488;border-right:2px dashed #0d9488;box-shadow:0 0 0 9999px rgba(0,0,0,.42);pointer-events:none}
.rpm-title{font-size:15px;font-weight:700;margin:24px 0 0}
.chart-wrap{margin-top:14px;border:1px solid var(--line)}
.chart-wrap canvas{width:100%;display:block}
@media (max-width:980px){.main{grid-template-columns:1fr;overflow-y:auto}.panel{border-left:0;border-top:1px solid var(--line);overflow:visible}.work{overflow:visible}.sidebar-wrap{width:150px;flex-basis:150px}}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><span class="logo-mark">TGK</span><span class="logo-sep"></span><span class="logo-sub">Flow Lab</span></div>
  <span class="crumb" id="crumb"></span><span class="ver" id="ver"></span>
  <span class="sp"></span>
  <button class="btn" data-act="play" id="bPlay">Pause</button>
  <button class="btn" data-act="reset">Restart flow</button>
  <button class="btn" data-act="freeze" id="bFreeze">Freeze flow</button>
  <button class="btn" data-act="ff" id="bFF">Fast-forward</button>
  <button class="btn" data-act="view">Reset view</button>
  <button class="btn" data-act="shot">Add snapshot</button>
  <button class="btn" data-act="snap">Save PNG</button>
  <button class="btn rec" data-act="rec">Record video</button>
</header>
<div class="body">
  <nav class="sidebar-wrap" id="nav"></nav>
  <div class="main">
    <div class="work" id="work">
      <div id="viewpage">
        <div id="viewwrap"><canvas id="gpu"></canvas><canvas id="overlay"></canvas><div id="guide" class="hide"></div></div>
        <div id="metrics"></div>
        <div id="rpmres"></div>
      </div>
      <div id="resultspage">
        <div class="r-head"><h2>Results</h2>
          <div class="btns">
            <button class="btn pri" data-act="exp-csv">Download CSV</button>
            <button class="btn" data-act="exp-json">Download JSON</button>
            <button class="btn" data-act="exp-html">Download report</button>
            <button class="btn" data-act="exp-print">Print or save as PDF</button>
          </div>
        </div>
        <div class="btns" style="margin-top:6px">
          <button class="btn pri" data-act="sheet">Customer sheet</button>
          <button class="btn" data-act="sheetprint">Print customer sheet</button>
          <button class="btn pri" data-act="package">Publishing package (ZIP)</button>
        </div>
        <div id="res-prod" style="margin-top:10px"></div>
        <div id="res-meta"></div>
        <div id="res-key"></div>
        <h3 class="r-h">By engine speed</h3>
        <div id="rpmtab2"></div>
        <div class="chart-wrap"><canvas id="rpmchart2" width="1000" height="300"></canvas></div>
        <h3 class="r-h">Reference data</h3>
        <div id="res-ref"></div>
        <h3 class="r-h">Validation log</h3>
        <div id="res-vlog"></div>
        <h3 class="r-h">Saved runs</h3>
        <div id="res-runs"></div>
        <h3 class="r-h">Accuracy notes</h3>
        <div id="res-notes"></div>
        <h3 class="r-h">Snapshots</h3>
        <div id="res-shots"></div>
      </div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>
<input type="file" id="file3d" accept=".stp,.step,.igs,.iges,.stl,.STP,.STEP,.IGS,.IGES,.STL" style="display:none">
<script>
(function(){
'use strict';
var VERSION='3.4.1';
document.getElementById('ver').textContent='v'+VERSION;
var OCCT_VER='0.0.23';
var OCCT_BASES=(function(){
  var list=[];
  if(/^https?:/.test(location.protocol))list.push(new URL('./',location.href).href);
  list.push('https://cdn.jsdelivr.net/npm/occt-import-js@'+OCCT_VER+'/dist/','https://unpkg.com/occt-import-js@'+OCCT_VER+'/dist/');
  return list;
})();
var OCCT_PRM={linearUnit:'millimeter',linearDeflectionType:'bounding_box_ratio',linearDeflection:0.002,angularDeflection:0.4};
function cadToTris(r){
  if(!r||!r.success)throw new Error('The CAD reader could not open this file. Re-export it from your CAD program as STEP AP214 or AP242 (solid body), or as STL.');
  var n=0;(r.meshes||[]).forEach(function(m){n+=m.index.array.length/3;});
  if(!n)throw new Error('The file opened but has no solid geometry in it (it may contain only sketches, curves or PMI). Export the part body.');
  var t=new Float32Array(n*9),k=0,bodies=[];
  r.meshes.forEach(function(m){var s0=k,P=m.attributes.position.array,I=m.index.array;for(var i=0;i<I.length;i++){var j=I[i]*3;t[k++]=P[j];t[k++]=P[j+1];t[k++]=P[j+2];}bodies.push({s:s0,e:k,name:m.name||'',faces:(m.brep_faces||[]).map(function(f){return {s:s0+f.first*9,e:s0+(f.last+1)*9};})});});
  t.bodies=bodies;
  return t;
}
function bodyInfo(t){
  var list=t.bodies&&t.bodies.length?t.bodies:[{s:0,e:t.length,name:''}];
  list.forEach(function(b){var bb=modelBounds(t.subarray(b.s,b.e));b.diag=Math.hypot(bb.max[0]-bb.min[0],bb.max[1]-bb.min[1],bb.max[2]-bb.min[2]);b.ntri=(b.e-b.s)/9;});
  var big=Math.max.apply(null,list.map(function(b){return b.diag;}));
  list.forEach(function(b){b.on=b.diag>=big*0.3;});
  return list;
}
function rayHits(T,o,d,maxT){
  for(var i=0;i<T.length;i+=9){
    var e1x=T[i+3]-T[i],e1y=T[i+4]-T[i+1],e1z=T[i+5]-T[i+2],e2x=T[i+6]-T[i],e2y=T[i+7]-T[i+1],e2z=T[i+8]-T[i+2];
    var px=d[1]*e2z-d[2]*e2y,py=d[2]*e2x-d[0]*e2z,pz=d[0]*e2y-d[1]*e2x,det=e1x*px+e1y*py+e1z*pz;
    if(Math.abs(det)<1e-12)continue;
    var inv=1/det,tx=o[0]-T[i],ty=o[1]-T[i+1],tz=o[2]-T[i+2],u=(tx*px+ty*py+tz*pz)*inv;
    if(u<0||u>1)continue;
    var qx=ty*e1z-tz*e1y,qy=tz*e1x-tx*e1z,qz=tx*e1y-ty*e1x,v=(d[0]*qx+d[1]*qy+d[2]*qz)*inv;
    if(v<0||u+v>1)continue;
    var t=(e2x*qx+e2y*qy+e2z*qz)*inv;
    if(t>1e-4&&t<maxT)return true;
  }
  return false;
}
function findOpenings(md){
  var T=md.all,cand=[];
  md.bodies.forEach(function(b,bi){
    if(!b.on||!b.faces)return;
    b.faces.forEach(function(f){
      var nt=(f.e-f.s)/9;if(nt<4||nt>6000)return;
      var N=[0,0,0],ns=[],q;
      for(q=f.s;q<f.e;q+=9){
        var ux=T[q+3]-T[q],uy=T[q+4]-T[q+1],uz=T[q+5]-T[q+2],vx=T[q+6]-T[q],vy=T[q+7]-T[q+1],vz=T[q+8]-T[q+2];
        var cx=uy*vz-uz*vy,cy=uz*vx-ux*vz,cz=ux*vy-uy*vx,l=Math.hypot(cx,cy,cz);
        if(l>0){ns.push(cx/l,cy/l,cz/l);N[0]+=cx;N[1]+=cy;N[2]+=cz;}
      }
      var L=Math.hypot(N[0],N[1],N[2]);if(!L)return;N=[N[0]/L,N[1]/L,N[2]/L];
      for(q=0;q<ns.length;q+=3)if(ns[q]*N[0]+ns[q+1]*N[1]+ns[q+2]*N[2]<0.995)return;
      var key=function(o){return T[o].toFixed(3)+','+T[o+1].toFixed(3)+','+T[o+2].toFixed(3);};
      var ec={},ek;
      for(q=f.s;q<f.e;q+=9){
        var ks=[key(q),key(q+3),key(q+6)];
        for(var a=0;a<3;a++){var k1=ks[a],k2=ks[(a+1)%3];ek=k1<k2?k1+'|'+k2:k2+'|'+k1;ec[ek]=(ec[ek]||0)+1;}
      }
      var adj={};
      for(ek in ec){if(ec[ek]!==1)continue;var pr=ek.split('|');(adj[pr[0]]=adj[pr[0]]||[]).push(pr[1]);(adj[pr[1]]=adj[pr[1]]||[]).push(pr[0]);}
      var seen={},loops=[];
      for(var st in adj){
        if(seen[st])continue;
        var lp=[],cur=st,prev=null;
        while(cur&&!seen[cur]){seen[cur]=1;lp.push(cur.split(',').map(Number));var nb=adj[cur].filter(function(x){return x!==prev&&!seen[x];});prev=cur;cur=nb[0];}
        if(lp.length<3)continue;
        var per=0,c=[0,0,0];
        for(q=0;q<lp.length;q++){var A=lp[q],B2=lp[(q+1)%lp.length];per+=Math.hypot(A[0]-B2[0],A[1]-B2[1],A[2]-B2[2]);c[0]+=A[0];c[1]+=A[1];c[2]+=A[2];}
        loops.push({per:per,c:[c[0]/lp.length,c[1]/lp.length,c[2]/lp.length]});
      }
      if(loops.length<2)return;
      loops.sort(function(x,y){return y.per-x.per;});
      var inner=loops[1],d=inner.per/Math.PI;if(d<6)return;
      cand.push({c:inner.c,n:N,d:d,body:bi});
    });
  });
  var out=[];
  cand.forEach(function(o){
    var st=[o.c[0]+o.n[0]*0.3,o.c[1]+o.n[1]*0.3,o.c[2]+o.n[2]*0.3];
    if(rayHits(md.tris,st,o.n,Math.max(30,o.d*3)))return;
    if(out.some(function(x){return Math.hypot(x.c[0]-o.c[0],x.c[1]-o.c[1],x.c[2]-o.c[2])<2;}))return;
    out.push(o);
  });
  out.sort(function(x,y){return y.d-x.d;});
  return out;
}
function setOpeningDefaults(m){
  var md=MODELS[m],p=S[m].p,ops=md.openings||[];
  p.inlet=0;p.closed={};
  ops.forEach(function(o,i){if(i>0&&o.d<ops[0].d*0.25)p.closed[i]=true;});
}
function applyBodies(m){
  var md=MODELS[m],n=0;
  md.bodies.forEach(function(b){if(b.on)n+=b.e-b.s;});
  var t=new Float32Array(n),k=0;
  md.bodies.forEach(function(b){if(b.on){t.set(md.all.subarray(b.s,b.e),k);k+=b.e-b.s;}});
  var bb=modelBounds(t.length?t:md.all);
  md.tris=t;md.min=bb.min;md.max=bb.max;md.pca=t.length?modelPCA(t):null;md._ck=null;
  md.openings=findOpenings(md);
  setOpeningDefaults(m);
}
var occtWorker=null,occtJobs={},occtId=0,workerBroken=false;
function readCad(buf,kind){
  return new Promise(function(res,rej){
    function fb(msg){var e=new Error(msg);e.fallback=true;return e;}
    if(!occtWorker){
      var src=[
        "var B="+JSON.stringify(OCCT_BASES)+",base=null;",
        "for(var i=0;i<B.length;i++){try{importScripts(B[i]+'occt-import-js.js');base=B[i];break;}catch(e){}}",
        "var ready=base?occtimportjs({locateFile:function(f){return base+f;}}):Promise.reject(new Error('download failed'));",
        "onmessage=function(e){var d=e.data;ready.then(function(o){",
        " var r;try{r=d.kind==='iges'?o.ReadIgesFile(new Uint8Array(d.buf),d.prm):o.ReadStepFile(new Uint8Array(d.buf),d.prm);}catch(err){postMessage({id:d.id,err:'The CAD reader crashed on this file ('+(err&&err.message||err)+'). Try re-exporting it as STEP AP214, or as STL.'});return;}",
        " if(!r||!r.success){postMessage({id:d.id,bad:true});return;}",
        " var out=[];r.meshes.forEach(function(m){out.push({n:m.name||'',f:(m.brep_faces||[]).map(function(f){return [f.first,f.last];}),p:new Float32Array(m.attributes.position.array),i:new Uint32Array(m.index.array)});});",
        " postMessage({id:d.id,meshes:out},out.map(function(m){return m.p.buffer;}).concat(out.map(function(m){return m.i.buffer;})));",
        "},function(err){postMessage({id:d.id,loadFail:String(err&&err.message||err)});});};"
      ].join('\n');
      try{occtWorker=new Worker(URL.createObjectURL(new Blob([src],{type:'text/javascript'})));}
      catch(err){rej(fb('worker blocked'));return;}
      occtWorker.onmessage=function(e){
        var d=e.data,j=occtJobs[d.id];if(!j)return;delete occtJobs[d.id];
        if(d.loadFail){j.rej(fb(d.loadFail));return;}
        if(d.err){j.rej(new Error(d.err));return;}
        try{
          if(d.bad)cadToTris(null);
          j.res(cadToTris({success:true,meshes:d.meshes.map(function(m){return {name:m.n,brep_faces:(m.f||[]).map(function(q){return {first:q[0],last:q[1]};}),attributes:{position:{array:m.p}},index:{array:m.i}};})}));
        }catch(x){j.rej(x);}
      };
      occtWorker.onerror=function(e){
        if(e&&e.preventDefault)e.preventDefault();
        Object.keys(occtJobs).forEach(function(k){occtJobs[k].rej(fb('worker failed'));delete occtJobs[k];});
        try{occtWorker.terminate();}catch(x){}
        occtWorker=null;
      };
    }
    var id=++occtId;occtJobs[id]={res:res,rej:rej};
    occtWorker.postMessage({id:id,buf:buf,kind:kind,prm:OCCT_PRM});
  });
}
var occtMain=null;
function occtOnMain(){
  if(occtMain)return occtMain;
  occtMain=new Promise(function(res,rej){
    var i=0;
    function next(){
      if(i>=OCCT_BASES.length){occtMain=null;rej(new Error('Could not download the STEP reader from any source. It needs an internet connection the first time, and some ad blockers or work networks block cdn.jsdelivr.net and unpkg.com. Fix: put occt-import-js.js and occt-import-js.wasm in the same GitHub Pages folder as this tool, or use STL files.'));return;}
      var base=OCCT_BASES[i++],sc=document.createElement('script');sc.src=base+'occt-import-js.js';
      sc.onload=function(){
        if(typeof occtimportjs!=='function'){next();return;}
        occtimportjs({locateFile:function(f){return base+f;}}).then(res,function(){next();});
      };
      sc.onerror=function(){sc.remove();next();};
      document.head.appendChild(sc);
    }
    next();
  });
  return occtMain;
}
function readCadMain(buf,kind){
  return occtOnMain().then(function(o){
    var r,u8=new Uint8Array(buf);
    try{r=kind==='iges'?o.ReadIgesFile(u8,OCCT_PRM):o.ReadStepFile(u8,OCCT_PRM);}
    catch(err){throw new Error('The CAD reader crashed on this file ('+(err&&err.message||err)+'). Try re-exporting it as STEP AP214, or as STL.');}
    return cadToTris(r);
  });
}
function readCadAny(buf,kind){
  if(workerBroken)return readCadMain(buf,kind);
  return readCad(buf,kind).catch(function(err){
    if(err&&err.fallback){console.warn('STEP worker unavailable, reading on main thread:',err.message);workerBroken=true;return readCadMain(buf,kind);}
    throw err;
  });
}
function parseSTL(buf){

  rows.forEach(function(r){

    if(B&&r[4]&&A.m&&B.m&&A.m[r[2]]!=null&&B.m[r[2]]!=null&&isFinite(A.m[r[2]])&&isFinite(B.m[r[2]])){var a=A.m[r[2]],b=B.m[r[2]];if(r[4]==='pct'&&Math.abs(a)>1e-6){var p=(b-a)/Math.abs(a)*100;d=(p>0?'+':'')+p.toFixed(0)+'%';}else if(r[4]==='pts'){var q=(b-a)*100;d=(q>0?'+':'')+q.toFixed(1)+' pts';}}
    h+='<tr><td>'+r[0]+'<span class="what">'+r[1]+'</span></td><td class="n'+cA+'">'+v(A,r[2],r[3])+'</td>'+(B?'<td class="n'+cB+'">'+v(B,r[2],r[3])+'</td><td class="n">'+(d||'-')+'</td>':'')+'</tr>';
  });
  function split(s){return s.m&&s.m.split&&s.m.split.length>1?s.m.split.map(function(x){return Math.round(x*100)+'%';}).join(' / '):'-';}
  if(l.some(function(s){return s.m&&s.m.split&&s.m.split.length>1;}))h+='<tr><td>Flow split between outlets<span class="what">Share of the air leaving through each open outlet, in the order listed in the sidebar.</span></td><td class="n">'+split(A)+'</td>'+(B?'<td class="n">'+split(B)+'</td><td class="n"></td>':'')+'</tr>';
  h+='<tr><td>Flow-throughs<span class="what">Times the air volume inside has been replaced. Compare numbers after 2 or more.</span></td><td class="n">'+A.ft().toFixed(1)+'</td>'+(B?'<td class="n">'+B.ft().toFixed(1)+'</td><td class="n"></td>':'')+'</tr>';
  h+='<tr><td>Settling check<span class="what">Compares the loss number over the last two half flow-throughs. Under 3% change counts as settled.</span></td>'+l.map(function(s){var ci=s.convInfo();return '<td class="n">'+(ci.rel==null?'needs 2 flow-throughs':(!ci.uOk?'airflow not at target yet':(ci.ok?'settled, ':'still moving, ')+(ci.rel*100).toFixed(1)+'%'))+'</td>';}).join('')+(B?'<td class="n"></td>':'')+'</tr>';
  h+='</tbody></table>';
  var sum='',settled=l.every(function(s){return s.convInfo().ok;});
  if(!settled)sum='Still settling. Let the airflow reach its target and the loss stop moving, or press Fast-forward, before trusting the numbers.';
  else if(B&&A.m&&B.m&&isFinite(A.m.K)&&isFinite(B.m.K)){
    var pk=(B.m.K-A.m.K)/Math.abs(A.m.K)*100;
    sum=Math.abs(pk)<3?lb+' and '+la+' have about the same pressure loss.':lb+' has '+Math.abs(pk).toFixed(0)+'% '+(pk<0?'less':'more')+' pressure loss than '+la+'.';
    if(A.m.cfm&&B.m.cfm){var pc=(B.m.cfm-A.m.cfm)/A.m.cfm*100;sum+=' Estimated bench flow: '+Math.round(B.m.cfm).toLocaleString()+' vs '+Math.round(A.m.cfm).toLocaleString()+' CFM ('+(pc>0?'+':'')+pc.toFixed(0)+'%).';}
  }else if(A.m&&isFinite(A.m.K)){sum='Pressure loss K = '+A.m.K.toFixed(2)+(A.m.cfm?', about '+Math.round(A.m.cfm).toLocaleString()+' CFM at '+S.benchIn+' in. of water':'')+'.';}
  h+='<div class="summary">'+sum+'</div>';
  var reTxt=l.map(function(s){return Math.round(s.reEff).toLocaleString();}).join(' / ');
  var cellTxt=l.map(function(s){return Math.round(s.minCells);}).join(' / ');
  var modeTxt={pull:'Air is pulled through: the inlet is open to atmosphere and the outlets are at a lower pressure.',pullsplit:'Air is pulled through with a set share at each outlet.',push:'Air is pushed in at the inlet at a fixed speed.'}[S.drive];
  h+='<div class="caveat">'+modeTxt+' Full 3D simulation of the air inside the part (lattice Boltzmann with a turbulence model and curved-wall treatment). Smallest open passage: '+cellTxt+' cells across. Reynolds number about '+reTxt+' versus 100,000+ on a running engine. Coarse grids over-predict loss, so treat absolute numbers as estimates'+(S.compare?'; both designs run on the same grid size so the comparison stays fair':'')+(S.calib!==1?'; CFM is calibrated to your bench result.':'. Enter one real flow-bench result under CFM estimate to calibrate.')+' Rankings between designs are the most reliable output.</div>';
  metricsEl.innerHTML='<div class="summary">'+sum+'</div>';
  if(resKeyEl)resKeyEl.innerHTML=h;
}

function onCtl(e){
  var el=e.target,k=el.getAttribute&&el.getAttribute('data-k');if(!k)return;
  var isRange=el.type==='range',isChk=el.type==='checkbox',isText=el.type==='text',isNum=el.type==='number',isCol=el.type==='color';
  var v=isChk?el.checked:(isRange||isNum?parseFloat(el.value):el.value);
  if(isCol){var ck=/^dye\.c\.(\d)$/.exec(k);if(ck){S.dye.c[+ck[1]]=el.value;return;}setPath(k,el.value);return;}
  if(isRange){var lab=side.querySelector('[data-v="'+k+'"]');if(lab&&FMT[k])lab.textContent=FMT[k](v);}
  if(isText){setPath(k,v);return;}
  if(isNum&&/\.p\.share\.\d+$/.test(k)){var ks=k.split('.'),pp=S[ks[0]].p;pp.share=pp.share||{};if(isFinite(v)&&v>0)pp.share[+ks[3]]=v;else delete pp.share[+ks[3]];return;}
  if(isNum){
    if(!isFinite(v))return;
    if(/^[ab]\.id$/.test(k)){S[k.charAt(0)].id=v;S[k.charAt(0)].idManual=true;return;}
    setPath(k,v);
    if(/^eng\./.test(k)){S.rpm=Math.max(S.eng.idle,Math.min(S.eng.rpm,S.rpm));if(e.type==='change')render();}
    renderRpm();return;
  }
  if(isRange){
    if(k==='range'){S.ranges[S.field]=v;return;}
    setPath(k,v);
    if(k==='Re'&&e.type==='change')rebuildAll();
    if(k==='spf')S.spfEff=v;
    if(k==='rpm'){S.sweeping=false;renderRpm();}
    return;
  }
  if(e.type!=='change')return;
  var bm=/^([ab])\.body\.(\d+)$/.exec(k);
  if(bm){var md=MODELS[bm[1]];md.bodies[+bm[2]].on=v;if(!md.bodies.some(function(b){return b.on;})){md.bodies[+bm[2]].on=true;el.checked=true;return;}applyBodies3(bm[1]);render();scheduleBuild(bm[1]);return;}
  var om=/^([ab])\.open\.(\d+)$/.exec(k);
  if(om){var pc=S[om[1]].p;pc.closed=pc.closed||{};pc.closed[+om[2]]=!v;scheduleBuild(om[1]);return;}
  if(/^[ab]\.inlet$/.test(k)){var pi=S[k.charAt(0)].p;pi.inlet=parseInt(v,10);pi.closed=pi.closed||{};delete pi.closed[pi.inlet];S[k.charAt(0)].idManual=false;render();scheduleBuild(k.charAt(0));return;}
  if(k==='compare'){S.compare=v;render();if(v&&MODELS.b&&!sims.b.ready)scheduleBuild('b');return;}
  if(k==='detail'){S.detail=v;rebuildAll();return;}
  if(k==='drive'){S.drive=v;render();rebuildAll();return;}
  if(k==='field'){S.field=v;S.cmap=FIELDS[v].cmap;render();return;}
  if(k==='dye.res'){S.dye.res=v;activeSims().forEach(function(s){s.disposeDye();});return;}
  if(k==='dye.preset'||k==='dye.pattern'){setPath(k,v);render();return;}
  if(k==='st.smooth'){S.st.smooth=v;activeSims().forEach(function(s){if(s.ready)s.rebindField();});return;}
  if(k==='partMat'){S.partMat=v;S.partColor=PARTMAT[v].c;render();return;}
  if(k==='partStyle'){S.partStyle=v;if(v==='solid')S.cutaway=true;render();return;}
  if(k==='res'){S.res=v==='auto'?'auto':parseInt(v,10);if(S.res==='auto')autoRes();else setResolution(S.res);return;}
  if(k==='density'){S.density=v;activeSims().forEach(function(s){s.resetParticles();});return;}
  if(k==='recDur'||k==='sweepSec'){setPath(k,parseFloat(v));S.sweepT0=performance.now();return;}
  if(/^vw\./.test(k)&&el.tagName==='SELECT'){S.vw[k.slice(3)]=isNaN(parseFloat(v))?v:parseFloat(v);return;}
  if(/^gif\./.test(k)&&el.tagName==='SELECT'){S.gif[k.slice(4)]=isNaN(parseFloat(v))?v:parseFloat(v);if(k==='gif.fmt'||k==='gif.aspect')render();return;}
  setPath(k,v);
  if(/^(slice|colorScale|units|chart|st\.mode|st\.seed|st\.style|cmap|st\.cmap)$/.test(k)){render();renderRpm();}
}

function drawRpmChart(l,cvArg){

  cx.clearRect(0,0,W,H);cx.fillStyle='#fff';cx.fillRect(0,0,W,H);

  var title={dp:'Pressure loss through the part (in. of water)',vpk:'Fastest air speed in the part ('+(S.units==='mph'?'mph':'m/s')+')',vin:'Inlet speed ('+(S.units==='mph'?'mph':'m/s')+')'}[S.chart];
  l.forEach(function(s,si){
    var pts=[];for(var i=0;i<=N;i++){var r=r0+(r1-r0)*i/N,ph=physAt(s,r),y=S.chart==='dp'?ph.dp:(S.chart==='vpk'?(ph.Vpk!=null?ph.Vpk*uk:null):ph.V*uk);pts.push([r,y]);if(y!=null&&y>ymax)ymax=y;}

  });

  for(var g=0;g<=4;g++){var yv=ymax*g/4,yy=Y(yv);cx.beginPath();cx.moveTo(L,yy);cx.lineTo(W-R,yy);cx.stroke();var tx=yv>=10?yv.toFixed(0):yv.toFixed(yv>=1?1:2);cx.textAlign='right';cx.fillText(tx,L-8,yy);}
  cx.textAlign='center';cx.textBaseline='top';
  for(var rr=Math.ceil(r0/1000)*1000;rr<=r1;rr+=1000){var xx=X(rr);cx.beginPath();cx.moveTo(xx,H-B);cx.lineTo(xx,H-B+5);cx.stroke();cx.fillText((rr/1000)+'k',xx,H-B+9);}
  cx.fillStyle='#1d2731';cx.font='600 16px "DM Sans", sans-serif';cx.textAlign='left';cx.textBaseline='alphabetic';cx.fillText(title,L,22);
  cx.strokeStyle='#cfd5db';cx.beginPath();cx.moveTo(L,H-B);cx.lineTo(W-R,H-B);cx.moveTo(L,T);cx.lineTo(L,H-B);cx.stroke();

    sr.pts.forEach(function(p){if(p[1]==null)return;var x=X(p[0]),y=Y(p[1]);if(!st){cx.moveTo(x,y);st=true;}else cx.lineTo(x,y);});cx.stroke();

    if(cy!=null){cx.fillStyle=sr.col;cx.beginPath();cx.arc(X(Math.max(r0,Math.min(r1,S.rpm))),Y(cy),6,0,6.2832);cx.fill();}
    cx.fillStyle=sr.col;cx.font='600 15px "DM Sans", sans-serif';cx.textAlign='left';cx.fillText(sr.lab,W-R-150,24+si*20);
  });
  var xc=X(Math.max(r0,Math.min(r1,S.rpm)));cx.strokeStyle='#8a949e';cx.lineWidth=1;cx.setLineDash([5,4]);cx.beginPath();cx.moveTo(xc,T);cx.lineTo(xc,H-B);cx.stroke();cx.setLineDash([]);
}

  md.bodies.forEach(function(b){if(b.on)n+=b.e-b.s;});
  var t=new Float32Array(n),k=0;
  md.bodies.forEach(function(b){if(b.on){md.ranges.push([k,k+b.e-b.s]);t.set(md.all.subarray(b.s,b.e),k);k+=b.e-b.s;}});
  var bb=modelBounds(t.length?t:md.all);
  md.tris=t;md.min=bb.min;md.max=bb.max;md.pca=t.length?modelPCA(t):null;
  md.openings=findOpenings(md);
  var p=S[m].p;p.inlet=0;p.closed={};p.share={};
  md.openings.forEach(function(o,i){if(i>0&&o.d<md.openings[0].d*0.25)p.closed[i]=true;});
}
var file3d=document.getElementById('file3d'),loadTarget=null;
file3d.addEventListener('change',function(){var f=file3d.files[0],m=loadTarget;file3d.value='';if(f&&m)loadModelFile(f,m);});
function loadModelFile(f,m){
  var ext=(f.name.split('.').pop()||'').toLowerCase();
  if(['stp','step','igs','iges','stl'].indexOf(ext)<0){MERR[m]=true;MSTAT[m]='Use a .stp, .step, .igs, .iges or .stl file.';updModelStatus(m);return;}
  MERR[m]=false;var t0=Date.now(),mb=(f.size/1048576).toFixed(1);
  var base=ext==='stl'?'Reading '+f.name+' ('+mb+' MB)':'Reading '+f.name+' ('+mb+' MB). The first STEP file downloads the reader (about 8 MB), then it is cached.';
  MSTAT[m]=base;updModelStatus(m);
  var tick=setInterval(function(){MSTAT[m]=base+' '+Math.round((Date.now()-t0)/1000)+'s';updModelStatus(m);},1000);
  f.arrayBuffer().then(function(buf){
    if(ext==='stl')return stlFaceGroups(parseSTL(buf));
    return readCadAny(buf,(ext==='igs'||ext==='iges')?'iges':'step');
  }).then(function(t){
    clearInterval(tick);
    if(!t||t.length<9)throw new Error('No solid geometry found in that file.');
    MODELS[m]={name:f.name,all:t,bodies:bodyInfo(t),unit:ext==='stl'?'units':'mm'};
    applyBodies3(m);S[m].idManual=false;
    sims[m].dispose();sims[m].m=null;
    render();scheduleBuild(m);
  }).catch(function(err){clearInterval(tick);console.error('Model load failed:',err);MERR[m]=true;MSTAT[m]=f.name+': '+(err&&err.message||String(err));updModelStatus(m);});
}
(function(){
  var wrap=document.getElementById('viewwrap');
  function over(e){e.preventDefault();wrap.classList.add('drop');}
  ['dragenter','dragover'].forEach(function(t){wrap.addEventListener(t,over);side.addEventListener(t,function(e){e.preventDefault();});});
  wrap.addEventListener('dragleave',function(){wrap.classList.remove('drop');});
  function dropOn(e,m){e.preventDefault();wrap.classList.remove('drop');var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];if(!f)return;if(m==='b'&&!S.compare){S.compare=true;render();}loadModelFile(f,m);}
  wrap.addEventListener('drop',function(e){var r=wrap.getBoundingClientRect(),m=(S.compare&&e.clientX>r.left+r.width/2)?'b':'a';dropOn(e,m);});
  side.addEventListener('drop',function(e){var mb=e.target.closest&&e.target.closest('[data-model]');dropOn(e,mb?mb.getAttribute('data-model'):'a');});
})();

/* ---------- actions ---------- */
var bPlay=document.getElementById('bPlay'),bFF=document.getElementById('bFF');
function updFF(){bFF.textContent=S.ffTarget>0?'Fast-forwarding...':'Fast-forward';}
function stamp(){return new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');}
function download(blob,name){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);}
function setRecUI(on,text){document.querySelectorAll('[data-act="rec"]').forEach(function(b){b.classList.toggle('on',on);b.textContent=text;});}
function toggleRec(){
  if(rec){rec.stop();return;}
  if(!compCv.captureStream||typeof MediaRecorder==='undefined'){alert('Video recording is not supported in this browser. Use Chrome or Edge.');return;}
  var types=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'],mime='';
  for(var i=0;i<types.length;i++){if(MediaRecorder.isTypeSupported(types[i])){mime=types[i];break;}}
  compositeFrame();
  var stream=compCv.captureStream(30),opts={videoBitsPerSecond:16000000};if(mime)opts.mimeType=mime;
  var r;try{r=new MediaRecorder(stream,opts);}catch(err){alert('Could not start recording: '+err.message);return;}
  var chunks=[],t0=performance.now();
  r.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data);};
  var timer=setInterval(function(){var s=(performance.now()-t0)/1000;setRecUI(true,'Stop ('+Math.floor(s)+' / '+S.recDur+'s)');if(s>=S.recDur&&r.state==='recording')r.stop();},250);
  r.onstop=function(){clearInterval(timer);stream.getTracks().forEach(function(t){t.stop();});var mt=(r.mimeType||mime||'video/webm'),ex=mt.indexOf('mp4')>=0?'mp4':'webm';download(new Blob(chunks,{type:mt.split(';')[0]}),'TGK_flow3d_'+stamp()+'.'+ex);rec=null;setRecUI(false,'Record video');};
  r.start(500);rec=r;setRecUI(true,'Stop (0 / '+S.recDur+'s)');
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;var a=b.getAttribute('data-act');
  if(a==='play'){S.running=!S.running;bPlay.textContent=S.running?'Pause':'Play';}
  else if(a==='reset'){activeSims().forEach(function(s){if(MODELS[s.key])scheduleBuild(s.key);});S.ffTarget=0;updFF();}
  else if(a==='ff'){var l=activeSims().filter(function(s){return s.ready;});if(!l.length)return;S.ffTarget=S.ffTarget>0?0:Math.max.apply(null,l.map(function(s){return s.ft();}))+2;if(!S.running){S.running=true;bPlay.textContent='Pause';}updFF();}
  else if(a==='snap'){snapPending=true;}
  else if(a==='rec'){toggleRec();}
  else if(a==='view'){S.cam={yaw:0.55,pitch:0.32,zoom:1,panX:0,panY:0};}
  else if(a==='gif'){gifStart();}
  else if(a==='viewer'){viewerExport();}
  else if(a==='spots'){markSpots();}
  else if(a==='spotsclr'){S.callouts={a:[],b:[]};S.spotMsg='';render();}
  else if(a==='reflog'){var rl=S.refs[+b.getAttribute('data-i')],cl=rl&&refCalc(rl);if(cl&&cl.ok&&cl.settled){S.vlog.unshift({t:new Date().toISOString(),sku:S.sku,label:rl.label,part:MODELS[rl.model]?MODELS[rl.model].name:'',cfm:rl.cfm,dp:rl.dp,type:rl.type,Kreal:cl.Kref,Ksim:cl.Ksim,diff:cl.diff,calibrated:S.calib!==1,tuned:!!rl.tuned});if(S.vlog.length>300)S.vlog.length=300;lsSet('tgkflow.vlog',S.vlog);renderVlog();}}
  else if(a==='vlogclr'){if(confirm('Clear the whole validation log?')){S.vlog=[];lsSet('tgkflow.vlog',S.vlog);renderVlog();}}
  else if(a==='vlogcsv'){var rows=[['Date','SKU','Label','Part','CFM','Pressure (in. of water)','Pressure is','Real K','Simulated K','Difference (%)','Calibrated','Used to calibrate']];S.vlog.forEach(function(e){rows.push([e.t,e.sku,e.label,e.part,e.cfm,e.dp,e.type,num(e.Kreal,3),num(e.Ksim,3),num(e.diff,1),e.calibrated?'yes':'no',e.tuned?'yes':'no']);});download(new Blob([rows.map(function(r){return r.map(csvEsc).join(',');}).join('\r\n')],{type:'text/csv'}),'TGK_validation_log.csv');}
  else if(a==='sheet'){if(needReady())download(new Blob([customerSheetHtml()],{type:'text/html'}),'TGK_customer_sheet_'+(S.sku||stamp())+'.html');}
  else if(a==='sheetprint'){if(!needReady())return;var sh=customerSheetHtml(),sw=window.open('','_blank');if(!sw){alert('The browser blocked the new window. Use Customer sheet to download it and print from there.');return;}sw.document.write(sh);sw.document.close();setTimeout(function(){try{sw.focus();sw.print();}catch(e){}},600);}
  else if(a==='package'){if(needReady())publishPackage();}
  else if(a==='runsave'){if(needReady())saveRun();}
  else if(a==='rundel'){S.runs.splice(+b.getAttribute('data-i'),1);lsSet('tgkflow.runs',S.runs);renderRuns();}
  else if(a==='runjson'){var re=S.runs[+b.getAttribute('data-i')];if(re)download(new Blob([JSON.stringify(re,null,2)],{type:'application/json'}),'TGK_flow_run_'+(re.sku||re.id)+'.json');}
  else if(a==='runsall'){download(new Blob([JSON.stringify(S.runs,null,2)],{type:'application/json'}),'TGK_flow_runs.json');}
  else if(a==='gifdl'){if(S.gif.blob)download(S.gif.blob,'TGK_flow_loop_'+stamp()+'.'+({mp4:'mp4',webp:'webp',gif:'gif'}[S.gif.outFmt]||'gif'));}
  else if(a==='shot'){shotPending=true;}
  else if(a==='freeze'){var fl=readyList(),fz=fl.length&&fl.every(function(s){return s.frozen;});fl.forEach(function(s){s.frozen=!fz;s.thawed=!!fz;});checkFreeze();}
  else if(a==='shotdel'){S.shots.splice(+b.getAttribute('data-i'),1);renderShots();}
  else if(a==='refadd'){S.refs.push({label:'Reference '+(S.refs.length+1),model:'a',cfm:'',dp:'',type:'bench'});renderRef();}
  else if(a==='refdel'){S.refs.splice(+b.getAttribute('data-i'),1);renderRef();}
  else if(a==='refcal'){var rr=S.refs[+b.getAttribute('data-i')],cc=rr&&refCalc(rr);if(cc&&cc.ok&&cc.settled&&cc.raw>0){rr.tuned=true;S.calib=cc.Kref/cc.raw;S.calibInfo='Calibrated to reference point "'+rr.label+'" (real K '+cc.Kref.toFixed(2)+'). The same correction applies to both models.';renderRef();renderNotes();}}
  else if(a==='exp-csv'){if(needReady())download(new Blob([csvOf(collectReport())],{type:'text/csv'}),'TGK_flow_results_'+stamp()+'.csv');}
  else if(a==='exp-json'){if(needReady())download(new Blob([JSON.stringify(collectReport(),null,2)],{type:'application/json'}),'TGK_flow_results_'+stamp()+'.json');}
  else if(a==='exp-html'){if(needReady())download(new Blob([htmlReport(collectReport())],{type:'text/html'}),'TGK_flow_report_'+stamp()+'.html');}
  else if(a==='exp-print'){if(!needReady())return;var html=htmlReport(collectReport()),w=window.open('','_blank');if(!w){alert('The browser blocked the new window. Use Download report, open the file, and print it from there.');return;}w.document.write(html);w.document.close();setTimeout(function(){try{w.focus();w.print();}catch(e){}},600);}
  else if(a==='sweep'){S.sweeping=!S.sweeping;S.sweepT0=performance.now();render();}
  else if(a==='cam'){var cp={front:[0,0],top:[0,1.45],side:[1.5708,0],iso:[0.55,0.32],inlet:[-1.5708,0]}[b.getAttribute('data-v')];if(cp){S.cam={yaw:cp[0],pitch:cp[1],zoom:1,panX:0,panY:0};}}
  else if(a==='load'){loadTarget=b.getAttribute('data-m');file3d.click();}
  else if(a==='engcfm'){S.target=Math.round(cfmAt(S.eng.rpm));var te=document.getElementById('k_target');if(te)te.value=S.target;}
  else if(a==='calib'){
    var qe=document.getElementById('k_calibQ'),qk=qe?parseFloat(qe.value):NaN,sa=sims.a;
    if(!(qk>0)){alert('Enter the CFM that Model A actually flowed on a bench at the test pressure above.');return;}
    if(!sa.m||sa.m.K==null||!isFinite(sa.m.K)||sa.m.K<=0){alert('Model A has no loss number yet. Let it run, then calibrate.');return;}
    if(sa.ft()<2&&!confirm('Model A has not settled yet (under 2 flow-throughs). Calibrate anyway?'))return;
    var Ar=Math.PI*Math.pow(S.a.id/1000,2)/4,dP=S.benchIn*249.089,qm=qk/2118.88,c=(2*dP*Ar*Ar/(rhoAir()*qm*qm)-1)/sa.m.K;
    if(!(c>0)){alert('That CFM is more than a '+S.a.id+' mm inlet can flow at '+S.benchIn+' in. of water even with zero loss. Check the diameter and test pressure.');return;}
    S.calib=c;S.calibInfo='Calibrated so '+(S.a.label||'Model A')+' flows '+qk+' CFM at '+S.benchIn+' in. of water. The same correction applies to Model B.';render();
  }
  else if(a==='uncalib'){S.calib=1;S.calibInfo='';render();}
});
