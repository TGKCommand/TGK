<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGK Notes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ffffff;--bg2:#f7f8fa;--bg3:#f0f2f5;--bg4:#e9ebee;
  --field:#ECEEF0;
  --border:#e2e6eb;--border2:#c8cdd5;
  --text:#111827;--text2:#374151;--text3:#6b7280;
  --teal:#0d9488;--teal-d:#0f766e;--teal-dim:rgba(13,148,136,.09);
  --orange:#ea580c;--orange-dim:rgba(234,88,12,.09);
  --red:#dc2626;--green:#16a34a;
  --font:'DM Sans',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  --r:4px;--r-lg:6px;--sidebar:270px;
}
body{font-family:var(--font);background:var(--field);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}

/* ---------- login ---------- */
#gate{position:fixed;inset:0;background:var(--field);display:flex;align-items:center;justify-content:center;z-index:100}
.gate-box{background:#fff;border-radius:var(--r-lg);padding:30px 32px;width:360px;box-shadow:0 1px 2px rgba(14,20,24,.05),0 0 0 1px var(--border)}
.gate-box h1{font-size:17px;font-weight:800;letter-spacing:.01em;margin-bottom:3px}
.gate-box p{font-size:11.5px;color:var(--text3);margin-bottom:18px}
.fld{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;margin-bottom:9px;background:#fff;outline:none}
.fld:focus{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-dim)}
.btn{background:#fff;border:1px solid var(--border2);border-radius:var(--r);padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--text2)}
.btn:hover{background:var(--bg3)}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn-primary:hover{background:#c2410c}
.btn-w{width:100%;justify-content:center}
#login-error{color:var(--red);font-size:11.5px;min-height:16px;margin-top:6px}

/* ---------- shell ---------- */
#app{display:none;height:100vh;overflow:hidden}
.top{height:46px;background:#141618;display:flex;align-items:center;gap:12px;padding:0 14px;position:relative;flex-shrink:0}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--teal) 0,var(--teal) 6%,var(--orange) 55%,rgba(0,0,0,0) 94%)}
.top .brand{font-weight:800;font-size:13px;color:#EDF1F0;letter-spacing:.02em}
.top .brand span{color:var(--teal)}
.top .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.top .who{font-size:11.5px;color:#8b96a0}
.top .ver{font-family:var(--mono);font-size:9.5px;color:#7E8994}
.top .tbtn{background:none;border:1px solid #2b2f33;color:#c9d1d6;border-radius:var(--r);padding:4px 9px;font-size:11px}
.top .tbtn:hover{background:#1d2124}
.body{display:flex;height:calc(100vh - 46px)}

/* ---------- sidebar ---------- */
.side{width:var(--sidebar);background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
.side-top{padding:10px;border-bottom:1px solid var(--border)}
.side-search{width:100%;padding:7px 9px;border:1px solid var(--border2);border-radius:var(--r);font-size:12px;background:#fff;outline:none}
.side-search:focus{border-color:var(--teal)}
.side-scroll{flex:1;overflow-y:auto;padding:8px 6px}
.side-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--text3);text-transform:uppercase;padding:6px 8px 4px}
.pg{display:flex;align-items:center;gap:5px;padding:5px 8px;border-radius:var(--r);cursor:pointer;font-size:13px;color:var(--text2);user-select:none}
.pg:hover{background:var(--bg4)}
.pg.on{background:var(--teal-dim);color:var(--teal-d);font-weight:600}
.pg .tw{width:14px;text-align:center;font-size:9px;color:var(--text3);flex-shrink:0}
.pg .ic{width:16px;text-align:center;flex-shrink:0}
.pg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .act{opacity:0;background:none;border:none;color:var(--text3);font-size:13px;padding:0 3px;line-height:1}
.pg:hover .act{opacity:1}
.pg .act:hover{color:var(--teal)}
.side-foot{padding:9px 10px;border-top:1px solid var(--border)}

/* ---------- editor ---------- */
.main{flex:1;overflow-y:auto;background:var(--bg)}
.doc{max-width:820px;margin:0 auto;padding:44px 60px 220px}
.crumb{font-size:11px;color:var(--text3);margin-bottom:16px;display:flex;gap:6px;flex-wrap:wrap}
.crumb b{font-weight:600;color:var(--text2)}
.doc-ic{font-size:44px;line-height:1;margin-bottom:8px;cursor:pointer;display:inline-block;border-radius:var(--r);padding:2px 4px}
.doc-ic:hover{background:var(--bg3)}
.doc-title{font-size:36px;font-weight:800;letter-spacing:-.02em;outline:none;line-height:1.15;margin-bottom:16px}
.doc-title:empty::before{content:'Untitled';color:#c8cdd5}
.empty{color:var(--text3);text-align:center;padding:80px 20px}
.empty h2{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}

/* blocks */
.bk{display:flex;align-items:flex-start;gap:4px;position:relative;padding:1px 0;border-radius:3px}
.bk.drag-over{box-shadow:inset 0 2px 0 var(--teal)}
.bk-handle{opacity:0;flex-shrink:0;width:16px;text-align:center;color:var(--border2);cursor:grab;font-size:12px;line-height:1.7;user-select:none}
.bk:hover .bk-handle{opacity:1}
.bk-mk{flex-shrink:0;min-width:18px;text-align:right;color:var(--text3);user-select:none;font-size:14px;line-height:1.65}
.bk-t{flex:1;outline:none;line-height:1.65;min-height:1.65em;word-break:break-word;padding:1px 2px}
.bk-t:empty::before{content:attr(data-ph);color:#c8cdd5;pointer-events:none}
.bk[data-type=h1] .bk-t{font-size:26px;font-weight:800;letter-spacing:-.01em;margin-top:18px;line-height:1.3}
.bk[data-type=h2] .bk-t{font-size:20px;font-weight:700;margin-top:14px;line-height:1.35}
.bk[data-type=h3] .bk-t{font-size:16px;font-weight:700;margin-top:10px;line-height:1.4}
.bk[data-type=quote]{border-left:3px solid var(--border2);padding-left:10px;margin:3px 0}
.bk[data-type=quote] .bk-t{color:var(--text2);font-style:italic}
.bk[data-type=callout]{background:var(--teal-dim);border-radius:var(--r-lg);padding:9px 12px;margin:5px 0}
.bk[data-type=code]{background:#141618;border-radius:var(--r-lg);padding:10px 12px;margin:5px 0}
.bk[data-type=code] .bk-t{font-family:var(--mono);font-size:12.5px;color:#E4E9EC;white-space:pre-wrap;line-height:1.6}
.bk[data-type=code] .bk-t:empty::before{color:#5a6570}
.bk[data-type=code] .bk-handle{color:#4a5560}
.bk[data-type=todo] .bk-t.done{text-decoration:line-through;color:var(--text3)}
.bk-cb{width:15px;height:15px;margin-top:4px;cursor:pointer;accent-color:var(--teal)}
.bk-div{flex:1;height:1px;background:var(--border2);margin:11px 0}

/* slash menu */
#slash{position:absolute;z-index:60;background:#fff;border-radius:var(--r-lg);box-shadow:0 8px 28px rgba(14,20,24,.18),0 0 0 1px var(--border);width:260px;max-height:300px;overflow-y:auto;padding:5px;display:none}
#slash .si{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r);cursor:pointer;font-size:13px}
#slash .si.sel,#slash .si:hover{background:var(--teal-dim)}
#slash .si .em{width:20px;text-align:center;font-size:14px}
#slash .si .d{font-size:10.5px;color:var(--text3)}
#slash .sh{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;color:var(--text3);text-transform:uppercase;padding:6px 9px 3px}

/* toast + status */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#141618;color:#EDF1F0;padding:10px 18px;border-radius:5px;font-size:12.5px;z-index:200;transition:transform .25s;max-width:80vw;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.savest{font-family:var(--mono);font-size:9.5px;color:var(--text3)}
@media(max-width:860px){
  .side{position:fixed;left:0;top:46px;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .doc{padding:26px 20px 200px}
  .doc-title{font-size:27px}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-box">
    <h1>TGK <span style="color:#0d9488">Notes</span></h1>
    <p>Sign in with your TGK account.</p>
    <input id="login-email" class="fld" type="email" placeholder="you@tgkmotorsport.com" autocomplete="username">
    <input id="login-password" class="fld" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary btn-w" onclick="doLogin()">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<div id="app">
  <div class="top">
    <button class="tbtn" id="menu-btn" style="display:none" onclick="document.querySelector('.side').classList.toggle('open')">&#9776;</button>
    <div class="brand">TGK <span>Notes</span></div>
    <div class="sp">
      <span class="savest" id="savest"></span>
      <span class="who" id="who"></span>
      <button class="tbtn" onclick="doLogout()">Sign out</button>
      <span class="ver" id="ver"></span>
    </div>
  </div>
  <div class="body">
    <div class="side">
      <div class="side-top">
        <input id="q" class="side-search" placeholder="Search pages..." oninput="renderTree()">
      </div>
      <div class="side-scroll">
        <div class="side-lbl">Workspace</div>
        <div id="tree"></div>
      </div>
      <div class="side-foot">
        <button class="btn btn-w" onclick="newPage(null)">+ New page</button>
      </div>
    </div>
    <div class="main" id="main"><div class="doc" id="doc"></div></div>
  </div>
</div>

<div id="slash"></div>
<div id="toast"></div>

<script>
const TGK_NOTES_VERSION='v0.1';
const SUPABASE_URL="https://piamamighqiielfztgic.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const S={user:null,pages:[],activeId:null,collapsed:{},dirty:false,saving:false};
const $=id=>document.getElementById(id);
const uid=()=>'b'+Math.random().toString(36).slice(2,10);
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let _tt;
function toast(m,ms){clearTimeout(_tt);const t=$('toast');t.textContent=m;t.classList.add('on');_tt=setTimeout(()=>t.classList.remove('on'),ms||2600);}

/* ============================ auth ============================ */
async function doLogin(){
  const email=$('login-email').value.trim(),pass=$('login-password').value,err=$('login-error');
  err.textContent='';
  if(!email||!pass){err.textContent='Enter email and password.';return;}
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    await afterLogin(data.user);
  }catch(e){err.textContent=e.message||'Sign-in failed.';}
}
async function doLogout(){await sb.auth.signOut();location.reload();}
async function afterLogin(user){
  S.user=user;
  $('gate').style.display='none';
  $('app').style.display='block';
  $('who').textContent=(user.email||'').split('@')[0];
  $('ver').textContent=TGK_NOTES_VERSION;
  if(window.innerWidth<=860)$('menu-btn').style.display='';
  await loadPages();
}
(async()=>{
  const{data}=await sb.auth.getSession();
  if(data&&data.session)await afterLogin(data.session.user);
})();

/* ============================ data ============================ */
async function loadPages(){
  try{
    const{data,error}=await sb.from('wiki_pages').select('*').eq('archived',false).order('sort_order');
    if(error)throw error;
    S.pages=data||[];
  }catch(e){
    const m=String(e.message||e);
    if(/does not exist|schema cache/i.test(m)){
      $('doc').innerHTML='<div class="empty"><h2>One migration needed</h2><p style="font-size:12.5px">The <b>wiki_pages</b> table does not exist yet. Run <b>sql/add_wiki_pages.sql</b> in the Supabase SQL editor, then reload.</p></div>';
      return;
    }
    if(/row-level security|permission denied/i.test(m)){
      $('doc').innerHTML='<div class="empty"><h2>Database is blocking access</h2><p style="font-size:12.5px">Row-level security is on for <b>wiki_pages</b> with no policy for signed-in users. The policies are at the bottom of <b>sql/add_wiki_pages.sql</b>.</p></div>';
      return;
    }
    toast('Load failed: '+m,6000);return;
  }
  renderTree();
  const first=S.pages.find(p=>!p.parent_id)||S.pages[0];
  if(S.activeId&&S.pages.some(p=>p.id===S.activeId))openPage(S.activeId);
  else if(first)openPage(first.id);
  else renderDoc();
}
function pageById(id){return S.pages.find(p=>p.id===id);}
function childrenOf(pid){return S.pages.filter(p=>(p.parent_id||null)===(pid||null)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));}
function nextSort(pid){const k=childrenOf(pid);return k.length?(Number(k[k.length-1].sort_order)||0)+1000:1000;}

async function newPage(parentId){
  const row={title:'Untitled',icon:'',parent_id:parentId||null,sort_order:nextSort(parentId||null),
             content:[{id:uid(),type:'p',text:'',indent:0}],created_by:S.user?S.user.email:null};
  try{
    const{data,error}=await sb.from('wiki_pages').insert(row).select().single();
    if(error)throw error;
    S.pages.push(data);
    if(parentId)S.collapsed[parentId]=false;
    renderTree();openPage(data.id);
    setTimeout(()=>{const t=document.querySelector('.doc-title');if(t)t.focus();},60);
  }catch(e){toast(writeErr(e,'create the page'),9000);}
}
async function deletePage(id){
  const p=pageById(id);if(!p)return;
  const kids=childrenOf(id).length;
  if(!confirm('Delete "'+(p.title||'Untitled')+'"'+(kids?(' and its '+kids+' sub-page(s)'):'')+'? This cannot be undone.'))return;
  try{
    const{error}=await sb.from('wiki_pages').delete().eq('id',id);
    if(error)throw error;
    const drop=new Set([id]);
    let grew=true;
    while(grew){grew=false;S.pages.forEach(x=>{if(x.parent_id&&drop.has(x.parent_id)&&!drop.has(x.id)){drop.add(x.id);grew=true;}});}
    S.pages=S.pages.filter(x=>!drop.has(x.id));
    if(drop.has(S.activeId))S.activeId=null;
    renderTree();
    const f=S.pages[0];if(f)openPage(f.id);else renderDoc();
    toast('Page deleted');
  }catch(e){toast(writeErr(e,'delete the page'),9000);}
}
function writeErr(e,verb){
  const m=String((e&&e.message)||e||'');
  if(/row-level security|permission denied/i.test(m))return 'Could not '+verb+': the database is blocking writes to wiki_pages (row-level security with no policy). Run the policy block in sql/add_wiki_pages.sql.';
  if(/does not exist|schema cache/i.test(m))return 'Could not '+verb+': the wiki_pages table is missing. Run sql/add_wiki_pages.sql.';
  return 'Could not '+verb+': '+m;
}

let _saveT=null;
function markDirty(){
  S.dirty=true;$('savest').textContent='unsaved';
  clearTimeout(_saveT);_saveT=setTimeout(savePage,700);
}
async function savePage(){
  const p=pageById(S.activeId);
  if(!p||!S.dirty||S.saving)return;
  S.saving=true;$('savest').textContent='saving...';
  try{
    const{error}=await sb.from('wiki_pages').update({title:p.title,icon:p.icon,content:p.content}).eq('id',p.id);
    if(error)throw error;
    S.dirty=false;$('savest').textContent='saved';
    setTimeout(()=>{if(!S.dirty)$('savest').textContent='';},1800);
  }catch(e){$('savest').textContent='save failed';toast(writeErr(e,'save'),9000);}
  finally{S.saving=false;}
}
window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue='';}});

/* ============================ sidebar ============================ */
function matchesQuery(p,q){
  if(!q)return true;
  if((p.title||'').toLowerCase().includes(q))return true;
  return (p.content||[]).some(b=>String(b.text||'').toLowerCase().includes(q));
}
function renderTree(){
  const q=($('q').value||'').trim().toLowerCase();
  const keep=new Set();
  if(q){
    S.pages.forEach(p=>{
      if(matchesQuery(p,q)){
        keep.add(p.id);
        let cur=p;
        while(cur&&cur.parent_id){keep.add(cur.parent_id);cur=pageById(cur.parent_id);}
      }
    });
  }
  const walk=(pid,depth)=>childrenOf(pid).filter(p=>!q||keep.has(p.id)).map(p=>{
    const kids=childrenOf(p.id).filter(k=>!q||keep.has(k.id));
    const open=q?true:!S.collapsed[p.id];
    return '<div class="pg'+(p.id===S.activeId?' on':'')+'" style="padding-left:'+(8+depth*13)+'px" onclick="openPage(\''+p.id+'\')">'
      +'<span class="tw" onclick="event.stopPropagation();toggleTw(\''+p.id+'\')">'+(kids.length?(open?'\u25be':'\u25b8'):'')+'</span>'
      +'<span class="ic">'+(p.icon?esc(p.icon):'\u{1F4C4}')+'</span>'
      +'<span class="nm">'+esc(p.title||'Untitled')+'</span>'
      +'<button class="act" title="Add sub-page" onclick="event.stopPropagation();newPage(\''+p.id+'\')">+</button>'
      +'<button class="act" title="Delete" onclick="event.stopPropagation();deletePage(\''+p.id+'\')">\u00d7</button>'
      +'</div>'+(open&&kids.length?walk(p.id,depth+1):'');
  }).join('');
  const html=walk(null,0);
  $('tree').innerHTML=html||'<div style="padding:10px 9px;font-size:11.5px;color:var(--text3)">'+(q?'No matches.':'No pages yet.')+'</div>';
}
function toggleTw(id){S.collapsed[id]=!S.collapsed[id];renderTree();}

/* ============================ editor ============================ */
const BLOCKS=[
  {t:'p',em:'\u00b6',n:'Text',d:'Plain paragraph'},
  {t:'h1',em:'H1',n:'Heading 1',d:'Big section heading'},
  {t:'h2',em:'H2',n:'Heading 2',d:'Medium heading'},
  {t:'h3',em:'H3',n:'Heading 3',d:'Small heading'},
  {t:'bullet',em:'\u2022',n:'Bulleted list',d:'Simple bullet'},
  {t:'num',em:'1.',n:'Numbered list',d:'Ordered list'},
  {t:'todo',em:'\u2611',n:'To-do',d:'Checkbox item'},
  {t:'quote',em:'\u275d',n:'Quote',d:'Callout a passage'},
  {t:'callout',em:'\u{1F4A1}',n:'Callout',d:'Highlighted note'},
  {t:'code',em:'\u2039\u203a',n:'Code',d:'Monospace block'},
  {t:'divider',em:'\u2014',n:'Divider',d:'Horizontal rule'}
];
function curPage(){return pageById(S.activeId);}
function blocks(){const p=curPage();return p?(p.content||[]):[];}

function openPage(id){
  if(S.dirty)savePage();
  S.activeId=id;renderTree();renderDoc();
}
function renderDoc(){
  const p=curPage();
  if(!p){$('doc').innerHTML='<div class="empty"><h2>Nothing open</h2><p style="font-size:12.5px">Create a page to get started.</p></div>';return;}
  if(!Array.isArray(p.content)||!p.content.length)p.content=[{id:uid(),type:'p',text:'',indent:0}];
  const trail=[];let cur=p;
  while(cur){trail.unshift(cur);cur=cur.parent_id?pageById(cur.parent_id):null;}
  $('doc').innerHTML=
    '<div class="crumb">'+trail.map((t,i)=>(i?'<span>/</span>':'')+'<b>'+esc(t.title||'Untitled')+'</b>').join(' ')+'</div>'
    +'<div class="doc-ic" onclick="pickIcon()" title="Change icon">'+(p.icon?esc(p.icon):'\u{1F4C4}')+'</div>'
    +'<div class="doc-title" contenteditable="true" spellcheck="true">'+esc(p.title==='Untitled'?'':p.title)+'</div>'
    +'<div id="blocks"></div>';
  const t=$('doc').querySelector('.doc-title');
  t.addEventListener('input',()=>{p.title=t.textContent.trim()||'Untitled';markDirty();renderTree();});
  t.addEventListener('keydown',e=>{
    if(e.key==='Enter'){e.preventDefault();const b=blocks();focusBlock(b[0]?b[0].id:null);}
  });
  renderBlocks();
}
function pickIcon(){
  const p=curPage();if(!p)return;
  const v=prompt('Page icon (paste any emoji, or leave blank to clear):',p.icon||'');
  if(v===null)return;
  p.icon=(v||'').trim().slice(0,4);markDirty();renderDoc();renderTree();
}
function numberFor(i){
  const b=blocks();let n=1;
  for(let k=i-1;k>=0;k--){
    if(b[k].indent<b[i].indent)break;
    if(b[k].indent>b[i].indent)continue;
    if(b[k].type!=='num')break;
    n++;
  }
  return n;
}
function renderBlocks(){
  const b=blocks();
  $('blocks').innerHTML=b.map((bl,i)=>{
    const pad=(bl.indent||0)*24;
    let mk='';
    if(bl.type==='bullet')mk='<span class="bk-mk">\u2022</span>';
    else if(bl.type==='num')mk='<span class="bk-mk">'+numberFor(i)+'.</span>';
    else if(bl.type==='todo')mk='<input type="checkbox" class="bk-cb"'+(bl.checked?' checked':'')+' data-cb="'+bl.id+'">';
    else if(bl.type==='callout')mk='<span class="bk-mk">\u{1F4A1}</span>';
    if(bl.type==='divider')
      return '<div class="bk" data-bid="'+bl.id+'" data-type="divider" style="margin-left:'+pad+'px"><span class="bk-handle" draggable="true">\u2059</span><div class="bk-div"></div></div>';
    const ph=i===0?"Type '/' for commands":'';
    return '<div class="bk" data-bid="'+bl.id+'" data-type="'+bl.type+'" style="margin-left:'+pad+'px">'
      +'<span class="bk-handle" draggable="true">\u2059</span>'+mk
      +'<div class="bk-t'+(bl.type==='todo'&&bl.checked?' done':'')+'" contenteditable="true" spellcheck="true" data-ph="'+ph+'">'+esc(bl.text||'')+'</div>'
      +'</div>';
  }).join('');
}
function blockIndex(id){return blocks().findIndex(x=>x.id===id);}
function focusBlock(id,atStart,offset){
  if(!id)return;
  const el=document.querySelector('[data-bid="'+id+'"] .bk-t');
  if(!el){return;}
  el.focus();
  const r=document.createRange(),sel=window.getSelection();
  if(typeof offset==='number'&&el.firstChild){
    const max=(el.firstChild.textContent||'').length;
    r.setStart(el.firstChild,Math.max(0,Math.min(offset,max)));r.collapse(true);
  }else{r.selectNodeContents(el);r.collapse(!!atStart);}
  sel.removeAllRanges();sel.addRange(r);
}
function caretOffset(el){
  const sel=window.getSelection();
  if(!sel.rangeCount)return 0;
  const r=sel.getRangeAt(0).cloneRange();
  r.selectNodeContents(el);r.setEnd(sel.getRangeAt(0).endContainer,sel.getRangeAt(0).endOffset);
  return r.toString().length;
}

/* --- delegated editor events --- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.classList||!t.classList.contains('bk-t'))return;
  const host=t.closest('.bk'),id=host.getAttribute('data-bid'),i=blockIndex(id);
  if(i<0)return;
  const bl=blocks()[i];
  bl.text=t.textContent;
  // markdown shortcuts (paragraphs only)
  if(bl.type==='p'){
    const map=[['# ','h1'],['## ','h2'],['### ','h3'],['- ','bullet'],['* ','bullet'],
               ['1. ','num'],['[] ','todo'],['[ ] ','todo'],['> ','quote'],['``` ','code'],['--- ','divider']];
    for(const[pre,ty]of map){
      if(bl.text.startsWith(pre)){
        bl.type=ty;bl.text=bl.text.slice(pre.length);
        if(ty==='divider'){bl.text='';}
        renderBlocks();
        if(ty==='divider'){addBlockAfter(i,'p');}else focusBlock(id);
        markDirty();return;
      }
    }
  }
  if(bl.text.startsWith('/'))openSlash(host,bl.text.slice(1));else closeSlash();
  markDirty();
},true);

document.addEventListener('keydown',e=>{
  if(slashOpen&&['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)){slashKey(e);return;}
  const t=e.target;
  if(!t.classList||!t.classList.contains('bk-t'))return;
  const host=t.closest('.bk'),id=host.getAttribute('data-bid'),i=blockIndex(id),b=blocks(),bl=b[i];
  if(i<0)return;
  if(e.key==='Enter'&&!e.shiftKey){
    if(bl.type==='code'){return;} // newlines inside code
    e.preventDefault();
    const off=caretOffset(t),txt=bl.text||'';
    const before=txt.slice(0,off),after=txt.slice(off);
    bl.text=before;
    const carry=(bl.type==='bullet'||bl.type==='num'||bl.type==='todo')&&before!==''?bl.type:'p';
    if(before===''&&after===''&&bl.type!=='p'){bl.type='p';renderBlocks();focusBlock(id);markDirty();return;}
    const nb={id:uid(),type:carry,text:after,indent:bl.indent||0,checked:false};
    b.splice(i+1,0,nb);renderBlocks();focusBlock(nb.id,true);markDirty();return;
  }
  if(e.key==='Backspace'){
    const off=caretOffset(t);
    if(off===0){
      if(bl.type!=='p'){e.preventDefault();bl.type='p';renderBlocks();focusBlock(id,true);markDirty();return;}
      if((bl.indent||0)>0){e.preventDefault();bl.indent--;renderBlocks();focusBlock(id,true);markDirty();return;}
      if(i>0){
        e.preventDefault();
        const prev=b[i-1];
        if(prev.type==='divider'){b.splice(i-1,1);renderBlocks();focusBlock(id,true);markDirty();return;}
        const at=(prev.text||'').length;
        prev.text=(prev.text||'')+(bl.text||'');
        b.splice(i,1);renderBlocks();focusBlock(prev.id,false,at);markDirty();return;
      }
    }
  }
  if(e.key==='Tab'){
    e.preventDefault();
    if(e.shiftKey){if((bl.indent||0)>0)bl.indent--;}
    else if(i>0&&(bl.indent||0)<6)bl.indent=(bl.indent||0)+1;
    renderBlocks();focusBlock(id);markDirty();return;
  }
  if(e.key==='ArrowUp'&&i>0&&caretOffset(t)===0){e.preventDefault();focusBlock(b[i-1].id);}
  if(e.key==='ArrowDown'&&i<b.length-1&&caretOffset(t)===(bl.text||'').length){e.preventDefault();focusBlock(b[i+1].id,true);}
},true);

document.addEventListener('change',e=>{
  const cb=e.target.getAttribute&&e.target.getAttribute('data-cb');
  if(!cb)return;
  const bl=blocks()[blockIndex(cb)];
  if(!bl)return;
  bl.checked=e.target.checked;renderBlocks();markDirty();
});
// paste as plain text so Word/Shopify HTML never leaks into a block
document.addEventListener('paste',e=>{
  const t=e.target;
  if(!t.classList||(!t.classList.contains('bk-t')&&!t.classList.contains('doc-title')))return;
  e.preventDefault();
  const txt=(e.clipboardData||window.clipboardData).getData('text/plain')||'';
  if(t.classList.contains('doc-title')){document.execCommand('insertText',false,txt.replace(/\n/g,' '));return;}
  const lines=txt.split(/\r?\n/);
  if(lines.length<2){document.execCommand('insertText',false,txt);return;}
  const host=t.closest('.bk'),id=host.getAttribute('data-bid'),i=blockIndex(id),b=blocks();
  b[i].text=(b[i].text||'')+lines[0];
  let at=i;
  lines.slice(1).forEach(l=>{at++;b.splice(at,0,{id:uid(),type:'p',text:l,indent:b[i].indent||0});});
  renderBlocks();focusBlock(b[at].id);markDirty();
},true);

function addBlockAfter(i,type){
  const b=blocks(),nb={id:uid(),type:type||'p',text:'',indent:(b[i]&&b[i].indent)||0};
  b.splice(i+1,0,nb);renderBlocks();focusBlock(nb.id);markDirty();return nb;
}

/* --- drag to reorder --- */
let dragId=null;
document.addEventListener('dragstart',e=>{
  const h=e.target.closest&&e.target.closest('.bk-handle');
  if(!h)return;
  dragId=h.closest('.bk').getAttribute('data-bid');
  e.dataTransfer.effectAllowed='move';
  try{e.dataTransfer.setData('text/plain',dragId);}catch(_){}
});
document.addEventListener('dragover',e=>{
  if(!dragId)return;
  const bk=e.target.closest&&e.target.closest('.bk');
  if(!bk)return;
  e.preventDefault();
  document.querySelectorAll('.bk.drag-over').forEach(x=>x.classList.remove('drag-over'));
  bk.classList.add('drag-over');
});
document.addEventListener('drop',e=>{
  if(!dragId)return;
  const bk=e.target.closest&&e.target.closest('.bk');
  document.querySelectorAll('.bk.drag-over').forEach(x=>x.classList.remove('drag-over'));
  if(bk){
    e.preventDefault();
    const targetId=bk.getAttribute('data-bid'),b=blocks();
    const from=blockIndex(dragId),to=blockIndex(targetId);
    if(from>-1&&to>-1&&from!==to){
      const[m]=b.splice(from,1);
      b.splice(to,0,m);
      renderBlocks();markDirty();
    }
  }
  dragId=null;
});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.bk.drag-over').forEach(x=>x.classList.remove('drag-over'));});

/* --- slash menu --- */
let slashOpen=false,slashSel=0,slashHost=null,slashList=[];
function openSlash(host,filter){
  const f=(filter||'').toLowerCase();
  slashList=BLOCKS.filter(x=>!f||x.n.toLowerCase().includes(f)||x.t.includes(f));
  if(!slashList.length){closeSlash();return;}
  slashHost=host;slashOpen=true;slashSel=0;
  const el=$('slash'),r=host.getBoundingClientRect();
  el.style.display='block';
  el.style.left=Math.min(r.left,window.innerWidth-280)+'px';
  el.style.top=(r.bottom+window.scrollY+4)+'px';
  drawSlash();
}
function drawSlash(){
  $('slash').innerHTML='<div class="sh">Blocks</div>'+slashList.map((x,i)=>
    '<div class="si'+(i===slashSel?' sel':'')+'" data-si="'+i+'"><span class="em">'+x.em+'</span><div><div>'+esc(x.n)+'</div><div class="d">'+esc(x.d)+'</div></div></div>').join('');
}
function closeSlash(){slashOpen=false;slashHost=null;$('slash').style.display='none';}
function slashKey(e){
  if(e.key==='Escape'){e.preventDefault();closeSlash();return;}
  if(e.key==='ArrowDown'){e.preventDefault();slashSel=(slashSel+1)%slashList.length;drawSlash();return;}
  if(e.key==='ArrowUp'){e.preventDefault();slashSel=(slashSel-1+slashList.length)%slashList.length;drawSlash();return;}
  if(e.key==='Enter'){e.preventDefault();applySlash(slashList[slashSel]);}
}
document.addEventListener('click',e=>{
  const si=e.target.closest&&e.target.closest('[data-si]');
  if(si&&slashOpen){applySlash(slashList[Number(si.getAttribute('data-si'))]);return;}
  if(slashOpen&&!e.target.closest('#slash'))closeSlash();
});
function applySlash(def){
  if(!def||!slashHost)return;
  const id=slashHost.getAttribute('data-bid'),i=blockIndex(id),b=blocks();
  if(i<0){closeSlash();return;}
  b[i].type=def.t;b[i].text='';
  if(def.t==='divider'){closeSlash();renderBlocks();addBlockAfter(i,'p');markDirty();return;}
  closeSlash();renderBlocks();focusBlock(id);markDirty();
}

/* --- shortcuts --- */
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();savePage();toast('Saved');}
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();$('q').focus();}
});
</script>
