/* ---------- version history ---------- */
const SNAP_EVERY_MS = 5*60*1000;   // at most one automatic snapshot per page per 5 min
const KEEP_VERSIONS = 30;
let _lastSnap = {};

async function snapshotPage(force){
  const p=curPage();
  if(!p)return false;
  const last=_lastSnap[p.id]||0;
  if(!force && (Date.now()-last)<SNAP_EVERY_MS)return false;
  _lastSnap[p.id]=Date.now();
  try{
    const{error}=await sb.from('wiki_page_versions').insert({
      page_id:p.id,title:p.title,content:p.content,
      page_type:p.page_type||'doc',saved_by:S.user?S.user.email:null});
    if(error)throw error;
    if(force)toast('\u2713 Version saved');
    pruneVersions(p.id);
    return true;
  }catch(e){
    const m=String(e.message||e);
    if(/does not exist|schema cache/i.test(m)){
      S._verMissing=true;
      if(force)toast('Version history needs one migration - run the wiki_page_versions block in sql/add_wiki_pages.sql',10000);
    }else if(force){toast('Could not save a version: '+m,8000);}
    return false;
  }
}
async function pruneVersions(pageId){
  try{
    const{data}=await sb.from('wiki_page_versions').select('id').eq('page_id',pageId).order('saved_at',{ascending:false});
    const extra=(data||[]).slice(KEEP_VERSIONS).map(r=>r.id);
    if(extra.length)await sb.from('wiki_page_versions').delete().in('id',extra);
  }catch(e){/* pruning is best-effort */}
}
function verWhen(ts){
  if(!ts)return '';
  const d=new Date(ts), now=Date.now(), diff=(now-d.getTime())/1000;
  if(diff<60)return 'just now';
  if(diff<3600)return Math.floor(diff/60)+' min ago';
  if(diff<86400)return Math.floor(diff/3600)+' h ago';
  return d.toLocaleString();
}
async function openHistory(){
  const p=curPage();
  if(!p){toast('Open a page first');return;}
  let rows=[];
  try{
    const{data,error}=await sb.from('wiki_page_versions').select('*').eq('page_id',p.id).order('saved_at',{ascending:false}).limit(KEEP_VERSIONS);

    nxModal('Version history',
      /does not exist|schema cache/i.test(m)

        : '<div class="nx-hint">Could not load history: '+esc(m)+'</div>',

/* ---------- markdown import ---------- */
function mdToBlocks(md){
  const lines=String(md||'').replace(/\r\n?/g,'\n').split('\n');
  const out=[];
  let i=0;
  const push=(type,text,extra)=>out.push(Object.assign({id:uid(),type:type,text:text||'',indent:0},extra||{}));
  while(i<lines.length){
    const raw=lines[i];
    const line=raw.replace(/\s+$/,'');
    // fenced code
    if(/^\s*```/.test(line)){
      const buf=[];i++;
      while(i<lines.length&&!/^\s*```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      push('code',buf.join('\n'));
      continue;
    }
    // table: a header row followed by a separator row
    if(/^\s*\|.*\|\s*$/.test(line)&&i+1<lines.length&&/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const rows=[];
      const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim().replace(/\\\|/g,'|'));
      rows.push(cells(line));
      i+=2;
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(cells(lines[i]));i++;}
      const w=Math.max.apply(null,rows.map(r=>r.length));
      rows.forEach(r=>{while(r.length<w)r.push('');});
      push('table','',{rows:rows,head:true});
      continue;
    }
    i++;
    if(!line.trim())continue;
    const indent=Math.floor((raw.match(/^ */)[0].length)/2);
    let m;
    if((m=/^\s*(#{1,3})\s+(.*)$/.exec(line))){push(m[1].length===1?'h1':m[1].length===2?'h2':'h3',m[2]);continue;}
    if(/^\s*(---+|\*\*\*+|___+)\s*$/.test(line)){push('divider','');continue;}
    if((m=/^\s*!\[([^\]]*)\]\(([^)]+)\)\s*$/.exec(line))){push('image',m[1],{src:m[2]});continue;}
    if((m=/^\s*[-*+]\s+\[([ xX])\]\s+(.*)$/.exec(line))){
      out.push({id:uid(),type:'todo',text:m[2],indent:indent,checked:/[xX]/.test(m[1])});continue;}
    if((m=/^\s*[-*+]\s+(.*)$/.exec(line))){out.push({id:uid(),type:'bullet',text:m[1],indent:indent});continue;}
    if((m=/^\s*\d+[.)]\s+(.*)$/.exec(line))){out.push({id:uid(),type:'num',text:m[1],indent:indent});continue;}
    if((m=/^\s*>\s?(.*)$/.exec(line))){push('quote',m[1]);continue;}
    out.push({id:uid(),type:'p',text:line.trim(),indent:indent});
  }
  if(!out.length)out.push({id:uid(),type:'p',text:'',indent:0});
  return out;
}
function firstHeading(bl){
  const h=(bl||[]).find(b=>b.type==='h1'&&String(b.text||'').trim());
  return h?h.text.trim():'';
}
function openImport(){
  nxModal('Import Markdown',
    '<label class="nx-l">Page title</label><input id="mi-title" class="nx-i" placeholder="Leave blank to use the first # heading">'
    +'<label class="nx-l">Paste Markdown</label>'
    +'<textarea id="mi-text" class="nx-i" style="height:230px;font-family:var(--mono);font-size:12px;resize:vertical" placeholder="# My SOP&#10;&#10;- step one&#10;- step two"></textarea>'
    +'<input type="file" id="mi-file" accept=".md,.markdown,.txt,text/*" style="display:none" onchange="importFile(this)">'
    +'<button class="nx-b sm" onclick="document.getElementById(\'mi-file\').click()">Load a .md file</button>'
    +'<div id="mi-note" class="nx-hint"></div>',
    '<span style="flex:1"></span><button class="nx-b" onclick="nxClose()">Cancel</button>'
    +'<button class="nx-b primary" onclick="doImport()">Create page</button>');
  setTimeout(()=>{const f=document.getElementById('mi-text');if(f)f.focus();},40);

function importFile(inp){
  const f=inp&&inp.files&&inp.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const t=document.getElementById('mi-text');
    if(t)t.value=String(r.result||'');
    const ti=document.getElementById('mi-title');
    if(ti&&!ti.value)ti.value=f.name.replace(/\.(md|markdown|txt)$/i,'');
    const n=document.getElementById('mi-note');
    if(n)n.textContent='Loaded '+f.name;
  };
  r.readAsText(f);
  inp.value='';
}
async function doImport(){
  const md=((document.getElementById('mi-text')||{}).value||'');
  if(!md.trim()){toast('Paste some Markdown first');return;}
  const blocksArr=mdToBlocks(md);
  const typed=((document.getElementById('mi-title')||{}).value||'').trim();
  const title=typed||firstHeading(blocksArr)||'Imported page';
  // if the title came from a leading H1, don't repeat it in the body
  if(!typed&&blocksArr.length&&blocksArr[0].type==='h1'&&blocksArr[0].text.trim()===title)blocksArr.shift();
  try{
    const row={title:title,icon:'',parent_id:null,sort_order:nextSort(null),page_type:'doc',
               content:blocksArr.length?blocksArr:[{id:uid(),type:'p',text:'',indent:0}],
               created_by:S.user?S.user.email:null};
    const{data,error}=await sb.from('wiki_pages').insert(row).select().single();
    if(error)throw error;
    S.pages.push(data);
    nxClose();renderTree();openPage(data.id);
    toast('\u2713 Imported '+blocksArr.length+' block'+(blocksArr.length!==1?'s':''));
  }catch(e){toast(writeErr(e,'import the page'),9000);}
}

   A relation property points at another DATABASE page and stores the ids of
   linked rows there. A rollup property reads through a relation and aggregates
   one property of the linked rows (count / sum / avg / min / max / list).
   Rollups are computed at render time - never stored - so they can never drift
   out of date with the rows they summarise.
   ====================================================================== */

const AGGS=[['count','Count'],['sum','Sum'],['avg','Average'],['min','Minimum'],
            ['max','Maximum'],['list','List values'],['empty','Count empty'],['filled','Count filled']];

/* ---------- rollups ---------- */
function rollupValue(r,pr){
  const rel=dbProp(pr.relProp);
  if(!rel)return {text:'\u2014',n:null};
  const tp=targetDb(rel);
  if(!tp)return {text:'\u2014',n:null};
  const ids=relIds(r,rel.id);
  const rows=targetRows(rel).filter(x=>ids.indexOf(x.id)>=0);
  if(pr.agg==='count')return {text:String(rows.length),n:rows.length};
  const tprops=((tp.content||{}).props)||[];
  const tprop=tprops.find(p=>p.id===pr.targetProp);
  if(!tprop)return {text:String(rows.length),n:rows.length};
  const raw=rows.map(x=>(x.cells||{})[tprop.id]);
  const vals=raw.filter(v=>v!==null&&v!==undefined&&v!=='');
  switch(pr.agg){
    case 'empty':  return {text:String(raw.length-vals.length),n:raw.length-vals.length};
    case 'filled': return {text:String(vals.length),n:vals.length};
    case 'list':   return {text:vals.map(v=>String(v)).join(', ')||'\u2014',n:null};
    default: {
      const nums=vals.map(v=>Number(v)).filter(v=>isFinite(v));
      if(!nums.length)return {text:'\u2014',n:null};
      let n;
      if(pr.agg==='sum')n=nums.reduce((a,b)=>a+b,0);
      else if(pr.agg==='avg')n=nums.reduce((a,b)=>a+b,0)/nums.length;
      else if(pr.agg==='min')n=Math.min.apply(null,nums);
      else if(pr.agg==='max')n=Math.max.apply(null,nums);
      else n=nums.length;
      const rounded=Math.round(n*100)/100;
      return {text:String(rounded),n:rounded};
    }
  }
}

  const v=rollupValue(r,pr);
  return '<span class="rollup" title="Calculated from '+esc((dbProp(pr.relProp)||{}).name||'a relation')+'">'+esc(v.text)+'</span>';
}

/* ======================================================================
   PHASE 10 - RICH TEXT + NOTION-STYLE CHROME
   Blocks previously stored plain text. They now store a small, strictly
   whitelisted subset of inline HTML (bold, italic, underline, strike, code,
   link, highlight) so the editor behaves like a real writing tool.
   Everything that reads a block as text goes through blockPlain().
   ====================================================================== */

const INLINE_OK={B:1,STRONG:1,I:1,EM:1,U:1,S:1,STRIKE:1,DEL:1,CODE:1,MARK:1,A:1,BR:1,SPAN:1};

/* Strip anything that is not a known inline tag. Runs on every keystroke's
   innerHTML, so a paste of arbitrary web HTML can never enter the model. */
function cleanInlineHTML(html){
  const box=document.createElement('div');
  box.innerHTML=String(html||'');
  const walk=node=>{
    // Walk live: unwrapping an unknown element promotes its children into this
    // node, and those MUST be re-examined. A snapshot loop let <div><img onerror>
    // through, because the img was promoted after the list was taken.
    let ch=node.firstChild;
    while(ch){
      const next=ch.nextSibling;
      if(ch.nodeType===3){ch=next;continue;}          // text
      if(ch.nodeType!==1){ch.remove();ch=next;continue;}
      const tag=ch.tagName;
      if(!INLINE_OK[tag]){                            // unwrap unknown elements
        const first=ch.firstChild;
        while(ch.firstChild)node.insertBefore(ch.firstChild,ch);
        ch.remove();
        ch=first||next;                               // re-examine what was promoted
        continue;
      }
      Array.prototype.slice.call(ch.attributes||[]).forEach(a=>{
        const n=a.name.toLowerCase();
        // 'person' must survive: an @teammate chip is a span carrying that class, and
        // stripping it on the next keystroke would silently un-style every mention.
        const keep=(tag==='A'&&n==='href')||(tag==='SPAN'&&n==='class'&&/^(tx-|bg-|fs-|ff-|person$)/.test(a.value));
        if(!keep)ch.removeAttribute(a.name);
      });
      if(tag==='A'){
        const h=ch.getAttribute('href')||'';
        if(/^\s*javascript:/i.test(h)||/^\s*data:/i.test(h))ch.removeAttribute('href');
        ch.setAttribute('target','_blank');ch.setAttribute('rel','noopener');
      }
      walk(ch);
      ch=next;
    }
  };
  walk(box);
  return box.innerHTML;
}
/* Plain text of a block, for markdown shortcuts, search, export and counts. */
function blockPlain(html){
  const box=document.createElement('div');
  box.innerHTML=String(html||'');
  return box.textContent||'';
}
/* Render: sanitize, then linkify @mentions only in the text between tags. */
function richHTML(html){
  const safe=cleanInlineHTML(html);
  if(typeof mentionify!=='function')return safe;
  return safe.split(/(<[^>]+>)/).map(part=>part.startsWith('<')?part:mentionify(part)).join('');
}

/* Strip tx-/bg- colour classes from any span that the range touches; unwrap empties. */
function clearInlineColor(range){
  if(!_fmtEl)return;
  var spans=Array.prototype.slice.call(_fmtEl.querySelectorAll('span'));
  spans.forEach(function(sp){
    var hit=true;if(range){try{hit=range.intersectsNode(sp);}catch(_e){hit=true;}}
    if(!hit)return;
    var keep=(sp.className||'').split(/\s+/).filter(function(c){return c&&!/^(tx-|bg-)/.test(c);});
    if(keep.length){sp.className=keep.join(' ');}
    else{while(sp.firstChild)sp.parentNode.insertBefore(sp.firstChild,sp);sp.remove();}
  });
}
/* Wrap the current selection in a colour span (or clear, when cls is empty). */
function stripInlineClass(range,prefix){
  if(!_fmtEl)return;
  var spans=Array.prototype.slice.call(_fmtEl.querySelectorAll('span'));
  spans.forEach(function(sp){
    var hit=true;if(range){try{hit=range.intersectsNode(sp);}catch(_e){hit=true;}}
    if(!hit)return;
    var keep=(sp.className||'').split(/\s+/).filter(function(c){return c&&c.indexOf(prefix)!==0;});
    if(keep.length)sp.className=keep.join(' ');
    else{while(sp.firstChild)sp.parentNode.insertBefore(sp.firstChild,sp);sp.remove();}
  });
}
function applyInlineFont(cls){

  if(prefix)stripInlineClass(range,prefix);
  if(cls&&cls.indexOf('-default')<0){
    var span=document.createElement('span');span.className=cls;
    try{range.surroundContents(span);}
    catch(_e){try{span.appendChild(range.extractContents());range.insertNode(span);}catch(__e){}}
  }
  syncFmt();closeFmtPop();hideFmt();
}

var _crz=null;
function colResizeStart(e,cg,lc,rc){
  e.preventDefault();
  var row=e.target.closest('.col-row');if(!row)return;
  var lEl=null,rEl=null;
  Array.prototype.slice.call(row.children).forEach(function(x){
    if(!x.classList||!x.classList.contains('col'))return;
    var cc=Number(x.getAttribute('data-col'));
    if(cc===lc)lEl=x;if(cc===rc)rEl=x;
  });
  if(!lEl||!rEl)return;
  var lw=parseFloat(getComputedStyle(lEl).flexGrow)||1;
  var rw=parseFloat(getComputedStyle(rEl).flexGrow)||1;
  _crz={cg:cg,lc:lc,rc:rc,lEl:lEl,rEl:rEl,x0:e.clientX,lw:lw,rw:rw,rowW:row.getBoundingClientRect().width||1,nl:null,nr:null};
  document.body.style.userSelect='none';
  document.addEventListener('mousemove',colResizeMove);
  document.addEventListener('mouseup',colResizeEnd);
}
function colResizeMove(e){
  if(!_crz)return;
  var total=_crz.lw+_crz.rw;
  var d=(e.clientX-_crz.x0)/_crz.rowW*total;
  var nl=Math.max(0.25,Math.min(total-0.25,_crz.lw+d));
  var nr=total-nl;
  _crz.lEl.style.flex=nl+' 1 0';_crz.rEl.style.flex=nr+' 1 0';
  _crz.nl=nl;_crz.nr=nr;
}
function colResizeEnd(){
  document.removeEventListener('mousemove',colResizeMove);
  document.removeEventListener('mouseup',colResizeEnd);
  document.body.style.userSelect='';
  if(_crz&&_crz.nl!=null){
    var b=blocks();
    var setw=function(ci,w){for(var k=0;k<b.length;k++){if(b[k].cg===_crz.cg&&(b[k].col||0)===ci){b[k].cw=Math.round(w*1000)/1000;break;}}};
    setw(_crz.lc,_crz.nl);setw(_crz.rc,_crz.nr);
    markDirty();
  }
  _crz=null;
}

function normalizeColumns(b){
  var i=0;
  while(i<b.length){
    if(!b[i].cg){i++;continue;}
    var cg=b[i].cg,j=i;
    while(j<b.length&&b[j].cg===cg)j++;
    var order=[];
    for(var k=i;k<j;k++){var c=b[k].col||0;if(order.indexOf(c)<0)order.push(c);}
    if(order.length<2){
      for(var k2=i;k2<j;k2++){delete b[k2].cg;delete b[k2].col;}
    }else{
      var map={};order.forEach(function(c,ix){map[c]=ix;});
      for(var k3=i;k3<j;k3++){b[k3].col=map[b[k3].col||0];}
      var run=b.slice(i,j);
      run.sort(function(a,c){return (a.col||0)-(c.col||0);});
      for(var k4=i;k4<j;k4++)b[k4]=run[k4-i];
    }
    i=j;
  }
}
function colRowHTML(b,start,end,_hid){
  var cg=b[start].cg,cols=[];
  for(var k=start;k<end;k++){
    var c=b[k].col||0,bucket=null;
    for(var q=0;q<cols.length;q++){if(cols[q].c===c){bucket=cols[q];break;}}
    if(!bucket){bucket={c:c,items:[]};cols.push(bucket);}
    bucket.items.push(k);
  }
  cols.sort(function(a,c){return a.c-c.c;});
  var out='<div class="col-row" data-cg="'+esc(cg)+'">';
  cols.forEach(function(col,ci){
    var w=Number(b[col.items[0]].cw)||1;
    out+='<div class="col" data-cg="'+esc(cg)+'" data-col="'+col.c+'" style="flex:'+w+' 1 0">';
    col.items.forEach(function(k){out+=(_hid[k]?'':blockHTML(b[k],k));});
    out+='</div>';
    if(ci<cols.length-1)out+='<div class="col-rz" onmousedown="colResizeStart(event,\''+esc(cg)+'\','+col.c+','+cols[ci+1].c+')" title="Drag to resize columns"></div>';

function colDrop(dragBid,targetBid,side){
  var b=blocks(),from=blockIndex(dragBid),to=blockIndex(targetBid);
  if(from<0||to<0||from===to)return;
  var dragged=b[from],target=b[to];
  if(target.cg){
    var cg=target.cg,tcol=target.col||0,ni=(side==='left')?tcol:tcol+1;
    b.forEach(function(x){if(x.cg===cg&&(x.col||0)>=ni)x.col=(x.col||0)+1;});

    var ncg='cg'+uid();

function drawComments(){
  const showRes=!!(document.getElementById('cm-showres')||{}).checked;
  const all=commentsFor(S._cmBlock,showRes);
  const l=document.getElementById('cm-list');
  if(!l)return;
  const tops=all.filter(function(c){return !c.parent_id;});
  l.innerHTML=tops.map(function(c){
    var reps=all.filter(function(x){return x.parent_id===c.id;});
    return _cmHTML(c,false)+reps.map(function(rc){return _cmHTML(rc,true);}).join('');
  }).join('')||'<div class="nx-hint">No comments on this block yet.</div>';
  updateReplyInd();

function updateReplyInd(){
  var el=document.getElementById('cm-reply-ind');if(!el)return;
  if(!S._cmReplyTo){el.style.display='none';el.innerHTML='';return;}
  var c=(S.comments||[]).find(function(x){return x.id===S._cmReplyTo;});
  var who=c?String(c.author||'someone').split('@')[0]:'comment';

async function addComment(){
  const t=document.getElementById('cm-new');
  const body=((t||{}).value||'').trim();
  if(!body){toast('Write something first');return;}
  const p=curPage();
  if(!p)return;
  const base={page_id:p.id,block_id:S._cmBlock,body:body,author:S.user?S.user.email:null};
  const payload=S._cmReplyTo?Object.assign({parent_id:S._cmReplyTo},base):base;
  try{
    const{data,error}=await sb.from('wiki_comments').insert(payload).select().single();
    if(error)throw error;
    S.comments=(S.comments||[]).concat([data]);
    if(t)t.value='';S._cmReplyTo=null;
    drawComments();paintCommentPins();
  }catch(e){
    const m=String(e.message||e);
    if(S._cmReplyTo&&/parent_id/i.test(m)){
      try{
        const r2=await sb.from('wiki_comments').insert(base).select().single();
        if(r2.error)throw r2.error;
        S.comments=(S.comments||[]).concat([r2.data]);
        if(t)t.value='';S._cmReplyTo=null;
        drawComments();paintCommentPins();
        toast('Posted, but replies need a one-time migration to thread. See the note.',7000);
      }catch(e2){toast('Could not add: '+(e2.message||e2),8000);}
      return;
    }
    if(/does not exist|schema cache/i.test(m)){S._cmMissing=true;nxClose();openComments(S._cmBlock);}
    else toast('Could not add the comment: '+m,8000);
  }
}
async function resolveComment(id,val){
  try{
    const{error}=await sb.from('wiki_comments').update({resolved:val}).eq('id',id);
    if(error)throw error;
    const c=(S.comments||[]).find(x=>x.id===id);
    if(c)c.resolved=val;
    drawComments();paintCommentPins();
  }catch(e){toast('Could not update: '+(e.message||e),8000);}
}
async function deleteComment(id){
  if(!confirm('Delete this comment?'))return;
  try{
    const{error}=await sb.from('wiki_comments').delete().eq('id',id);
    if(error)throw error;
    S.comments=(S.comments||[]).filter(x=>x.id!==id);
    drawComments();paintCommentPins();
  }catch(e){toast('Could not delete: '+(e.message||e),8000);}
}

/* ---------- embed: turn share URLs into embeddable ones ---------- */
function embedSrc(url){
  try{
    var u=new URL(url),h=u.hostname.replace(/^www\./,'');
    if(h==='youtube.com'||h==='m.youtube.com'){var id=u.searchParams.get('v');if(id)return 'https://www.youtube.com/embed/'+id;}
    if(h==='youtu.be')return 'https://www.youtube.com/embed/'+u.pathname.slice(1);
    if(h==='vimeo.com'){var m=u.pathname.match(/\/(\d+)/);if(m)return 'https://player.vimeo.com/video/'+m[1];}
    if(h==='loom.com'&&/\/share\//.test(u.pathname))return 'https://www.loom.com/embed/'+u.pathname.split('/share/')[1];
    if(h==='figma.com')return 'https://www.figma.com/embed?embed_host=tgk&url='+encodeURIComponent(url);
    if(h==='drive.google.com')return url.replace(/\/view.*$/,'/preview');
  }catch(e){}
  return url;
}

/* ---------- roster ---------- */
async function loadTeam(){
  const me=(S.user&&S.user.email||'').toLowerCase();
  try{
    if(me){
      await sb.from('team_members').upsert(
        {email:me,display_name:(S.user.user_metadata&&S.user.user_metadata.full_name)||me.split('@')[0],
         last_seen:new Date().toISOString()},{onConflict:'email'});
    }
    const{data,error}=await sb.from('team_members').select('email,display_name,last_seen').order('display_name');
    if(error)throw error;
    S.team=data||[];
  }catch(e){
    S.team=me?[{email:me,display_name:me.split('@')[0]}]:[];
    console.warn('team roster unavailable:',e&&e.message);
  }
}
function teamName(email){
  const t=(S.team||[]).find(x=>(x.email||'').toLowerCase()===String(email||'').toLowerCase());
  return (t&&t.display_name)||String(email||'').split('@')[0]||'someone';
}
function teamByName(name){
  const n=String(name||'').trim().toLowerCase();

/* ---------- notifications ---------- */
async function notify(recipient,kind,message,blockId){
  const me=(S.user&&S.user.email||'').toLowerCase();
  const to=String(recipient||'').toLowerCase();
  if(!to||to===me)return;                 // never notify yourself
  const p=curPage();
  try{
    const{error}=await sb.from('wiki_notifications').insert({
      recipient:to,actor:me,page_id:p?p.id:null,block_id:blockId||null,
      kind:kind||'mention',message:message||''});
    if(error)throw error;
    toast('\u2713 '+teamName(to)+' notified');
  }catch(e){
    const m=String(e.message||e);
    if(/does not exist|schema cache/i.test(m))
      toast('Notifications need one migration - run the wiki_notifications block in sql/add_wiki_pages.sql',9000);
    else toast('Could not notify: '+m,7000);
  }
}
async function loadNotifs(){
  const me=(S.user&&S.user.email||'').toLowerCase();
  if(!me){S.notifs=[];return;}
  try{
    const{data,error}=await sb.from('wiki_notifications').select('*')
      .eq('recipient',me).order('created_at',{ascending:false}).limit(40);
    if(error)throw error;
    S.notifs=data||[];

}

const AV_COLORS=['#0d9488','#ea580c','#7c5cd6','#2563eb','#16a34a','#dc2626','#d97706','#0891b2'];
function avatar(email){
  const e=String(email||'').trim();
  if(!e)return '<span class="av av-none">?</span>';
  const name=(typeof teamName==='function')?teamName(e):e.split('@')[0];
  let h=0;for(let i=0;i<e.length;i++)h=(h*31+e.charCodeAt(i))>>>0;
  const c=AV_COLORS[h%AV_COLORS.length];
  const initials=name.split(/[\s._-]+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()||'?';
  return '<span class="av" style="background:'+c+'">'+esc(initials)+'</span>'
    +'<span class="av-n">'+esc(name)+'</span>';

/* ---------- grouping ---------- */
function groupKeyFor(r,gp){
  if(!gp)return '';
  const v=(r.cells||{})[gp.id];
  if(v===true)return 'Yes';
  if(v===false||v===''||v===undefined||v===null)return '';
  if(gp.type==='date')return String(v).slice(0,10);
  return String(v);
}
function groupOrder(d,gp,rows){
  if(!gp)return [''];
  if(gp.type==='select'&&Array.isArray(gp.options)){
    const named=gp.options.map(o=>o.v);
    const extras=[...new Set(rows.map(r=>groupKeyFor(r,gp)))].filter(k=>k&&named.indexOf(k)<0);
    return named.concat(extras).concat(['']);
  }
  const seen=[...new Set(rows.map(r=>groupKeyFor(r,gp)))];
  const named=seen.filter(Boolean).sort();
  return named.concat(seen.indexOf('')>=0?['']:[]);
}
/* Completion = ticked checkboxes, else select values that look finished. */
function groupProgress(d,rows){
  const chk=(d.props||[]).find(p=>p.type==='check');
  if(chk){
    const done=rows.filter(r=>{const v=(r.cells||{})[chk.id];return v===true||v==='true';}).length;
    return {done,total:rows.length};
  }
  const st=(d.props||[]).find(p=>p.type==='select'&&/status|state|stage/i.test(p.name||''));
  if(st){
    const done=rows.filter(r=>/^(done|complete|completed|closed|shipped)$/i.test(String((r.cells||{})[st.id]||''))).length;
    return {done,total:rows.length};
  }
  return null;
}

/* ---------- formula engine ---------- */
var _F={
  _if:function(c,a,b){return c?a:b;},
  and:function(){for(var i=0;i<arguments.length;i++)if(!arguments[i])return false;return true;},
  or:function(){for(var i=0;i<arguments.length;i++)if(arguments[i])return true;return false;},
  not:function(x){return !x;},
  concat:function(){var o='';for(var i=0;i<arguments.length;i++)o+=(arguments[i]==null?'':arguments[i]);return o;},
  contains:function(h,n){return String(h==null?'':h).indexOf(String(n==null?'':n))>=0;},
  empty:function(x){return x==null||x===''||x===false;},
  length:function(x){return String(x==null?'':x).length;},
  upper:function(x){return String(x==null?'':x).toUpperCase();},
  lower:function(x){return String(x==null?'':x).toLowerCase();},
  round:function(x,dp){var m=Math.pow(10,dp||0);return Math.round((Number(x)||0)*m)/m;},
  floor:function(x){return Math.floor(Number(x)||0);},
  ceil:function(x){return Math.ceil(Number(x)||0);},
  abs:function(x){return Math.abs(Number(x)||0);},
  min:function(){return Math.min.apply(null,[].slice.call(arguments).map(Number));},
  max:function(){return Math.max.apply(null,[].slice.call(arguments).map(Number));},
  now:function(){return new Date().toISOString().slice(0,10);},
  year:function(x){var d=new Date(x);return isNaN(d.getTime())?'':d.getFullYear();},
  month:function(x){var d=new Date(x);return isNaN(d.getTime())?'':d.getMonth()+1;},
  day:function(x){var d=new Date(x);return isNaN(d.getTime())?'':d.getDate();},
  dateBetween:function(a,b,u){var da=new Date(a),db2=new Date(b);if(isNaN(da.getTime())||isNaN(db2.getTime()))return '';var dd=(db2-da)/86400000;u=u||'days';if(u==='weeks')return Math.round(dd/7);if(u==='months')return Math.round(dd/30);if(u==='years')return Math.round(dd/365);return Math.round(dd);},
  num:function(x){var n=Number(x);return isNaN(n)?0:n;},
  text:function(x){return x==null?'':String(x);},
  format:function(x){return x==null?'':String(x);}
};
function evalFormula(expr,r,d,depth){
  depth=depth||0;
  if(!expr)return '';
  if(depth>8)return '\u26a0';
  try{
    var t=String(expr);
    t=t.replace(/prop\(\s*(["'])([\s\S]*?)\1\s*\)/g,function(_m,q,nm){return '_g('+JSON.stringify(nm)+')';});
    t=t.replace(/\{([^}]+)\}/g,function(_m,nm){return '_g('+JSON.stringify(nm.trim())+')';});
    t=t.replace(/\bif\s*\(/g,'_if(');
    var props=(d.props||[]);
    var _g=function(nm){
      var p=null;for(var i=0;i<props.length;i++){if(props[i].name===nm){p=props[i];break;}}
      if(!p)return '';
      var val=(r.cells||{})[p.id];
      if(p.type==='number')return (val===''||val==null)?0:Number(val);
      if(p.type==='check')return val===true||val==='true';
      if(p.type==='formula')return evalFormula(p.formula,r,d,depth+1);
      return val==null?'':val;
    };
    var fn=new Function('_g','_if','and','or','not','concat','contains','empty','length','upper','lower','round','floor','ceil','abs','min','max','now','year','month','day','dateBetween','num','text','format','"use strict";return ('+t+');');
    var out=fn(_g,_F._if,_F.and,_F.or,_F.not,_F.concat,_F.contains,_F.empty,_F.length,_F.upper,_F.lower,_F.round,_F.floor,_F.ceil,_F.abs,_F.min,_F.max,_F.now,_F.year,_F.month,_F.day,_F.dateBetween,_F.num,_F.text,_F.format);
    if(out===true)return '\u2713';
    if(out===false)return '';
    if(typeof out==='number'&&!isFinite(out))return '\u26a0';
    return out==null?'':out;
  }catch(e){return '\u26a0';}
}
function formulaField(p){
  return '<div id="pe-formula" style="display:none">'
    +'<label class="nx-l">Formula</label>'
    +'<textarea id="pe-fx" class="nx-i" style="height:74px;font-family:var(--mono);font-size:12px" placeholder="if(prop(&quot;Status&quot;)==&quot;Done&quot;, &quot;OK&quot;, &quot;Pending&quot;)">'+esc(p&&p.formula?p.formula:'')+'</textarea>'
    +'<div class="nx-hint">Reference columns with prop("Name") or {Name}. Use == for equals. Functions: if, and, or, not, concat, contains, empty, length, upper, lower, round, floor, ceil, abs, min, max, num, text, now, year, month, day, dateBetween(a,b,"days").</div></div>';
}
window.evalFormula=evalFormula;window.formulaField=formulaField;
/* ---------- column aggregations ---------- */
function _aggRound(n){return Math.round((Number(n)||0)*100)/100;}
function aggApplicable(pr){
  var base=[['','Calculate'],['count','Count all'],['filled','Count filled'],['empty','Count empty'],['unique','Count unique']];
  if(pr.type==='number')return base.concat([['sum','Sum'],['avg','Average'],['min','Min'],['max','Max'],['range','Range']]);
  if(pr.type==='check')return base.concat([['checked','Checked'],['unchecked','Unchecked'],['pct','Percent checked']]);
  if(pr.type==='date')return base.concat([['earliest','Earliest'],['latest','Latest']]);
  if(pr.type==='formula')return base.concat([['sum','Sum'],['avg','Average'],['min','Min'],['max','Max'],['range','Range']]);
  return base;
}
function aggLabel(t){var m={count:'Count',filled:'Filled',empty:'Empty',unique:'Unique',sum:'Sum',avg:'Avg',min:'Min',max:'Max',range:'Range',checked:'Checked',unchecked:'Unchecked',pct:'% done',earliest:'First',latest:'Last'};return m[t]||'';}
function aggCompute(t,pr,rows){
  var vals=(pr.type==='formula')?rows.map(function(r){return evalFormula(pr.formula,r,db());}):rows.map(function(r){return (r.cells||{})[pr.id];});
  function filled(x){return pr.type==='check'?(x===true||x==='true'):(x!=null&&String(x).trim()!=='');}
  var nums=vals.filter(function(x){return x!=null&&x!==''&&!isNaN(Number(x));}).map(Number);
  var dates=vals.filter(function(x){return x&&!isNaN(Date.parse(x));});
  switch(t){
    case 'count':return String(rows.length);
    case 'filled':return String(vals.filter(filled).length);
    case 'empty':return String(vals.filter(function(x){return !filled(x);}).length);
    case 'unique':{var seen={};vals.forEach(function(x){if(filled(x))seen[String(x)]=1;});return String(Object.keys(seen).length);}
    case 'sum':return String(_aggRound(nums.reduce(function(a,b){return a+b;},0)));
    case 'avg':return nums.length?String(_aggRound(nums.reduce(function(a,b){return a+b;},0)/nums.length)):'0';
    case 'min':return nums.length?String(_aggRound(Math.min.apply(null,nums))):'\u2014';
    case 'max':return nums.length?String(_aggRound(Math.max.apply(null,nums))):'\u2014';
    case 'range':return nums.length?String(_aggRound(Math.max.apply(null,nums)-Math.min.apply(null,nums))):'\u2014';
    case 'checked':return String(vals.filter(function(x){return x===true||x==='true';}).length);
    case 'unchecked':return String(vals.filter(function(x){return !(x===true||x==='true');}).length);
    case 'pct':{var c=vals.filter(function(x){return x===true||x==='true';}).length;return rows.length?Math.round(c/rows.length*100)+'%':'0%';}
    case 'earliest':return dates.length?dates.slice().sort()[0]:'\u2014';
    case 'latest':return dates.length?dates.slice().sort()[dates.length-1]:'\u2014';
  }
  return '';
}
function setAgg(pid,t){var v=activeView();v.aggs=v.aggs||{};if(t)v.aggs[pid]=t;else delete v.aggs[pid];markDirty();renderDb();}
function aggFootHTML(d,v,rows){
  var props=viewProps(d,v);
  var cells='<td></td>'+props.map(function(pr){
    var t=(v.aggs||{})[pr.id]||'';
    var opts=aggApplicable(pr).map(function(o){return '<option value="'+o[0]+'"'+(o[0]===t?' selected':'')+'>'+o[1]+'</option>';}).join('');
    var val=t?aggCompute(t,pr,rows):'';
    return '<td><select class="agg-sel" onchange="setAgg(\''+pr.id+'\',this.value)">'+opts+'</select>'
      +(t?'<span class="agg-v">'+esc(val)+'</span>':'')+'</td>';
  }).join('')+'<td></td>';
  return '<tfoot><tr class="agg-row">'+cells+'</tr></tfoot>';
}
function aggGroupHTML(d,v,rows,colCount){
  var props=viewProps(d,v);
  if(!props.some(function(pr){return (v.aggs||{})[pr.id];}))return '';
  var cells='<td></td>'+props.map(function(pr){
    var t=(v.aggs||{})[pr.id]||'';
    if(!t)return '<td></td>';
    return '<td class="agg-gv"><span class="agg-k">'+esc(aggLabel(t))+'</span>'+esc(aggCompute(t,pr,rows))+'</td>';
  }).join('')+'<td></td>';
  return '<tr class="agg-grow">'+cells+'</tr>';
}

var _colDrag=null;
function colDragStart(e,pid){_colDrag=pid;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',pid);}catch(_){}}
function colDragOver(e,pid){if(!_colDrag)return;e.preventDefault();var th=e.target.closest&&e.target.closest('th');document.querySelectorAll('th.col-dz').forEach(function(x){x.classList.remove('col-dz');});if(th&&_colDrag!==pid)th.classList.add('col-dz');}
function colDrop2(e,pid){if(!_colDrag)return;e.preventDefault();document.querySelectorAll('th.col-dz').forEach(function(x){x.classList.remove('col-dz');});var dragId=_colDrag;_colDrag=null;if(dragId!==pid)moveColTo(dragId,pid);}
function colDragEnd(){_colDrag=null;document.querySelectorAll('th.col-dz').forEach(function(x){x.classList.remove('col-dz');});}
function moveColTo(dragId,targetId){
  var d=db(),props=d.props||[],from=-1;
  for(var i=0;i<props.length;i++){if(props[i].id===dragId){from=i;break;}}
  if(from<0)return;
  var m=props.splice(from,1)[0],to=-1;
  for(var j=0;j<props.length;j++){if(props[j].id===targetId){to=j;break;}}
  if(to<0){props.splice(from,0,m);return;}
  props.splice(to,0,m);
  markDirty();renderDb();
}
function openGroupEditor(gid,val){
  S._geGp=gid;S._geVal=val;
  nxModal('Edit "'+esc(val)+'"',
    '<label class="nx-l">Rename value</label><input id="ge-name" class="nx-i" value="'+esc(val)+'">'
    +'<div class="nx-hint">Renaming updates every row using this value. Deleting clears it from those rows (the rows are kept).</div>',
    '<button class="nx-b danger" onclick="deleteGroupOption()">Delete</button><span style="flex:1"></span>'
    +'<button class="nx-b" onclick="nxClose()">Cancel</button>'
    +'<button class="nx-b primary" onclick="saveGroupOption()">Save</button>');
  setTimeout(function(){var f=document.getElementById('ge-name');if(f){f.focus();f.select();}},40);
}
function saveGroupOption(){
  var d=db(),gp=dbProp(S._geGp);if(!gp)return;
  var nv=((document.getElementById('ge-name')||{}).value||'').trim();
  if(!nv){toast('Give it a name');return;}
  var old=S._geVal;
  if(nv!==old){
    (gp.options||[]).forEach(function(o){if(o.v===old)o.v=nv;});
    (d.rows||[]).forEach(function(r){if(r.cells&&r.cells[gp.id]===old)r.cells[gp.id]=nv;});
    (d.views||[]).forEach(function(v){if(v.collapsed&&v.collapsed[old]!=null){v.collapsed[nv]=v.collapsed[old];delete v.collapsed[old];}});
  }
  nxClose();markDirty();renderDb();
}
function deleteGroupOption(){
  var d=db(),gp=dbProp(S._geGp);if(!gp)return;
  var old=S._geVal;
  if(!confirm('Delete the "'+old+'" option? Rows using it will be cleared (the rows are kept).'))return;
  gp.options=(gp.options||[]).filter(function(o){return o.v!==old;});
  (d.rows||[]).forEach(function(r){if(r.cells&&r.cells[gp.id]===old)r.cells[gp.id]='';});
  nxClose();markDirty();renderDb();
}

function addRowTo(pid,val){

/* ---------- import data as a database ---------- */
function openImportChooser(){
  nxModal('Import',
    '<div class="nx-hint">Bring outside content into Notes.</div>'
    +'<button class="btn btn-w" style="margin-top:8px" onclick="nxClose();openImport()">Markdown into a page</button>'
    +'<button class="btn btn-w" style="margin-top:8px" onclick="nxClose();openDataImport()">CSV / TSV / JSON as a new database</button>',
    '<span style="flex:1"></span><button class="nx-b" onclick="nxClose()">Close</button>');
}
function _parseDelimited(text,delim){
  var out=[],row=[],field='',i=0,inq=false;
  while(i<text.length){
    var c=text.charAt(i);
    if(inq){
      if(c==='"'){if(text.charAt(i+1)==='"'){field+='"';i+=2;continue;}inq=false;i++;continue;}
      field+=c;i++;continue;
    }
    if(c==='"'){inq=true;i++;continue;}
    if(c===delim){row.push(field);field='';i++;continue;}
    if(c==='\n'||c==='\r'){if(c==='\r'&&text.charAt(i+1)==='\n')i++;row.push(field);out.push(row);row=[];field='';i++;continue;}
    field+=c;i++;
  }
  row.push(field);out.push(row);
  if(out.length&&out[out.length-1].length===1&&out[out.length-1][0]==='')out.pop();
  return out;
}
function parseImport(text,prefKey){
  text=(text||'').replace(/^\uFEFF/,'').trim();
  if(!text)return null;
  if(text.charAt(0)==='['||text.charAt(0)==='{'){
    try{
      var j=JSON.parse(text);
      var arr=Array.isArray(j)?j:null;
      if(!arr&&j&&typeof j==='object'){
        if(prefKey&&Array.isArray(j[prefKey]))arr=j[prefKey];
        else if(Array.isArray(j.data))arr=j.data;
        else{var _ak=Object.keys(j).filter(function(k){return Array.isArray(j[k])&&j[k].length&&typeof j[k][0]==='object'&&j[k][0]!==null;});_ak.sort(function(a,c){return j[c].length-j[a].length;});if(_ak.length)arr=j[_ak[0]];}
      }
      if(arr){
        if(arr.length&&(typeof arr[0]!=='object'||arr[0]===null))
          return {cols:['Value'],rows:arr.map(function(x){return [x==null?'':String(x)];})};
        var cols=[];
        arr.forEach(function(o){if(o&&typeof o==='object')Object.keys(o).forEach(function(k){if(cols.indexOf(k)<0)cols.push(k);});});
        var rows=arr.map(function(o){return cols.map(function(c){var v=(o&&o[c]!=null)?o[c]:'';if(v&&typeof v==='object')v=JSON.stringify(v);return v;});});
        return {cols:cols,rows:rows};
      }
    }catch(e){}
  }
  var delim=text.indexOf('\t')>=0?'\t':',';
  var lines=_parseDelimited(text,delim);
  if(lines.length<1)return null;
  return {cols:lines[0].map(function(c){return String(c||'').trim();}),rows:lines.slice(1)};
}
function _inferType(vals){
  var non=vals.filter(function(v){return v!==''&&v!=null;}).map(function(v){return String(v).trim();});
  if(!non.length)return 'text';
  if(non.every(function(v){return v!==''&&!isNaN(Number(v));}))return 'number';
  if(non.every(function(v){return /^(true|false|yes|no|y|n)$/i.test(v);}))return 'check';
  if(non.every(function(v){return /^https?:\/\//i.test(v);}))return 'url';
  if(non.every(function(v){return /\d/.test(v)&&!isNaN(Date.parse(v));}))return 'date';
  var uniq={};non.forEach(function(v){uniq[v]=1;});var u=Object.keys(uniq).length;
  if(u>=2&&u<=8&&non.length>=u*2)return 'select';
  return 'text';
}
function buildDbFromParsed(parsed){
  var seen={};
  var cols=parsed.cols.map(function(c){var n=String(c||'').trim()||'Column';var b=n,k=1;while(seen[n]){n=b+' '+(++k);}seen[n]=1;return n;});
  var colVals=cols.map(function(c,ci){return parsed.rows.map(function(r){return r[ci]==null?'':r[ci];});});
  var props=cols.map(function(c,ci){
    var type=_inferType(colVals[ci]);
    var p={id:uid(),name:c,type:type};
    if(type==='select'){var uq={};colVals[ci].forEach(function(v){v=String(v||'').trim();if(v)uq[v]=1;});p.options=Object.keys(uq).map(function(v,i){return {v:v,c:i%8};});}
    return p;
  });
  var rows=parsed.rows.map(function(r){
    var cells={};
    props.forEach(function(p,ci){
      var raw=r[ci]==null?'':String(r[ci]).trim();
      if(p.type==='check')cells[p.id]=/^(true|yes|y)$/i.test(raw);
      else if(p.type==='date'){var dt=new Date(raw);cells[p.id]=isNaN(dt.getTime())?'':dt.toISOString().slice(0,10);}
      else cells[p.id]=raw;
    });
    return {id:uid(),cells:cells,notes:[]};
  });
  return {props:props,rows:rows};
}
function jsonArrays(text){
  text=(text||'').trim();if(text.charAt(0)!=='{')return null;
  try{var j=JSON.parse(text);if(!j||typeof j!=='object'||Array.isArray(j))return null;
    var ks=Object.keys(j).filter(function(k){return Array.isArray(j[k])&&j[k].length&&typeof j[k][0]==='object'&&j[k][0]!==null;});
    var out=ks.map(function(k){return {key:k,count:j[k].length};});
    out.sort(function(a,b){return b.count-a.count;});
    return out;
  }catch(e){return null;}
}
function openDataImport(){
  nxModal('Import data as a database',
    '<label class="nx-l">Database name</label>'
    +'<input id="di-name" class="nx-i" value="Imported data" placeholder="e.g. Facebook Groups">'
    +'<label class="nx-l">Paste CSV, TSV, or JSON</label>'
    +'<textarea id="di-data" class="nx-i" style="height:190px;font-family:var(--mono);font-size:11.5px" placeholder="Group,URL,Members,Active\nJDM Owners,https://facebook.com/groups/...,3200,yes"></textarea>'
    +'<div id="di-arraywrap" style="display:none"><label class="nx-l">Which list to import?</label><select id="di-array" class="nx-i" onchange="previewImport()"></select></div>'
    +'<div class="nx-hint">First row = column names (CSV / TSV). JSON = an array of objects, or an object containing lists (you can pick which). Types (number, date, checkbox, URL, select) are detected automatically.</div>'
    +'<div id="di-prev" class="nx-hint" style="margin-top:4px"></div>',
    '<span style="flex:1"></span><button class="nx-b" onclick="nxClose()">Cancel</button>'
    +'<button class="nx-b" onclick="previewImport()">Preview</button>'
    +'<button class="nx-b primary" onclick="runDataImport()">Create database</button>');
  setTimeout(function(){var f=document.getElementById('di-data');if(f)f.focus();},40);
}
function previewImport(){
  var el=document.getElementById('di-prev');if(!el)return;
  var raw=(document.getElementById('di-data')||{}).value||'';
  var arrs=jsonArrays(raw),wrap=document.getElementById('di-arraywrap'),sel=document.getElementById('di-array');
  if(arrs&&arrs.length>1&&wrap&&sel){var cur=sel.value;sel.innerHTML=arrs.map(function(a){return '<option value="'+esc(a.key)+'"'+(a.key===cur?' selected':'')+'>'+esc(a.key)+' ('+a.count+' rows)</option>';}).join('');wrap.style.display='';}else if(wrap){wrap.style.display='none';}
  var pref=(arrs&&arrs.length>1&&sel)?sel.value:null;
  var parsed=parseImport(raw,pref);
  if(!parsed||!parsed.cols.length){el.textContent='Nothing to import yet.';return;}
  var built=buildDbFromParsed(parsed);
  el.innerHTML='<b>'+built.rows.length+'</b> rows, <b>'+built.props.length+'</b> columns: '
    +built.props.map(function(p){return esc(p.name)+' ('+p.type+')';}).join(', ');
}
async function runDataImport(){
  var raw=(document.getElementById('di-data')||{}).value||'';
  var arrs=jsonArrays(raw),sel=document.getElementById('di-array');
  var pref=(arrs&&arrs.length>1&&sel)?sel.value:null;
  var name=((document.getElementById('di-name')||{}).value||'').trim()||(pref||'Imported data');
  var parsed=parseImport(raw,pref);
  if(!parsed||!parsed.cols.length){toast('Paste some CSV, TSV, or JSON first');return;}
  var built=buildDbFromParsed(parsed);
  var content={props:built.props,rows:built.rows,views:[{id:uid(),name:'Table',kind:'table',groupBy:null,filters:[]}],activeView:0,sort:null};
  try{
    var row={title:name,icon:'\u25a6',parent_id:null,sort_order:nextSort(null),page_type:'db',content:content,created_by:S.user?S.user.email:null};
    if(S._hasVisibility)row.visibility=(S.workspace==='private'?'private':'team');
    const{data,error}=await sb.from('wiki_pages').insert(row).select().single();
    if(error)throw error;
    S.pages.push(data);
    nxClose();renderTree();openPage(data.id);
    toast('\u2713 Imported '+built.rows.length+' rows');
  }catch(e){toast(writeErr(e,'create the database'),9000);}
}
window.openImportChooser=openImportChooser;window.openDataImport=openDataImport;window.previewImport=previewImport;window.runDataImport=runDataImport;window.parseImport=parseImport;window.buildDbFromParsed=buildDbFromParsed;window.jsonArrays=jsonArrays;


</script>
