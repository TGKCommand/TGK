.gate-box{position:relative;background:#fff;border-radius:var(--r-lg);padding:28px 30px;width:370px;box-shadow:0 1px 2px rgba(14,20,24,.05),0 0 0 1px var(--border)}
.gate-box img{height:30px;display:block;margin-bottom:14px}
.gate-box h1{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.gate-box p{font-size:11.5px;color:var(--text3);margin-bottom:16px}
.fld{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r);font-size:13px;margin-bottom:9px;background:#fff;outline:none}
.fld:focus{border-color:var(--teal);box-shadow:0 0 0 2px var(--teal-dim)}
#login-error{color:var(--red);font-size:11.5px;min-height:16px;margin-top:6px}

/* ---------- shell ---------- */
#app{display:none;height:100vh;overflow:hidden}
.shell{display:flex;height:100vh}
.side{width:var(--sidebar);background:#141618;display:flex;flex-direction:column;flex-shrink:0;position:relative}
.side-logo{height:var(--hdrh);flex-shrink:0;display:flex;align-items:center;padding:0 16px;position:relative;background:#141618}
.side-logo img{height:26px}
.side-logo::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--teal)}
.side-top{padding:10px}
.side-search{width:100%;padding:7px 9px;border:1px solid #2b2f33;border-radius:var(--r);font-size:12px;background:#1c1f22;color:#dfe4e8;outline:none}
.side-search::placeholder{color:#6b7680}
.side-search:focus{border-color:var(--teal)}
.side-scroll{flex:1;overflow-y:auto;padding:2px 8px 8px}
.side-lbl{font-family:var(--mono);font-size:9px;letter-spacing:.16em;color:#6b7680;text-transform:uppercase;padding:8px 6px 5px}
.ws-tabs{display:flex;gap:4px;padding:2px 6px 5px}
.ws-t{flex:1;font-size:10.5px;font-family:var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 6px;border-radius:6px;border:1px solid #2b2f33;background:#1c1f22;color:#8b959c;cursor:pointer}
.ws-t:hover{color:#c9d1d6}
.ws-t.on{background:var(--teal-dim);border-color:var(--teal);color:#d9f2ee}
.pg{display:flex;align-items:center;gap:5px;padding:5px 7px;border-radius:5px;cursor:pointer;font-size:12.5px;color:#b9c1c8;user-select:none}
.pg:hover{background:#1e2225;color:#e6ebef}
.pg.on{background:rgba(13,148,136,.16);color:#5fe0cc;font-weight:600}
.pg .tw{width:17px;height:17px;line-height:17px;text-align:center;font-size:12px;color:#8b959c;flex-shrink:0;border-radius:4px}
.pg .tw:hover{color:var(--teal);background:#23272b}
.pg .ic{width:16px;text-align:center;flex-shrink:0}
.pg .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pg .act{opacity:0;background:none;border:none;color:#6b7680;font-size:13px;padding:0 3px;line-height:1}
.pg:hover .act{opacity:1}
.pg .act:hover{color:var(--teal)}
.side-foot{padding:9px 10px;border-top:1px solid #23272b;display:flex;flex-direction:column;gap:7px}
.side-foot .btn{background:#1c1f22;border-color:#2b2f33;color:#c9d1d6}
.side-foot .btn:hover{background:#23272b}
.sf-primary{font-weight:600}
.sf-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sf-grid .btn{padding:6px 8px}
.sf-sep{height:1px;background:#23272b;margin:4px 2px 2px}
.sf-tools .btn{font-size:11.5px;font-weight:500;color:#9aa4ab}
.sf-tools .btn:hover{color:#e6ebef}
.sync{background-color:var(--cb-c);background-image:var(--cb-i);background-size:100% 100%,100% 100%,100% 100%,auto 120px;
  border-radius:5px;padding:7px 10px;box-shadow:0 2px 6px rgba(17,24,39,.3),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(0,0,0,.55)}
.sync .l{font-size:11px;font-weight:600;color:#E2E8EB}
.sync .s{font-family:var(--mono);font-size:9px;color:#B7C1C7;margin-top:1px}

.wrap{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--field)}
.top{height:var(--hdrh);background:rgba(255,255,255,.9);backdrop-filter:blur(3px);display:flex;align-items:center;gap:12px;padding:0 20px;position:relative;flex-shrink:0}
.top::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--teal) 0,var(--teal) 6%,var(--orange) 55%,rgba(0,0,0,0) 94%)}
.tb-eb{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.18em;color:var(--text3)}
.tb-tt{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.012em;color:var(--text);line-height:1.1}
.top .sp{margin-left:auto;display:flex;align-items:center;gap:10px}
.top .who{font-size:11.5px;color:var(--text3)}
.top .ver{font-family:var(--mono);font-size:9.5px;color:#7E8994}
.savest{font-family:var(--mono);font-size:9.5px;color:var(--text3);min-width:52px;text-align:right}

.doc{position:relative;max-width:900px;margin:22px auto;background:rgba(255,255,255,.78);border-radius:var(--r-lg);
  box-shadow:0 1px 2px rgba(14,20,24,.05),0 0 0 1px var(--border);padding:36px 48px 160px}
.crumb{font-size:11px;color:var(--text3);margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap}
.crumb b{font-weight:600;color:var(--text2)}
.doc-ic{font-size:40px;line-height:1;margin-bottom:6px;cursor:pointer;display:inline-block;border-radius:var(--r);padding:2px 4px}
.doc-ic:hover{background:var(--bg3)}
.doc-title{font-size:33px;font-weight:800;letter-spacing:-.02em;outline:none;line-height:1.15;margin-bottom:14px}
.doc-title:empty::before{content:'Untitled';color:var(--text3)}
.empty{color:var(--text3);text-align:center;padding:70px 20px}
.empty h2{font-size:16px;font-weight:700;color:var(--text2);margin-bottom:6px}

/* blocks */
.bk{display:flex;align-items:flex-start;gap:4px;position:relative;padding:1px 0;border-radius:3px}
.bk.dz-above{box-shadow:inset 0 2px 0 var(--teal)}
.bk.dz-below{box-shadow:inset 0 -2px 0 var(--teal)}
.doc-tail{min-height:120px;cursor:text}
.bk-handle{opacity:.35;flex-shrink:0;width:22px;text-align:center;color:var(--text2);cursor:grab;font-size:15px;line-height:1.35;user-select:none;border-radius:5px}
.bk:hover .bk-handle{opacity:1}
.bk-plus{opacity:.35;flex-shrink:0;width:22px;text-align:center;color:var(--text2);cursor:pointer;font-size:19px;font-weight:700;line-height:1.15;user-select:none;border-radius:5px}
.bk:hover .bk-plus{opacity:1}
.bk-plus:hover{background:rgba(13,148,136,.16);color:var(--teal)}
#addmenu{width:242px}
.am-i{display:flex;align-items:center;gap:9px}
.am-e{width:20px;flex-shrink:0;text-align:center;color:var(--text3);font-size:13px}
.bk-handle:hover{background:rgba(13,148,136,.16);color:var(--teal)}
.col-row{display:flex;gap:0;align-items:flex-start;margin:2px 0}
.col{flex:1 1 0;min-width:0}
.col>.bk{margin-left:0!important}
.col-row{gap:14px}
.col-row .col{padding:10px 14px;border-radius:9px;background:rgba(13,148,136,.045);box-shadow:inset 0 0 0 1px var(--border);transition:box-shadow .12s,background .12s}
.col-row .col:hover{box-shadow:inset 0 0 0 1px var(--teal);background:rgba(13,148,136,.075)}
.col-rz{flex:0 0 8px;align-self:stretch;cursor:col-resize;position:relative}
.col-rz::before{content:'';position:absolute;left:50%;transform:translateX(-50%);top:8px;bottom:8px;width:2px;border-radius:3px;background:var(--border2);transition:background .1s,width .1s}
.col-rz:hover::before{background:var(--teal);width:4px}
.bk.col-left{box-shadow:inset 3px 0 0 var(--teal);border-radius:4px}
.bk.col-right{box-shadow:inset -3px 0 0 var(--teal);border-radius:4px}
@media(max-width:720px){.col-row{flex-direction:column;gap:0}.col-rz{display:none}}
.bk-mk{flex-shrink:0;min-width:18px;text-align:right;color:var(--text3);user-select:none;font-size:14px;line-height:1.65}
.bk-t{flex:1;outline:none;line-height:1.65;min-height:1.65em;word-break:break-word;padding:1px 2px}
.bk-t:focus:empty::before,.bk-t.ph-always:empty::before{content:attr(data-ph);color:var(--text3);pointer-events:none}
.bk[data-type=h1] .bk-t{font-size:25px;font-weight:800;letter-spacing:-.01em;margin-top:16px;line-height:1.3}
.bk[data-type=h2] .bk-t{font-size:19px;font-weight:700;margin-top:13px;line-height:1.35}
.bk[data-type=h3] .bk-t{font-size:15.5px;font-weight:700;margin-top:9px;line-height:1.4}
.bk[data-type=quote]{border-left:3px solid var(--teal);padding-left:10px;margin:3px 0}
.bk[data-type=quote] .bk-t{color:var(--text2);font-style:italic}
.bk[data-type=callout]{background:var(--teal-dim);border-radius:var(--r-lg);padding:9px 12px;margin:5px 0}
.bk[data-type=code]{background-color:var(--cb-c);background-image:var(--cb-i);background-size:100% 100%,100% 100%,100% 100%,auto 150px;
  border-radius:var(--r-lg);padding:11px 13px;margin:6px 0;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.bk[data-type=code] .bk-t{font-family:var(--mono);font-size:12.5px;color:#E4E9EC;white-space:pre-wrap;line-height:1.6;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.bk[data-type=code] .bk-handle{color:#5a6570}
.cb-wrap{flex:1;min-width:0}
.cb-bar{display:flex;align-items:center;gap:6px;margin:0 0 5px}
.cb-lang{background:rgba(255,255,255,.06);color:#dbe3e8;border:1px solid rgba(255,255,255,.14);border-radius:6px;font-family:var(--mono);font-size:10.5px;padding:2px 6px;cursor:pointer}
.cb-copy{background:rgba(255,255,255,.06);color:#dbe3e8;border:1px solid rgba(255,255,255,.14);border-radius:6px;font-family:var(--mono);font-size:10.5px;padding:3px 9px;cursor:pointer}
.cb-copy:hover{background:rgba(255,255,255,.12)}
.cb-pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#E4E9EC;cursor:text}
.cb-code{font-family:var(--mono);background:none;padding:0}
.cb-ta{width:100%;box-sizing:border-box;background:rgba(0,0,0,.28);color:#E4E9EC;border:1px solid rgba(255,255,255,.14);border-radius:6px;font-family:var(--mono);font-size:12.5px;line-height:1.6;padding:8px 10px;resize:none;outline:none;min-height:44px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
.hljs-comment,.hljs-quote{color:#7d8a99;font-style:italic}
.hljs-keyword,.hljs-selector-tag,.hljs-built_in,.hljs-name{color:#E07B28}
.hljs-string,.hljs-attr,.hljs-symbol,.hljs-bullet,.hljs-addition{color:#8fd18a}
.hljs-number,.hljs-literal{color:#e6a95b}
.hljs-title,.hljs-section{color:#6cc0e6}
.hljs-type,.hljs-class .hljs-title{color:#56c7c7}
.hljs-attribute,.hljs-variable,.hljs-template-variable{color:#7dcfff}
.hljs-tag{color:#9aa7b0}
.hljs-meta{color:#6b7686}
.hljs-deletion{color:#f7768e}
.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:700}
.bmk{position:relative;margin:2px 0}
.bmk-main{display:flex;align-items:stretch;border:1px solid var(--border);border-radius:8px;overflow:hidden;text-decoration:none;background:var(--bg2);transition:border-color .1s}
.bmk-main:hover{border-color:var(--teal)}
.bmk-tx{padding:10px 12px;min-width:0}
.bmk-t{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmk-d{font-size:11.5px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bmk-h{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--text2)}
.bmk-fav{width:15px;height:15px;border-radius:3px}
.bmk-edit{position:absolute;top:6px;right:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text3);font-size:11px;padding:2px 6px;opacity:0;cursor:pointer}
.bmk:hover .bmk-edit{opacity:1}
.bmk-empty{border:1px dashed var(--border2);border-radius:8px;padding:12px;color:var(--text3);cursor:pointer;font-size:12.5px}
.bmk-empty:hover{border-color:var(--teal);color:var(--text2)}
.bk[data-type=todo] .bk-t.done{text-decoration:line-through;color:var(--text3)}
.bk-cb{width:15px;height:15px;margin-top:4px;cursor:pointer;accent-color:var(--teal)}
.bk-div{flex:1;height:1px;background:var(--border2);margin:11px 0}

/* slash */
#slash{position:absolute;z-index:60;background:#fff;border-radius:var(--r-lg);box-shadow:0 8px 28px rgba(14,20,24,.18),0 0 0 1px var(--border);width:262px;max-height:300px;overflow-y:auto;padding:5px;display:none}
#slash .si{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:var(--r);cursor:pointer;font-size:13px}
#slash .si.sel,#slash .si:hover{background:var(--teal-dim)}

.nx-overlay,#nx-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px)}

a.mention{color:var(--teal-d);background:var(--teal-dim);border-radius:3px;padding:0 3px;cursor:pointer;text-decoration:none;font-weight:600}

.bl-wrap{margin-top:34px;padding-top:14px;border-top:1px solid var(--border)}

.btn:disabled,.fav-b:disabled{opacity:.35;cursor:default}

}

<script>
const TGK_NOTES_VERSION='v1.45';
const SUPABASE_URL="https://piamamighqiielfztgic.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);

const S={user:null,pages:[],activeId:null,collapsed:{},dirty:false,saving:false,workspace:'team',_hasVisibility:false,navBack:[],navFwd:[],undoStack:[],redoStack:[],_snap:null};
const $=id=>document.getElementById(id);
const uid=()=>'b'+Math.random().toString(36).slice(2,10);
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let _tt;
function toast(m,ms){clearTimeout(_tt);const t=$('toast');t.textContent=m;t.classList.add('on');_tt=setTimeout(()=>t.classList.remove('on'),ms||2600);}

/* ============================ auth ============================ */
async function doLogin(){
  const email=$('login-email').value.trim(),pass=$('login-password').value,err=$('login-error');
  err.textContent='';
  if(!email||!pass){err.textContent='Enter email and password.';return;}
  try{
    const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error)throw error;
    await afterLogin(data.user);
  }catch(e){err.textContent=e.message||'Sign-in failed.';}
}
async function doLogout(){await sb.auth.signOut();location.reload();}
async function afterLogin(user){
  S.user=user;
  $('gate').style.display='none';
  $('app').style.display='block';
  $('who').textContent=(user.email||'').split('@')[0];
  $('ver').textContent=TGK_NOTES_VERSION;
  if(window.innerWidth<=860)$('menu-btn').style.display='';
  const _vt=$('ver-tag'); if(_vt)_vt.textContent='TGK NOTES '+TGK_NOTES_VERSION;
  if(typeof loadTeam==='function')await loadTeam();
  if(typeof loadNotifs==='function'){loadNotifs();setInterval(loadNotifs,60000);}
  await loadPages();
}
(async()=>{
  const{data}=await sb.auth.getSession();
  if(data&&data.session)await afterLogin(data.session.user);
})();

/* ============================ data ============================ */
async function loadPages(){
  try{
    const{data,error}=await sb.from('wiki_pages').select('*').eq('archived',false).order('sort_order');
    if(error)throw error;
    const _mine=(S.user&&S.user.email)||'';
    S.pages=(data||[]).filter(p=>!(p.visibility==='private'&&(p.created_by||'')!==_mine));
    S._hasVisibility=!!(data&&data.length&&Object.prototype.hasOwnProperty.call(data[0],'visibility'));
    if(data&&!data.length){try{const _r=await sb.from('wiki_pages').select('visibility').limit(1);S._hasVisibility=!_r.error;}catch(_e){S._hasVisibility=false;}}
  }catch(e){
    const m=String(e.message||e);
    if(/does not exist|schema cache/i.test(m)){
      $('doc').innerHTML='<div class="empty"><h2>One migration needed</h2><p style="font-size:12.5px">The <b>wiki_pages</b> table does not exist yet. Run <b>sql/add_wiki_pages.sql</b> in the Supabase SQL editor, then reload.</p></div>';
      return;
    }
    if(/row-level security|permission denied/i.test(m)){
      $('doc').innerHTML='<div class="empty"><h2>Database is blocking access</h2><p style="font-size:12.5px">Row-level security is on for <b>wiki_pages</b> with no policy for signed-in users. The policies are at the bottom of <b>sql/add_wiki_pages.sql</b>.</p></div>';
      return;
    }
    toast('Load failed: '+m,6000);return;
  }
  renderTree();
  const first=S.pages.find(p=>!p.parent_id)||S.pages[0];
  if(S.activeId&&S.pages.some(p=>p.id===S.activeId))openPage(S.activeId);
  else if(first)openPage(first.id);
  else renderDoc();
}
function pageById(id){return S.pages.find(p=>p.id===id);}
function childrenOf(pid){return S.pages.filter(p=>(p.parent_id||null)===(pid||null)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));}
function nextSort(pid){const k=childrenOf(pid);return k.length?(Number(k[k.length-1].sort_order)||0)+1000:1000;}

async function newPage(parentId,kind){
  const isDb=kind==='db';
  const row={title:isDb?'New database':'Untitled',icon:isDb?'\u{1F5C3}':'',parent_id:parentId||null,
             sort_order:nextSort(parentId||null),page_type:isDb?'db':'doc',
             content:isDb?blankDb():[{id:uid(),type:'p',text:'',indent:0}],
             created_by:S.user?S.user.email:null};
  const _par=parentId?pageById(parentId):null;
  if(S._hasVisibility)row.visibility=_par?(_par.visibility||'team'):(S.workspace==='private'?'private':'team');
  try{
    const{data,error}=await sb.from('wiki_pages').insert(row).select().single();
    if(error)throw error;
    S.pages.push(data);
    if(parentId)S.collapsed[parentId]=false;
    renderTree();openPage(data.id);
    setTimeout(()=>{const t=document.querySelector('.doc-title');if(t)t.focus();},60);
  }catch(e){toast(writeErr(e,'create the page'),9000);}
}
async function deletePage(id){
  const p=pageById(id);if(!p)return;
  const kids=childrenOf(id).length;
  if(!confirm('Delete "'+(p.title||'Untitled')+'"'+(kids?(' and its '+kids+' sub-page(s)'):'')+'? This cannot be undone.'))return;
  try{
    const{error}=await sb.from('wiki_pages').delete().eq('id',id);
    if(error)throw error;
    const drop=new Set([id]);
    let grew=true;
    while(grew){grew=false;S.pages.forEach(x=>{if(x.parent_id&&drop.has(x.parent_id)&&!drop.has(x.id)){drop.add(x.id);grew=true;}});}
    S.pages=S.pages.filter(x=>!drop.has(x.id));
    if(drop.has(S.activeId))S.activeId=null;
    renderTree();
    const f=S.pages[0];if(f)openPage(f.id);else renderDoc();
    toast('Page deleted');
  }catch(e){toast(writeErr(e,'delete the page'),9000);}
}
function writeErr(e,verb){
  const m=String((e&&e.message)||e||'');
  if(/row-level security|permission denied/i.test(m))return 'Could not '+verb+': the database is blocking writes to wiki_pages (row-level security with no policy). Run the policy block in sql/add_wiki_pages.sql.';
  if(/does not exist|schema cache/i.test(m))return 'Could not '+verb+': the wiki_pages table is missing. Run sql/add_wiki_pages.sql.';
  return 'Could not '+verb+': '+m;
}

let _saveT=null,_snapT=null;
function markDirty(){
  S.dirty=true;$('savest').textContent='unsaved';
  clearTimeout(_saveT);_saveT=setTimeout(savePage,700);
  clearTimeout(_snapT);_snapT=setTimeout(checkpoint,600);
}
async function savePage(){
  const p=pageById(S.activeId);
  if(!p||!S.dirty||S.saving)return;
  S.saving=true;$('savest').textContent='saving...';
  try{
    const{error}=await sb.from('wiki_pages').update({title:p.title,icon:p.icon,content:p.content}).eq('id',p.id);
    if(error)throw error;
    S.dirty=false;$('savest').textContent='saved';
    if(typeof snapshotPage==='function')snapshotPage(false);
    setTimeout(()=>{if(!S.dirty)$('savest').textContent='';},1800);
  }catch(e){$('savest').textContent='save failed';toast(writeErr(e,'save'),9000);}
  finally{S.saving=false;}
}

function matchesQuery(p,q){
  if(!q)return true;
  if((p.title||'').toLowerCase().includes(q))return true;
  if(isDb(p)){
    const c=p.content||{};
    return (c.rows||[]).some(r=>Object.keys(r.cells||{}).some(k=>String(r.cells[k]==null?'':r.cells[k]).toLowerCase().includes(q)));
  }
  return (p.content||[]).some(b=>String(b.text||'').toLowerCase().includes(q));
}
function renderTree(){
  const q=($('q').value||'').trim().toLowerCase();
  const keep=new Set();
  if(q){
    S.pages.forEach(p=>{
      if(matchesQuery(p,q)){
        keep.add(p.id);
        let cur=p;
        while(cur&&cur.parent_id){keep.add(cur.parent_id);cur=pageById(cur.parent_id);}
      }
    });
  }
  const mine=(S.user&&S.user.email)||'';
  const inWs=p=>{const priv=(p.visibility==='private');return S.workspace==='private'?(priv&&(p.created_by||'')===mine):(!priv);};
  const vis=new Set(S.pages.filter(p=>inWs(p)&&(!q||keep.has(p.id))).map(p=>p.id));
  const wsKids=pid=>S.pages.filter(p=>(p.parent_id||null)===(pid||null)&&vis.has(p.id)).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0));
  const walk=(pid,depth)=>wsKids(pid).map(p=>{
    const kids=wsKids(p.id);
    const open=q?true:!S.collapsed[p.id];
    return '<div class="pg'+(p.id===S.activeId?' on':'')+'" style="padding-left:'+(8+depth*13)+'px" draggable="true"'
      +' ondragstart="pgDragStart(event,\''+p.id+'\')"'
      +' ondragover="pgDragOver(event,\''+p.id+'\',(event.offsetY<7?\'above\':(event.offsetY>18?\'below\':\'in\')))"'
      +' ondragleave="pgDragLeave(event)"'
      +' ondrop="pgDrop(event,\''+p.id+'\',(event.offsetY<7?\'above\':(event.offsetY>18?\'below\':\'in\')))"'
      +' onclick="openPage(\''+p.id+'\')">'
      +'<span class="tw" onclick="event.stopPropagation();toggleTw(\''+p.id+'\')">'+(kids.length?(open?'\u25be':'\u25b8'):'')+'</span>'
      +'<span class="ic">'+(p.icon?esc(p.icon):(isDb(p)?'\u{1F5C3}':'\u{1F4C4}'))+'</span>'
      +'<span class="nm">'+esc(p.title||'Untitled')+'</span>'
      +'<button class="act" title="Add inside (page or database)" onclick="event.stopPropagation();newChild(\''+p.id+'\')">+</button>'
      +'<button class="act" title="More actions" onclick="event.stopPropagation();openRowMenu(\''+p.id+'\',event)">\u22ef</button>'
      +'</div>'+(open&&kids.length?walk(p.id,depth+1):'');
  }).join('');
  const html=walk(null,0);
  const _emptyMsg=q?'No matches.':(S.workspace==='private'?(S._hasVisibility?'No private pages yet. Open any page and use Make private in the header.':'<span onclick="openWorkspaceSetup()" style="cursor:pointer;text-decoration:underline">Enable your private workspace (needs one migration)</span>'):'No pages yet.');
  $('tree').innerHTML=html||'<div style="padding:10px 9px;font-size:11.5px;color:var(--text3)">'+_emptyMsg+'</div>';
  const fv=$('favs');
  if(fv)fv.innerHTML=(typeof favTreeHTML==='function')?favTreeHTML():'';
}

function renderDoc(){

function numberFor(i){
  const b=blocks();let n=1;
  for(let k=i-1;k>=0;k--){
    if((b[k].cg||'')!==(b[i].cg||'')||(b[k].col||0)!==(b[i].col||0))break;
    if(b[k].indent<b[i].indent)break;
    if(b[k].indent>b[i].indent)continue;
    if(b[k].type!=='num')break;
    n++;
  }
  return n;
}
function renderBlocks(){

  if(typeof paintCommentPins==='function')setTimeout(paintCommentPins,0);
  const b=blocks();
  const _hid=(typeof toggleHidden==='function')?toggleHidden(b):{};
  normalizeColumns(b);
  var _out='',_ci=0;
  while(_ci<b.length){
    var _cb=b[_ci];
    if(_cb.cg){var _cg=_cb.cg,_cj=_ci;while(_cj<b.length&&b[_cj].cg===_cg)_cj++;_out+=colRowHTML(b,_ci,_cj,_hid);_ci=_cj;}
    else{_out+=(_hid[_ci]?'':blockHTML(b[_ci],_ci));_ci++;}

}

function blockIndex(id){return blocks().findIndex(x=>x.id===id);}
function focusBlock(id,atStart,offset){
  if(!id)return;
  const el=document.querySelector('[data-bid="'+id+'"] .bk-t');
  if(!el){return;}
  el.focus();
  const r=document.createRange(),sel=window.getSelection();
  if(typeof offset==='number'&&el.firstChild){
    const max=(el.firstChild.textContent||'').length;
    r.setStart(el.firstChild,Math.max(0,Math.min(offset,max)));r.collapse(true);
  }else{r.selectNodeContents(el);r.collapse(!!atStart);}
  sel.removeAllRanges();sel.addRange(r);
}
function caretOffset(el){
  const sel=window.getSelection();
  if(!sel.rangeCount)return 0;
  const r=sel.getRangeAt(0).cloneRange();
  r.selectNodeContents(el);r.setEnd(sel.getRangeAt(0).endContainer,sel.getRangeAt(0).endOffset);
  return r.toString().length;
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.classList||!t.classList.contains('bk-t'))return;
  const host=t.closest('.bk'),id=host.getAttribute('data-bid'),i=blockIndex(id);
  if(i<0)return;
  const bl=blocks()[i];
  bl.text=(typeof cleanInlineHTML==='function')?cleanInlineHTML(t.innerHTML):t.textContent;
  const _plain=(typeof blockPlain==='function')?blockPlain(bl.text):bl.text;
  if(bl.type==='image'){markDirty();return;}   // caption only - no markdown/slash handling
  // markdown shortcuts (paragraphs only)
  if(bl.type==='p'){
    const map=[['# ','h1'],['## ','h2'],['### ','h3'],['- ','bullet'],['* ','bullet'],
               ['1. ','num'],['[] ','todo'],['[ ] ','todo'],['> ','quote'],['``` ','code'],['--- ','divider']];
    for(const[pre,ty]of map){
      if(_plain.startsWith(pre)){
        bl.type=ty;bl.text=_plain.slice(pre.length);
        if(ty==='divider'){bl.text='';}
        renderBlocks();
        if(ty==='divider'){addBlockAfter(i,'p');}else if(ty==='code'){editCode(id);}else focusBlock(id);
        markDirty();return;
      }
    }
  }
  if(_plain.startsWith('/'))openSlash(host,_plain.slice(1));else closeSlash();
  var _at=/@([^@]*)$/.exec(_plain||'');
  if(_at&&typeof openAt==='function')openAt(host,_at[1]);else if(typeof closeAt==='function')closeAt();
  markDirty();
},true);

document.addEventListener('keydown',e=>{
  if(slashOpen&&['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)){slashKey(e);return;}
  if(typeof atOpen!=='undefined'&&atOpen&&['ArrowDown','ArrowUp','Enter','Escape'].includes(e.key)){atKey(e);return;}
  const t=e.target;
  if(!t.classList||!t.classList.contains('bk-t'))return;
  const host=t.closest('.bk'),id=host.getAttribute('data-bid'),i=blockIndex(id),b=blocks(),bl=b[i];
  if(i<0)return;
  if((e.metaKey||e.ctrlKey)&&!e.altKey){
    const _k=(e.key||'').toLowerCase();
    if(_k==='d'&&!e.shiftKey){e.preventDefault();dupBlock(id);return;}
    if(e.shiftKey&&/^Digit[0-9]$/.test(e.code||'')){
      var _tm={Digit0:'p',Digit1:'h1',Digit2:'h2',Digit3:'h3',Digit4:'todo',Digit5:'bullet',Digit6:'num',Digit7:'toggle',Digit8:'quote'};
      var _nt=_tm[e.code];
      if(_nt){e.preventDefault();bl.type=_nt;if(_nt==='toggle'&&bl.open===undefined)bl.open=true;renderBlocks();focusBlock(id);markDirty();return;}
    }
    if(e.shiftKey&&(e.key==='ArrowUp'||e.key==='ArrowDown')){
      e.preventDefault();
      moveBlock(id,e.key==='ArrowUp'?-1:1);
      setTimeout(function(){focusBlock(id);},0);
      return;
    }
  }
  if(e.key==='Enter'){
    if(bl.type==='code'){return;} // newlines inside code
    if(!e.shiftKey){e.preventDefault();try{document.execCommand('insertLineBreak');}catch(_){try{document.execCommand('insertHTML',false,'<br>');}catch(__){}}return;} // Enter = soft line break
    e.preventDefault(); // Shift+Enter = new block / split
    let before,after;
    try{
      const sel=window.getSelection(),rg=sel.getRangeAt(0).cloneRange();
      rg.setEndAfter(t.lastChild||t);
      const frag=rg.extractContents();
      const tmp=document.createElement('div');tmp.appendChild(frag);
      before=(typeof cleanInlineHTML==='function')?cleanInlineHTML(t.innerHTML):t.textContent;
      after=(typeof cleanInlineHTML==='function')?cleanInlineHTML(tmp.innerHTML):tmp.textContent;
    }catch(_e){
      const off=caretOffset(t),txt=(typeof blockPlain==='function')?blockPlain(bl.text):(bl.text||'');
      before=txt.slice(0,off);after=txt.slice(off);
    }
    bl.text=before;
    const _bp=(typeof blockPlain==='function')?blockPlain(before):before;
    const _ap=(typeof blockPlain==='function')?blockPlain(after):after;
    const carry=(bl.type==='bullet'||bl.type==='num'||bl.type==='todo')&&_bp!==''?bl.type:'p';
    if(_bp===''&&_ap===''&&bl.type!=='p'){bl.type='p';renderBlocks();focusBlock(id);markDirty();return;}
    const nb={id:uid(),type:carry,text:after,indent:bl.indent||0,checked:false,cg:bl.cg,col:bl.col};
    b.splice(i+1,0,nb);renderBlocks();focusBlock(nb.id,true);markDirty();return;
  }
  if(e.key==='Backspace'){
    const off=caretOffset(t);
    if(off===0){
      if(bl.type!=='p'){e.preventDefault();bl.type='p';renderBlocks();focusBlock(id,true);markDirty();return;}
      if((bl.indent||0)>0){e.preventDefault();bl.indent--;renderBlocks();focusBlock(id,true);markDirty();return;}
      if(i>0){
        e.preventDefault();
        const prev=b[i-1];
        if(prev.type==='divider'){b.splice(i-1,1);renderBlocks();focusBlock(id,true);markDirty();return;}
        const at=((typeof blockPlain==='function')?blockPlain(prev.text):(prev.text||'')).length;
        prev.text=(prev.text||'')+(bl.text||'');
        b.splice(i,1);renderBlocks();focusBlock(prev.id,false,at);markDirty();return;
      }
    }
  }
  if(e.key==='Tab'){
    e.preventDefault();
    if(e.shiftKey){if((bl.indent||0)>0)bl.indent--;}
    else if(i>0&&(bl.indent||0)<6)bl.indent=(bl.indent||0)+1;
    renderBlocks();focusBlock(id);markDirty();return;
  }
  if(e.key==='ArrowUp'&&i>0&&caretOffset(t)===0){e.preventDefault();focusBlock(b[i-1].id);}
  if(e.key==='ArrowDown'&&i<b.length-1&&caretOffset(t)===(bl.text||'').length){e.preventDefault();focusBlock(b[i+1].id,true);}
},true);

let dragId=null,dragZone='mid',dragHalf='below';
document.addEventListener('dragstart',e=>{
  const h=e.target.closest&&e.target.closest('.bk-handle');
  if(!h)return;
  dragId=h.closest('.bk').getAttribute('data-bid');

});
document.addEventListener('dragover',e=>{
  if(!dragId)return;

  document.querySelectorAll('.bk.dz-above,.bk.dz-below,.bk.col-left,.bk.col-right').forEach(x=>x.classList.remove('dz-above','dz-below','col-left','col-right'));
  const r=bk.getBoundingClientRect(),edge=Math.min(64,r.width*0.28);
  dragZone=(e.clientX<r.left+edge)?'left':(e.clientX>r.right-edge)?'right':'mid';
  if(dragZone==='mid'){dragHalf=(e.clientY<r.top+r.height/2)?'above':'below';bk.classList.add(dragHalf==='above'?'dz-above':'dz-below');}
  else bk.classList.add(dragZone==='left'?'col-left':'col-right');
});
document.addEventListener('drop',e=>{
  if(!dragId)return;
  const bk=e.target.closest&&e.target.closest('.bk');
  document.querySelectorAll('.bk.dz-above,.bk.dz-below,.bk.col-left,.bk.col-right').forEach(x=>x.classList.remove('dz-above','dz-below','col-left','col-right'));
  if(bk){

    const targetId=bk.getAttribute('data-bid');
    if(targetId!==dragId){
      if(dragZone==='left'||dragZone==='right')colDrop(dragId,targetId,dragZone);
      else{
        const b=blocks(),from=blockIndex(dragId);
        if(from>-1){const m=b[from];if(m.cg){delete m.cg;delete m.col;}b.splice(from,1);var ti=blockIndex(targetId);if(ti<0)ti=b.length-1;b.splice(ti+(dragHalf==='below'?1:0),0,m);renderBlocks();markDirty();}
      }
    }
  }
  dragId=null;dragZone='mid';
});

/* --- slash menu --- */
let slashOpen=false,slashSel=0,slashHost=null,slashList=[];
function openSlash(host,filter){
  const f=(filter||'').toLowerCase();
  slashList=BLOCKS.filter(x=>!f||x.n.toLowerCase().includes(f)||x.t.includes(f));
  slashList.sort(function(a,b){return SLASH_CAT_ORDER.indexOf(slashCat(a.t))-SLASH_CAT_ORDER.indexOf(slashCat(b.t));});
  if(!slashList.length){closeSlash();return;}
  slashHost=host;slashOpen=true;slashSel=0;
  const el=$('slash'),r=host.getBoundingClientRect();
  el.style.display='block';
  el.style.left=Math.min(r.left,window.innerWidth-280)+'px';
  el.style.top=(r.bottom+window.scrollY+4)+'px';
  drawSlash();
}
var SLASH_CATS={p:'Basic',h1:'Basic',h2:'Basic',h3:'Basic',bullet:'Basic',num:'Basic',todo:'Basic',toggle:'Basic',quote:'Basic',callout:'Basic',divider:'Basic',subpage:'Basic',col2:'Layout',col3:'Layout',col4:'Layout',image:'Media',bookmark:'Media',embed:'Media',code:'Media',table:'Database',dbembed:'Database',newdb:'Database',newtasks:'Database',toc:'Advanced'};
var SLASH_CAT_ORDER=['Basic','Layout','Media','Database','Advanced'];
function slashCat(t){return SLASH_CATS[t]||'Basic';}
function drawSlash(){
  var html='',lastCat=null;
  slashList.forEach(function(x,i){
    var c=slashCat(x.t);
    if(c!==lastCat){html+='<div class="sh">'+c+'</div>';lastCat=c;}
    html+='<div class="si'+(i===slashSel?' sel':'')+'" data-si="'+i+'"><span class="em">'+x.em+'</span><div><div>'+esc(x.n)+'</div><div class="d">'+esc(x.d)+'</div></div></div>';
  });
  $('slash').innerHTML=html;
}
function closeSlash(){slashOpen=false;slashHost=null;$('slash').style.display='none';}
function slashKey(e){
  if(e.key==='Escape'){e.preventDefault();closeSlash();return;}
  if(e.key==='ArrowDown'){e.preventDefault();slashSel=(slashSel+1)%slashList.length;drawSlash();return;}
  if(e.key==='ArrowUp'){e.preventDefault();slashSel=(slashSel-1+slashList.length)%slashList.length;drawSlash();return;}
  if(e.key==='Enter'){e.preventDefault();applySlash(slashList[slashSel]);}
}
document.addEventListener('click',e=>{
  const si=e.target.closest&&e.target.closest('[data-si]');
  if(si&&slashOpen){applySlash(slashList[Number(si.getAttribute('data-si'))]);return;}
  if(slashOpen&&!e.target.closest('#slash'))closeSlash();
});
function applySlash(def){
  if(!def||!slashHost)return;
  const id=slashHost.getAttribute('data-bid'),i=blockIndex(id),b=blocks();
  if(i<0){closeSlash();return;}
  if(def.t==='newdb'||def.t==='newtasks'){b[i].type='p';b[i].text='';closeSlash();renderBlocks();insertNewDb(id,def.t==='newtasks'?'tasks':'db');return;}
  b[i].type=def.t;b[i].text='';
  if(def.t==='divider'){closeSlash();renderBlocks();if(!b[i].cg)addBlockAfter(i,'p');markDirty();return;}
  if(def.t==='image'){closeSlash();renderBlocks();markDirty();if(typeof pickImage==='function')pickImage(id);return;}
  if(def.t==='table'){b[i].text='';if(typeof ensureTable==='function')ensureTable(b[i]);closeSlash();renderBlocks();if(!b[i].cg)addBlockAfter(i,'p');markDirty();return;}
  if(def.t==='toc'){b[i].text='';closeSlash();renderBlocks();if(!b[i].cg)addBlockAfter(i,'p');markDirty();return;}
  if(def.t==='subpage'){b[i].text='';closeSlash();renderBlocks();markDirty();if(typeof pickSubpage==='function')pickSubpage(id);return;}
  if(def.t==='dbembed'){b[i].text='';closeSlash();renderBlocks();markDirty();if(typeof pickEmbed==='function')pickEmbed(id);return;}
  if(def.t==='toggle'){
    b[i].open=true;closeSlash();renderBlocks();
    const nb=addBlockAfter(i,'p');
    if(nb){nb.indent=(b[i].indent||0)+1;renderBlocks();focusBlock(nb.id);}
    markDirty();return;
  }
  if(def.t==='col2'||def.t==='col3'||def.t==='col4'){closeSlash();makeColumns(id,Number(def.t.slice(3)));return;}
  if(def.t==='code'){closeSlash();renderBlocks();markDirty();editCode(id);return;}
  if(def.t==='bookmark'){b[i].text='';closeSlash();renderBlocks();markDirty();if(typeof setBookmarkUrl==='function')setBookmarkUrl(id);return;}
  closeSlash();renderBlocks();focusBlock(id);markDirty();
}

  const _f=(activeView().filters)||[];
  if(_f.length&&typeof rowPasses==='function')rows=rows.filter(r=>_f.every(f=>rowPasses(r,f)));
  if(q)rows=rows.filter(r=>Object.keys(r.cells||{}).some(k=>String(r.cells[k]==null?'':r.cells[k]).toLowerCase().includes(q)));
  if(d.sort&&d.sort.prop){
    const pr=dbProp(d.sort.prop),dir=d.sort.dir==='desc'?-1:1;
    rows.sort((a,b)=>{
      let x=a.cells[d.sort.prop],y=b.cells[d.sort.prop];
      if(pr&&pr.type==='number'){x=Number(x)||0;y=Number(y)||0;return (x-y)*dir;}
      return String(x==null?'':x).localeCompare(String(y==null?'':y))*dir;
    });
  }
  return rows;
}
function viewProps(d,v){

function cellHTML(r,pr,first){
  const raw=r.cells?r.cells[pr.id]:'';

    return '<input type="checkbox" class="cbx"'+(v===true||v==='true'?' checked':'')+' onchange="setCell(\''+r.id+'\',\''+pr.id+'\',this.checked)">';

    const opts=['<option value="">\u2014</option>'].concat(((pr.options)||[]).map(o=>
      '<option value="'+esc(o.v)+'"'+(o.v===v?' selected':'')+'>'+esc(o.v)+'</option>')).join('');

      '<span class="chip" style="background:'+selColor(pr,x.trim())+'22;color:'+selColor(pr,x.trim())+'">'+esc(x.trim())+'</span>').join('');

/* --- mutations --- */
function setView(i){const d=db();d.activeView=i;markDirty();renderDb();}
function addView(){
  const d=db();
  const kind=prompt('View type - type "table" or "board":','board');
  if(!kind)return;
  const k=kind.trim().toLowerCase()==='board'?'board':'table';
  const gb=(d.props||[]).find(p=>p.type==='select');
  d.views=d.views||[];
  d.views.push({id:uid(),name:k==='board'?'Board':'Table',kind:k,groupBy:gb?gb.id:null});
  d.activeView=d.views.length-1;markDirty();renderDb();
}
function sortBy(pid){
  const d=db();
  if(d.sort&&d.sort.prop===pid)d.sort.dir=d.sort.dir==='asc'?'desc':'asc';
  else d.sort={prop:pid,dir:'asc'};
  markDirty();renderDb();
}
function addRow(){
  const d=db(),cells={};
  (d.props||[]).forEach(p=>{cells[p.id]=p.type==='check'?false:'';});
  const r={id:uid(),cells:cells,notes:[]};
  d.rows=d.rows||[];d.rows.push(r);
  S.rowEdit=r.id;
  markDirty();renderDb();
}
function delRow(id){
  const d=db();
  if(!confirm('Delete this row?'))return;
  d.rows=(d.rows||[]).filter(r=>r.id!==id);
  if(S.rowEdit===id)S.rowEdit=null;
  markDirty();renderDb();
}
function setCell(rid,pid,val){
  const d=db(),r=(d.rows||[]).find(x=>x.id===rid);
  if(!r)return;
  r.cells=r.cells||{};r.cells[pid]=val;
  markDirty();
  const pr=dbProp(pid);
  if(pr&&(pr.type==='select'||pr.type==='multi'))renderDb();
}
function addProp(){
  const name=prompt('Property name:','New property');
  if(!name)return;
  const list=PROP_TYPES.map((t,i)=>(i+1)+'. '+t.n).join('\n');
  const pick=prompt('Type:\n'+list+'\n\nEnter a number 1-'+PROP_TYPES.length+':','1');
  const idx=Math.max(1,Math.min(PROP_TYPES.length,parseInt(pick,10)||1))-1;
  const t=PROP_TYPES[idx].t;
  const p={id:uid(),name:name.trim(),type:t};
  if(t==='select'||t==='multi'){
    const o=prompt('Options (comma separated):','Option A, Option B');
    p.options=String(o||'').split(',').map((v,i)=>({v:v.trim(),c:i})).filter(x=>x.v);
  }
  const d=db();d.props=d.props||[];d.props.push(p);
  (d.rows||[]).forEach(r=>{r.cells=r.cells||{};r.cells[p.id]=t==='check'?false:'';});
  markDirty();renderDb();
}
function editProp(pid){
  const d=db(),p=dbProp(pid);if(!p)return;
  const nm=prompt('Property name (blank to DELETE this property):',p.name);
  if(nm===null)return;
  if(!nm.trim()){
    if(!confirm('Delete the "'+p.name+'" property and its data from every row?'))return;
    d.props=(d.props||[]).filter(x=>x.id!==pid);
    (d.rows||[]).forEach(r=>{if(r.cells)delete r.cells[pid];});
    (d.views||[]).forEach(v=>{if(v.groupBy===pid)v.groupBy=null;});
    markDirty();renderDb();return;
  }
  p.name=nm.trim();
  if(p.type==='select'||p.type==='multi'){
    const o=prompt('Options (comma separated):',((p.options)||[]).map(x=>x.v).join(', '));
    if(o!==null)p.options=String(o).split(',').map((v,i)=>({v:v.trim(),c:i})).filter(x=>x.v);
  }
  markDirty();renderDb();
}
function editMulti(rid,pid){
  const d=db(),r=(d.rows||[]).find(x=>x.id===rid),p=dbProp(pid);
  if(!r||!p)return;
  const cur=String((r.cells||{})[pid]||'');
  const v=prompt('Values for "'+p.name+'" (comma separated).\nAvailable: '+((p.options)||[]).map(x=>x.v).join(', '),cur);
  if(v===null)return;
  setCell(rid,pid,String(v).split(',').map(x=>x.trim()).filter(Boolean).join(', '));
  renderDb();
}
function openRow(id){S.rowEdit=id;renderDb();}
function closeRow(){S.rowEdit=null;renderDb();}
let _dragRow=null;
function dragCard(e,id){_dragRow=id;try{e.dataTransfer.setData('text/plain',id);}catch(_){}}
function dropCard(e,pid,group){
  e.preventDefault();
  if(!_dragRow)return;
  setCell(_dragRow,pid,group);
  _dragRow=null;renderDb();
}

/* ---------- property editor ---------- */
let _propEdit=null;      // property id being edited, or null for a new one
let _propOpts=[];        // working copy of select options

function openPropEditor(pid){
  const d=db();
  const p=pid?dbProp(pid):null;
  _propEdit=pid||null;
  _propOpts=p&&Array.isArray(p.options)?p.options.map(o=>({v:o.v,c:o.c||0})):[];
  const typeOpts=PROP_TYPES.map(t=>'<option value="'+t.t+'"'+((p&&p.type===t.t)?' selected':'')+'>'+esc(t.n)+'</option>').join('');
  nxModal(pid?'Edit property':'New property',

    +'<input id="pe-name" class="nx-i" value="'+esc(p?p.name:'')+'" placeholder="e.g. Vendor">'
    +'<label class="nx-l">Type</label>'
    +'<select id="pe-type" class="nx-i" onchange="propTypeChanged()">'+typeOpts+'</select>'
    +'<div id="pe-opts"></div>'
    +((typeof relRollupFields==='function')?relRollupFields(p):'')
    +((typeof formulaField==='function')?formulaField(p):''),
    (pid?'<button class="nx-b danger" onclick="deleteProp()">Delete</button>':'')
    +'<span style="flex:1"></span>'
    +'<button class="nx-b" onclick="nxClose()">Cancel</button>'

function propTypeChanged(){
  if(typeof peTypeExtras==='function')peTypeExtras();
  const t=(document.getElementById('pe-type')||{}).value;
  const box=document.getElementById('pe-opts');
  if(!box)return;
  if(t!=='select'&&t!=='multi'){box.innerHTML='';return;}
  box.innerHTML='<label class="nx-l">Options</label><div id="pe-optlist"></div>'
    +'<button class="nx-b sm" onclick="addPropOpt()">+ Add option</button>';
  drawPropOpts();
}
function drawPropOpts(){
  const l=document.getElementById('pe-optlist');
  if(!l)return;
  l.innerHTML=_propOpts.map((o,i)=>
    '<div class="pe-opt">'
    +'<button class="pe-sw" style="background:'+SEL_COLORS[(o.c||0)%SEL_COLORS.length]+'" title="Change colour" onclick="cyclePropOpt('+i+')"></button>'
    +'<input class="nx-i" value="'+esc(o.v)+'" oninput="_propOpts['+i+'].v=this.value">'
    +'<button class="pe-x" title="Remove" onclick="rmPropOpt('+i+')">&times;</button></div>').join('')
    ||'<div class="nx-hint">No options yet.</div>';
}
function addPropOpt(){_propOpts.push({v:'',c:_propOpts.length%SEL_COLORS.length});drawPropOpts();}
function rmPropOpt(i){_propOpts.splice(i,1);drawPropOpts();}
function cyclePropOpt(i){_propOpts[i].c=((_propOpts[i].c||0)+1)%SEL_COLORS.length;drawPropOpts();}
function saveProp(){
  const name=((document.getElementById('pe-name')||{}).value||'').trim();
  const type=(document.getElementById('pe-type')||{}).value||'text';
  if(!name){toast('Give the property a name');return;}
  const d=db();
  const opts=_propOpts.map(o=>({v:String(o.v||'').trim(),c:o.c||0})).filter(o=>o.v);
  const _tgt=(document.getElementById('pe-target')||{}).value||null;
  const _rel=(document.getElementById('pe-relprop')||{}).value||null;
  const _tpr=(document.getElementById('pe-tprop')||{}).value||null;
  const _agg=(document.getElementById('pe-agg')||{}).value||'count';
  const _fx=(document.getElementById('pe-fx')||{}).value||'';
  if(_propEdit){
    const p=dbProp(_propEdit);
    if(p){
      p.name=name;p.type=type;
      if(type==='select'||type==='multi')p.options=opts;else delete p.options;
      if(type==='relation')p.targetDb=_tgt;else delete p.targetDb;
      if(type==='rollup'){p.relProp=_rel;p.targetProp=_tpr;p.agg=_agg;}
      else{delete p.relProp;delete p.targetProp;delete p.agg;}
      if(type==='formula')p.formula=_fx;else delete p.formula;
    }
  }else{
    const p={id:uid(),name:name,type:type};
    if(type==='select'||type==='multi')p.options=opts;
    if(type==='relation')p.targetDb=_tgt;
    if(type==='rollup'){p.relProp=_rel;p.targetProp=_tpr;p.agg=_agg;}
    if(type==='formula')p.formula=_fx;
    d.props=d.props||[];d.props.push(p);
    (d.rows||[]).forEach(r=>{r.cells=r.cells||{};r.cells[p.id]=(type==='check')?false:'';});
  }
  nxClose();markDirty();renderDb();
}
function deleteProp(){
  const d=db(),p=dbProp(_propEdit);
  if(!p)return;
  if(!confirm('Delete the "'+p.name+'" property and its values from every row?'))return;
  d.props=(d.props||[]).filter(x=>x.id!==_propEdit);
  (d.rows||[]).forEach(r=>{if(r.cells)delete r.cells[_propEdit];});
  (d.views||[]).forEach(v=>{
    if(v.groupBy===_propEdit)v.groupBy=null;
    if(Array.isArray(v.filters))v.filters=v.filters.filter(f=>f.prop!==_propEdit);
  });
  if(d.sort&&d.sort.prop===_propEdit)d.sort=null;
  nxClose();markDirty();renderDb();
}

function saveView(){
  const d=db();
  const name=((document.getElementById('ve-name')||{}).value||'').trim()||'View';
  const kind=(document.getElementById('ve-kind')||{}).value||'table';
  const groupBy=(document.getElementById('ve-group')||{}).value||null;
  const dateProp=(document.getElementById('ve-date')||{}).value||null;
  const imgProp=(document.getElementById('ve-img')||{}).value||null;
  const endProp=(document.getElementById('ve-end')||{}).value||null;
  if(_viewEdit===null){
    d.views=d.views||[];
    d.views.push({id:uid(),name:name,kind:kind,groupBy:groupBy,dateProp:dateProp,imgProp:imgProp,endProp:endProp,filters:[]});
    d.activeView=d.views.length-1;

/* ---------- filters ---------- */
const OPS={
  text:[['contains','contains'],['is','is'],['nis','is not'],['empty','is empty'],['nempty','is not empty']],
  number:[['eq','='],['gt','>'],['lt','<'],['empty','is empty'],['nempty','is not empty']],
  select:[['is','is'],['nis','is not'],['empty','is empty'],['nempty','is not empty']],
  multi:[['contains','contains'],['empty','is empty'],['nempty','is not empty']],
  rollup:[['eq','='],['gt','>'],['lt','<']],
  date:[['is','on'],['gt','after'],['lt','before'],['empty','is empty'],['nempty','is not empty']],
  check:[['yes','is checked'],['no','is unchecked']],
  url:[['contains','contains'],['empty','is empty'],['nempty','is not empty']],
  person:[['contains','contains'],['is','is'],['empty','is empty'],['nempty','is not empty']],
  relation:[['is','is'],['empty','is empty'],['nempty','is not empty']]
};
function opsFor(t){return OPS[t]||OPS.text;}
function rowPasses(r,f){
  const p=dbProp(f.prop);
  if(!p)return true;
  const raw=(r.cells||{})[f.prop];
  const v=(raw===null||raw===undefined)?'':String(raw);
  const q=String(f.val==null?'':f.val);
  switch(f.op){
    case 'empty':    return v==='' || v==='false';
    case 'nempty':   return !(v==='' || v==='false');
    case 'is':       return v.toLowerCase()===q.toLowerCase();
    case 'nis':      return v.toLowerCase()!==q.toLowerCase();
    case 'contains': return v.toLowerCase().includes(q.toLowerCase());
    case 'eq':       return Number(v)===Number(q);
    case 'gt':       return (p.type==='date')?(v>q):(Number(v)>Number(q));
    case 'lt':       return (p.type==='date')?(v<q&&v!==''):(Number(v)<Number(q));
    case 'yes':      return v==='true'||raw===true;
    case 'no':       return !(v==='true'||raw===true);
    default:         return true;
  }
}
function openFilterEditor(){
  const d=db(),v=activeView();
  v.filters=Array.isArray(v.filters)?v.filters:[];
  nxModal('Filters - '+(v.name||'view'),
    '<div id="fe-list"></div><button class="nx-b sm" onclick="addFilterRow()">+ Add filter</button>'
    +'<div class="nx-hint">All conditions must match.</div>',
    '<span style="flex:1"></span><button class="nx-b" onclick="nxClose()">Done</button>');
  drawFilters();
}
function drawFilters(){
  const v=activeView(),d=db(),l=document.getElementById('fe-list');
  if(!l)return;
  const props=d.props||[];
  l.innerHTML=(v.filters||[]).map((f,i)=>{
    const p=dbProp(f.prop)||props[0]||{};
    const ops=opsFor(p.type||'text');
    const needsVal=['empty','nempty','yes','no'].indexOf(f.op)<0;
    let valInput='';
    if(needsVal){
      if(p.type==='select'&&Array.isArray(p.options))
        valInput='<select class="nx-i" onchange="setFilterVal('+i+',this.value)">'
          +'<option value="">-</option>'
          +p.options.map(o=>'<option value="'+esc(o.v)+'"'+(o.v===f.val?' selected':'')+'>'+esc(o.v)+'</option>').join('')+'</select>';
      else if(p.type==='date')
        valInput='<input type="date" class="nx-i" value="'+esc(f.val||'')+'" onchange="setFilterVal('+i+',this.value)">';
      else
        valInput='<input class="nx-i" value="'+esc(f.val||'')+'" oninput="setFilterVal('+i+',this.value)">';
    }
    return '<div class="fe-row">'
      +'<select class="nx-i" onchange="setFilterProp('+i+',this.value)">'
        +props.map(pp=>'<option value="'+pp.id+'"'+(pp.id===f.prop?' selected':'')+'>'+esc(pp.name)+'</option>').join('')+'</select>'
      +'<select class="nx-i" onchange="setFilterOp('+i+',this.value)">'
        +ops.map(o=>'<option value="'+o[0]+'"'+(o[0]===f.op?' selected':'')+'>'+esc(o[1])+'</option>').join('')+'</select>'
      +valInput

/* ---------- @mentions + backlinks ---------- */
function mentionify(escaped){
  // Runs on ALREADY-escaped text. Only the rendered HTML changes - the block model keeps
  // the plain "@Title", so textContent round-trips byte-for-byte and caret maths is unaffected.
  const pages=(S.pages||[]).slice().sort((a,b)=>(b.title||'').length-(a.title||'').length);
  let out=escaped;
  pages.forEach(p=>{
    const t=(p.title||'').trim();
    if(!t||t==='Untitled')return;
    const needle='@'+esc(t);
    if(out.indexOf(needle)<0)return;
    out=out.split(needle).join('<a class="mention" data-pid="'+p.id+'" title="Open '+esc(t)+'">'+needle+'</a>');
  });
  return out;
}
function pageMentions(page){
  const ids=new Set();
  const scan=t=>{
    const txt=String(t||'');
    (S.pages||[]).forEach(p=>{
      const ti=(p.title||'').trim();
      if(ti&&ti!=='Untitled'&&p.id!==page.id&&txt.indexOf('@'+ti)>=0)ids.add(p.id);
    });
  };
  if(isDb(page))((page.content||{}).rows||[]).forEach(r=>(r.notes||[]).forEach(b=>scan(b.text)));
  else (Array.isArray(page.content)?page.content:[]).forEach(b=>scan(b.text));
  return [...ids];
}
function backlinksFor(pageId){
  const me=pageById(pageId);
  if(!me)return [];
  const t=(me.title||'').trim();
  if(!t||t==='Untitled')return [];
  return (S.pages||[]).filter(p=>p.id!==pageId&&pageMentions(p).indexOf(pageId)>=0);
}
function backlinksHTML(pageId){
  const list=backlinksFor(pageId);
  if(!list.length)return '';
  return '<div class="bl-wrap"><div class="bl-h">Linked from</div>'
    +list.map(p=>'<a class="bl-i" onclick="openPage(\''+p.id+'\')">'
      +(p.icon?esc(p.icon):(isDb(p)?'\u{1F5C3}':'\u{1F4C4}'))+' '+esc(p.title||'Untitled')+'</a>').join('')
    +'</div>';
}
document.addEventListener('click',e=>{
  const m=e.target.closest&&e.target.closest('.mention');
  if(m){e.preventDefault();e.stopPropagation();const id=m.getAttribute('data-pid');if(id)openPage(id);}
},true);
document.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('a[href]');

},true);

let atOpen=false,atSel=0,atHost=null,atList=[];
function openAt(host,filter){
  const f=(filter||'').toLowerCase();
  const people=(typeof peopleHits==='function'?peopleHits(f):[]).map(t=>({_person:t}));
  const pages=(S.pages||[]).filter(p=>p.id!==S.activeId&&(p.title||'').toLowerCase().includes(f)).slice(0,8);
  atList=people.concat(pages);
  if(!atList.length){closeAt();return;}

  el.style.display='block';
  el.style.left=Math.min(r.left,window.innerWidth-280)+'px';

function drawAt(){
  let out='',lastKind='';
  atList.forEach((p,i)=>{
    const kind=p._person?'people':'pages';
    if(kind!==lastKind){out+='<div class="sh">'+(kind==='people'?'People':'Pages')+'</div>';lastKind=kind;}
    if(p._person){
      const t=p._person;
      out+='<div class="si'+(i===atSel?' sel':'')+'" data-ai="'+i+'"><span class="em">\u263A</span>'
        +'<div><div>'+esc(t.display_name||t.email)+'</div><div class="d">'+esc(t.email||'')+' - notify</div></div></div>';
    }else{

        +(p.icon?esc(p.icon):'\u{1F4C4}')+'</span><div><div>'+esc(p.title||'Untitled')+'</div></div></div>';
    }
  });
  document.getElementById('slash').innerHTML=out;
}
function closeAt(){atOpen=false;atHost=null;const e=document.getElementById('slash');if(e)e.style.display='none';}
function atKey(e){
  if(e.key==='Escape'){e.preventDefault();closeAt();return;}
  if(e.key==='ArrowDown'){e.preventDefault();atSel=(atSel+1)%atList.length;drawAt();return;}
  if(e.key==='ArrowUp'){e.preventDefault();atSel=(atSel-1+atList.length)%atList.length;drawAt();return;}
  if(e.key==='Enter'){e.preventDefault();applyAt(atList[atSel]);}
}
function applyAt(p){
  if(!p||!atHost)return;
  if(p._person&&typeof applyPersonMention==='function'){applyPersonMention(p._person);return;}
  const id=atHost.getAttribute('data-bid'),i=blockIndex(id),b=blocks();

}

/* ---------- trash ---------- */
async function archivePage(id){
  const p=pageById(id);
  if(!p)return;
  const kids=childrenOf(id).length;
  if(!confirm('Move "'+(p.title||'Untitled')+'"'+(kids?(' and its '+kids+' sub-page(s)'):'')+' to trash?'))return;
  const drop=new Set([id]);
  let grew=true;
  while(grew){grew=false;S.pages.forEach(x=>{if(x.parent_id&&drop.has(x.parent_id)&&!drop.has(x.id)){drop.add(x.id);grew=true;}});}
  try{
    const {error}=await sb.from('wiki_pages').update({archived:true}).in('id',[...drop]);
    if(error)throw error;
    S.pages.forEach(x=>{if(drop.has(x.id))x.archived=true;});
    S.trash=(S.trash||[]).concat(S.pages.filter(x=>drop.has(x.id)));
    S.pages=S.pages.filter(x=>!drop.has(x.id));
    if(drop.has(S.activeId))S.activeId=null;
    renderTree();
    const f=S.pages[0];if(f)openPage(f.id);else renderDoc();
    toast('Moved to trash - restore from the Trash list');
  }catch(e){toast(writeErr(e,'move the page to trash'),9000);}
}
async function openTrash(){
  try{
    const {data,error}=await sb.from('wiki_pages').select('*').eq('archived',true).order('updated_at',{ascending:false});
    if(error)throw error;
    S.trash=data||[];
  }catch(e){toast(writeErr(e,'load the trash'),9000);return;}
  const rows=(S.trash||[]).map(p=>'<div class="tr-row"><span class="tr-n">'
    +(p.icon?esc(p.icon):'\u{1F4C4}')+' '+esc(p.title||'Untitled')+'</span>'
    +'<button class="nx-b sm" onclick="restorePage(\''+p.id+'\')">Restore</button>'
    +'<button class="nx-b sm danger" onclick="purgePage(\''+p.id+'\')">Delete forever</button></div>').join('')
    ||'<div class="nx-hint">Trash is empty.</div>';
  nxModal('Trash', rows, '<span style="flex:1"></span><button class="nx-b" onclick="nxClose()">Close</button>');
}
async function restorePage(id){
  try{
    const {error}=await sb.from('wiki_pages').update({archived:false}).eq('id',id);
    if(error)throw error;
    const p=(S.trash||[]).find(x=>x.id===id);
    if(p){p.archived=false;S.pages.push(p);S.trash=S.trash.filter(x=>x.id!==id);}
    renderTree();openTrash();toast('Restored');
  }catch(e){toast(writeErr(e,'restore the page'),9000);}
}
async function purgePage(id){
  if(!confirm('Delete this page permanently? This cannot be undone.'))return;
  try{
    const {error}=await sb.from('wiki_pages').delete().eq('id',id);
    if(error)throw error;
    S.trash=(S.trash||[]).filter(x=>x.id!==id);
    openTrash();toast('Deleted permanently');
  }catch(e){toast(writeErr(e,'delete the page'),9000);}
}

const NOTES_BUCKET='part-files';   // reuses the bucket the ERP already has

/* ---------- image blocks ---------- */
function imageBlockHTML(bl){
  const url=(bl.src||'').trim();
  const cap=bl.text||'';
  if(!url){
    return '<div class="img-empty" onclick="pickImage(\''+bl.id+'\')">'
      +'<div class="img-empty-i">\u{1F5BC}</div>'

  }

    +'<figcaption class="bk-t" contenteditable="true" spellcheck="true" data-ph="Add a caption...">'+esc(cap)+'</figcaption>'
    +'</figure>';
}
function pickImage(bid){
  _imgTarget=bid;
  nxModal('Image',
    '<label class="nx-l">Paste an image URL</label>'
    +'<input id="im-url" class="nx-i" placeholder="https://...">'
    +'<div class="nx-hint">or</div>'
    +'<input type="file" id="im-file" accept="image/*" style="display:none" onchange="uploadImage(this)">'
    +'<button class="nx-b" onclick="document.getElementById(\'im-file\').click()">Upload from this device</button>'
    +'<div id="im-status" class="nx-hint"></div>',
    '<span style="flex:1"></span><button class="nx-b" onclick="nxClose()">Cancel</button>'
    +'<button class="nx-b primary" onclick="applyImageUrl()">Use URL</button>');
  setTimeout(()=>{const f=document.getElementById('im-url');if(f)f.focus();},40);

let _imgTarget=null;
function applyImageUrl(){
  const u=((document.getElementById('im-url')||{}).value||'').trim();
  if(!u){toast('Paste a URL or upload a file');return;}
  setImageSrc(_imgTarget,u);
  nxClose();
}
async function uploadImage(inp){
  const f=inp&&inp.files&&inp.files[0];
  if(!f)return;
  const st=document.getElementById('im-status');
  const set=t=>{if(st)st.textContent=t;};
  if(!/^image\//i.test(f.type||'')){set('That is not an image file');inp.value='';return;}
  if(f.size>10*1024*1024){set('Too large (max 10MB)');inp.value='';return;}
  set('Uploading '+f.name+'...');
  try{
    const safe=f.name.replace(/[^a-zA-Z0-9._\-]/g,'_');
    const path='notes/'+(S.activeId||'page')+'/'+Date.now()+'_'+safe;
    const up=await sb.storage.from(NOTES_BUCKET).upload(path,f,{upsert:false});
    if(up.error)throw up.error;
    const pub=sb.storage.from(NOTES_BUCKET).getPublicUrl(path);
    const url=(pub&&pub.data&&pub.data.publicUrl)||'';
    if(!url)throw new Error('no public URL returned');
    setImageSrc(_imgTarget,url);
    nxClose();
  }catch(e){
    const m=String((e&&e.message)||e||'');
    if(/bucket|not found/i.test(m))set('Upload failed: the '+NOTES_BUCKET+' storage bucket is missing');
    else if(/row-level security|permission|unauthor/i.test(m))set('Upload blocked by the storage policy on '+NOTES_BUCKET);
    else set('Upload failed: '+m);
  }finally{inp.value='';}
}
function setImageSrc(bid,url){
  const b=blocks(),i=blockIndex(bid);
  if(i<0)return;
  b[i].src=url;
  renderBlocks();markDirty();
}

var _rowDrag=null,_rowBelow=false;
function rowDragStart(e){var tr=e.target.closest&&e.target.closest('tr[data-rid]');_rowDrag=tr?tr.getAttribute('data-rid'):null;if(_rowDrag){try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',_rowDrag);}catch(_){}}}
document.addEventListener('dragover',function(e){
  if(!_rowDrag)return;
  var tr=e.target.closest&&e.target.closest('tr[data-rid]');
  if(!tr)return;
  e.preventDefault();
  document.querySelectorAll('tr.rw-above,tr.rw-below').forEach(function(x){x.classList.remove('rw-above','rw-below');});
  var r=tr.getBoundingClientRect();_rowBelow=(e.clientY>r.top+r.height/2);
  tr.classList.add(_rowBelow?'rw-below':'rw-above');
});
document.addEventListener('drop',function(e){
  if(!_rowDrag)return;
  var tr=e.target.closest&&e.target.closest('tr[data-rid]');
  document.querySelectorAll('tr.rw-above,tr.rw-below').forEach(function(x){x.classList.remove('rw-above','rw-below');});
  if(tr){e.preventDefault();var rid=tr.getAttribute('data-rid');if(rid&&rid!==_rowDrag)rowReorder(_rowDrag,rid,_rowBelow);}
  _rowDrag=null;
});
document.addEventListener('dragend',function(){_rowDrag=null;document.querySelectorAll('tr.rw-above,tr.rw-below').forEach(function(x){x.classList.remove('rw-above','rw-below');});});
function rowReorder(dragRid,targetRid,below){
  var d=db(),v=activeView(),rows=d.rows||[];
  var from=-1,to=-1;
  for(var k=0;k<rows.length;k++){if(rows[k].id===dragRid)from=k;if(rows[k].id===targetRid)to=k;}
  if(from<0||to<0||from===to)return;
  var m=rows[from],tgt=rows[to];
  if(v&&v.groupBy){var gp=dbProp(v.groupBy);if(gp){m.cells=m.cells||{};m.cells[v.groupBy]=(tgt.cells||{})[v.groupBy];}}
  rows.splice(from,1);
  var ti=-1;for(var j=0;j<rows.length;j++){if(rows[j].id===targetRid){ti=j;break;}}
  if(ti<0)ti=rows.length-1;
  rows.splice(ti+(below?1:0),0,m);
  if(d.sort&&d.sort.prop){d.sort=null;toast('Sort cleared - showing manual order');}
  markDirty();renderDb();
}

let _dragPage=null;
function pgDragStart(e,id){_dragPage=id;try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);}catch(_){}}
function pgDragOver(e,id,zone){
  if(!_dragPage||_dragPage===id)return;
  e.preventDefault();
  const el=e.currentTarget;
  el.classList.remove('dz-in','dz-above','dz-below');
  el.classList.add(zone==='in'?'dz-in':(zone==='above'?'dz-above':'dz-below'));
}
function pgDragLeave(e){e.currentTarget.classList.remove('dz-in','dz-above','dz-below');}
function isDescendant(candidateId,ofId){
  let cur=pageById(candidateId);
  while(cur&&cur.parent_id){
    if(cur.parent_id===ofId)return true;
    cur=pageById(cur.parent_id);
  }
  return false;
}
async function pgDrop(e,targetId,zone){
  e.preventDefault();e.stopPropagation();
  const el=e.currentTarget;el.classList.remove('dz-in','dz-above','dz-below');
  const src=_dragPage;_dragPage=null;
  if(!src||src===targetId)return;
  if(isDescendant(targetId,src)){toast('A page cannot be moved inside its own sub-page');return;}
  const sp=pageById(src),tp=pageById(targetId);
  if(!sp||!tp)return;
  let newParent,newSort;
  if(zone==='in'){
    newParent=tp.id;
    newSort=nextSort(tp.id);
  }else{
    newParent=tp.parent_id||null;
    const sibs=childrenOf(newParent).filter(x=>x.id!==src);
    const idx=sibs.findIndex(x=>x.id===tp.id);
    const before=zone==='above'?sibs[idx-1]:sibs[idx];
    const after =zone==='above'?sibs[idx]  :sibs[idx+1];
    const lo=before?(Number(before.sort_order)||0):0;
    const hi=after?(Number(after.sort_order)||lo+2000):lo+2000;
    newSort=(lo+hi)/2;
  }
  try{
    const{error}=await sb.from('wiki_pages').update({parent_id:newParent,sort_order:newSort}).eq('id',src);
    if(error)throw error;
    sp.parent_id=newParent;sp.sort_order=newSort;
    if(newParent)S.collapsed[newParent]=false;
    renderTree();
  }catch(err){toast(writeErr(err,'move the page'),9000);}
}

/* ---------- markdown export ---------- */
function blocksToMd(bl){
  const out=[];
  (bl||[]).forEach(b=>{
    const ind='  '.repeat(b.indent||0);
    const t=b.text||'';
    switch(b.type){
      case 'h1': out.push('# '+t);break;
      case 'h2': out.push('## '+t);break;
      case 'h3': out.push('### '+t);break;
      case 'bullet': out.push(ind+'- '+t);break;
      case 'num': out.push(ind+'1. '+t);break;
      case 'todo': out.push(ind+'- ['+(b.checked?'x':' ')+'] '+t);break;
      case 'quote': out.push('> '+t);break;
      case 'callout': out.push('> **Note:** '+t);break;
      case 'code': out.push('```'+(b.lang&&b.lang!=='plain'?b.lang:'')+'\n'+t+'\n```');break;
      case 'divider': out.push('---');break;
      case 'image': out.push('!['+(t||'image')+']('+(b.src||'')+')');break;
      case 'bookmark': out.push('['+(b.title||b.url||'link')+']('+(b.url||'')+')');break;
      case 'embed': out.push('['+(b.url||'embed')+']('+(b.url||'')+')');break;
      default: out.push(t);
    }
    out.push('');
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function pageToMd(p){
  if(!p)return '';
  let md='# '+(p.title||'Untitled')+'\n\n';
  if(isDb(p)){
    const d=p.content||{},props=d.props||[];
    md+='| '+props.map(x=>x.name).join(' | ')+' |\n';
    md+='| '+props.map(()=>'---').join(' | ')+' |\n';
    (d.rows||[]).forEach(r=>{
      md+='| '+props.map(x=>String((r.cells||{})[x.id]==null?'':(r.cells||{})[x.id]).replace(/\|/g,'\\|')).join(' | ')+' |\n';
    });
  }else{
    md+=blocksToMd(Array.isArray(p.content)?p.content:[]);
  }
  return md.trim()+'\n';
}
function exportPage(){
  const p=curPage();
  if(!p){toast('Open a page first');return;}

    +'<button class="nx-b" onclick="nxClose()">Close</button>'

function downloadMd(){

/* ---------- quick switcher ---------- */
let qsOpen=false, qsSel=0, qsHits=[];
function qsSearch(term){
  const q=String(term||'').trim().toLowerCase();
  const out=[];
  const _cmds=(typeof paletteCommands==='function')?paletteCommands():[];
  if(q){_cmds.forEach(c=>{if(c.key.indexOf(q)>=0||c.label.toLowerCase().indexOf(q)>=0)out.push({kind:'cmd',icon:c.icon,label:c.label,sub:'Command',run:c.run});});}
  if(!q&&typeof recentHits==='function'){
    recentHits().forEach(h=>out.push(h));
    _cmds.slice(0,4).forEach(c=>out.push({kind:'cmd',icon:c.icon,label:c.label,sub:'Command',run:c.run}));
  }
  (S.pages||[]).forEach(p=>{
    const title=(p.title||'Untitled');
    if(!q||title.toLowerCase().includes(q))
      out.push({kind:'page',id:p.id,icon:p.icon||(isDb(p)?'\u{1F5C3}':'\u{1F4C4}'),label:title,sub:isDb(p)?'Database':'Page'});
  });
  if(q){
    (S.pages||[]).forEach(p=>{
      if(isDb(p)){
        const d=p.content||{},first=(d.props||[])[0];
        (d.rows||[]).forEach(r=>{
          const vals=Object.keys(r.cells||{}).map(k=>String(r.cells[k]==null?'':r.cells[k]));
          if(vals.some(v=>v.toLowerCase().includes(q))){
            const title=first?String((r.cells||{})[first.id]||'Untitled row'):'Row';
            out.push({kind:'row',id:p.id,rowId:r.id,icon:'\u25A6',label:title,sub:'in '+(p.title||'Untitled')});
          }
        });
      }else{
        (Array.isArray(p.content)?p.content:[]).forEach(b=>{
          const _pl=(typeof blockPlain==='function')?blockPlain(b.text||''):String(b.text||'');
          const _ix=_pl.toLowerCase().indexOf(q);
          if(_ix>=0){
            const _st=Math.max(0,_ix-24);
            const _sn=(_st>0?'\u2026':'')+_pl.slice(_st,_st+80).trim()+((_pl.length>_st+80)?'\u2026':'');
            out.push({kind:'block',id:p.id,bid:b.id,icon:'\u00b6',label:_sn,sub:'in '+(p.title||'Untitled')});
          }
        });
      }
    });
  }
  const seen=new Set();
  return out.filter(h=>{
    const k=h.kind+':'+h.id+':'+(h.rowId||'')+':'+h.label;
    if(seen.has(k))return false;seen.add(k);return true;
  }).slice(0,25);
}
/* ---------- due-date reminders ---------- */
function _isRowDone(d,r){
  var props=(d.props||[]);
  for(var i=0;i<props.length;i++){
    var p=props[i],v=(r.cells||{})[p.id];
    if(p.type==='select'&&/^(done|complete|completed|closed|shipped|cancelled|canceled)$/i.test(String(v||'').trim()))return true;
    if(p.type==='check'&&/done|complete|ship/i.test(p.name||'')&&(v===true||v==='true'))return true;
  }
  return false;
}
function collectReminders(){
  var today=new Date();today.setHours(0,0,0,0);
  var out={overdue:[],today:[],soon:[]};
  (S.pages||[]).forEach(function(p){
    if(!isDb(p))return;
    var d=p.content||{};
    var dateProps=(d.props||[]).filter(function(x){return x.type==='date';});
    if(!dateProps.length)return;
    var first=(d.props||[])[0];
    (d.rows||[]).forEach(function(r){
      if(r.archived)return;
      if(_isRowDone(d,r))return;
      dateProps.forEach(function(dp){
        var raw=String((r.cells||{})[dp.id]||'').slice(0,10);
        if(!raw)return;
        var dt=new Date(raw+'T00:00:00');if(isNaN(dt.getTime()))return;
        var diff=Math.round((dt-today)/86400000);
        if(diff>7)return;
        var item={pageId:p.id,rowId:r.id,title:first?String((r.cells||{})[first.id]||'Untitled'):'Row',db:p.title||'Untitled',date:raw,prop:dp.name,diff:diff};
        if(diff<0)out.overdue.push(item);else if(diff===0)out.today.push(item);else out.soon.push(item);
      });
    });
  });
  var by=function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;};
  out.overdue.sort(by);out.today.sort(by);out.soon.sort(by);
  return out;
}
function reminderCount(){var r=collectReminders();return r.overdue.length+r.today.length;}
function refreshReminderBadge(){
  var b=document.getElementById('rem-badge');if(!b)return;
  var n=reminderCount();
  if(n>0){b.textContent=n>99?'99+':String(n);b.style.display='';}else{b.style.display='none';}
}
function gotoReminder(pid,rid){nxClose();openPage(pid);S.rowEdit=rid;setTimeout(function(){try{renderDb();}catch(e){}},40);}
function openReminders(){
  var r=collectReminders();
  function sec(title,items,cls){
    if(!items.length)return '';
    return '<div class="rem-h '+cls+'">'+title+' ('+items.length+')</div>'
      +items.map(function(it){
        var when=it.diff<0?(Math.abs(it.diff)+'d overdue'):it.diff===0?'today':('in '+it.diff+'d');
        return '<div class="rem-i" onclick="gotoReminder(\''+it.pageId+'\',\''+it.rowId+'\')">'
          +'<span class="rem-t">'+esc(it.title)+'</span>'
          +'<span class="rem-m">'+esc(it.db)+' \u00b7 '+esc(it.prop)+' '+esc(it.date)+'</span>'
          +'<span class="rem-w '+cls+'">'+when+'</span></div>';
      }).join('');
  }
  var body=sec('Overdue',r.overdue,'ov')+sec('Today',r.today,'td')+sec('Next 7 days',r.soon,'sn');
  if(!body)body='<div class="nx-hint" style="padding:14px 2px">Nothing due in the next 7 days. Add a Date property to a database and set due dates to see reminders here. Rows marked Done are skipped.</div>';
  nxModal('Reminders',body,'<span style="flex:1"></span><button class="nx-b" onclick="nxClose()">Close</button>');
}

function qsDraw(term){

document.addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='k'){e.preventDefault();if(qsOpen)closeQuickSwitch();else openQuickSwitch();return;}
  if(!qsOpen)return;
  if(e.key==='Escape'){e.preventDefault();closeQuickSwitch();return;}
  if(e.key==='ArrowDown'){e.preventDefault();qsSel=Math.min(qsHits.length-1,qsSel+1);qsDraw(document.getElementById('qs-i').value);return;}
  if(e.key==='ArrowUp'){e.preventDefault();qsSel=Math.max(0,qsSel-1);qsDraw(document.getElementById('qs-i').value);return;}
  if(e.key==='Enter'){e.preventDefault();qsGo(qsSel);}
},true);

/* ---------- calendar view ---------- */
function monthMeta(ym){
  const [y,m]=String(ym||'').split('-').map(Number);
  const d=(y&&m)?new Date(y,m-1,1):new Date();
  const year=d.getFullYear(),mon=d.getMonth();
  const first=new Date(year,mon,1), last=new Date(year,mon+1,0);
  return {year,mon,firstDow:first.getDay(),days:last.getDate(),
          key:year+'-'+String(mon+1).padStart(2,'0'),
          label:first.toLocaleDateString(undefined,{month:'long',year:'numeric'})};
}
function shiftMonth(delta){
  const v=activeView();
  const m=monthMeta(v.month);
  const d=new Date(m.year,m.mon+delta,1);
  v.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  markDirty();renderDb();
}

/* ---------- timeline view ---------- */
var _TL_MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
function _tlDays(min,max){var out=[],dt=new Date(min.getTime());while(dt<=max){out.push(new Date(dt.getTime()));dt.setDate(dt.getDate()+1);}return out;}
function dbTimelineHTML(d,v){
  var dp=(v.dateProp&&dbProp(v.dateProp))||(d.props||[]).find(function(p){return p.type==='date';});
  if(!dp)return '<div class="tl-empty">Timeline needs a Date property. Add one, then set it on this view.</div>';
  var ep=v.endProp?dbProp(v.endProp):null;
  var first=(d.props||[])[0];
  var gp=(v.groupBy&&dbProp(v.groupBy))||((d.props||[]).find(function(p){return p.type==='select';}));
  var rows=visibleRows(d).filter(function(r){return String((r.cells||{})[dp.id]||'').slice(0,10);});
  if(!rows.length)return '<div class="tl-empty">No rows have a '+esc(dp.name)+' date yet.</div>';
  var all=[];
  rows.forEach(function(r){
    var sd=String((r.cells||{})[dp.id]||'').slice(0,10);
    var ed=ep?String((r.cells||{})[ep.id]||'').slice(0,10):'';
    if(sd)all.push(sd);if(ed)all.push(ed);
  });
  all.sort();
  var min=new Date(all[0]+'T00:00:00'),max=new Date(all[all.length-1]+'T00:00:00');
  min.setDate(min.getDate()-2);max.setDate(max.getDate()+2);
  var days=_tlDays(min,max);if(days.length>180)days=days.slice(0,180);
  var dayW=34,fullW=days.length*dayW;
  function di(ds){var t=new Date(ds+'T00:00:00');var ix=Math.round((t-min)/86400000);return Math.max(0,Math.min(days.length-1,ix));}
  var mb='',i2=0;
  while(i2<days.length){
    var ym=days[i2].getFullYear()+'-'+days[i2].getMonth(),j=i2;
    while(j<days.length&&(days[j].getFullYear()+'-'+days[j].getMonth())===ym)j++;
    mb+='<div class="tl-mo" style="width:'+((j-i2)*dayW)+'px">'+esc(_TL_MONTHS[days[i2].getMonth()]+' '+days[i2].getFullYear())+'</div>';
    i2=j;
  }
  var dh=days.map(function(dt){
    var wk=(dt.getDay()===0||dt.getDay()===6)?' tl-wknd':'';
    return '<div class="tl-day'+wk+'" style="width:'+dayW+'px"><div class="tl-wd">'+'SMTWTFS'.charAt(dt.getDay())+'</div><div class="tl-dn">'+dt.getDate()+'</div></div>';
  }).join('');
  var lanes=rows.slice().sort(function(a,b){return String((a.cells||{})[dp.id]).localeCompare(String((b.cells||{})[dp.id]));}).map(function(r){
    var sd=String((r.cells||{})[dp.id]||'').slice(0,10);
    var ed=ep?String((r.cells||{})[ep.id]||'').slice(0,10):'';if(!ed)ed=sd;
    var si=di(sd),ei=di(ed);if(ei<si)ei=si;
    var title=first?String((r.cells||{})[first.id]||'Untitled'):'Row';
    var col=(gp&&gp.type==='select')?selColor(gp,String((r.cells||{})[gp.id]||'')):'#0d9488';
    var span=(ed!==sd?(' \u2192 '+ed):'');
    return '<div class="tl-lane" style="width:'+fullW+'px">'
      +'<div class="tl-bar" style="left:'+(si*dayW)+'px;width:'+Math.max(dayW,(ei-si+1)*dayW)+'px;background:'+col+'" onclick="openRow(\''+r.id+'\')" title="'+esc(title+' ('+sd+span+')')+'">'+esc(title)+'</div></div>';
  }).join('');
  return '<div class="tl-wrap"><div class="tl-inner" style="width:'+fullW+'px">'
    +'<div class="tl-months">'+mb+'</div>'
    +'<div class="tl-days">'+dh+'</div>'
    +'<div class="tl-lanes">'+lanes+'</div></div></div>';
}

/* ---------- toggle blocks ---------- */
function toggleHidden(b){
  // A closed toggle hides every following block indented deeper than it,
  // stopping at the first block back at its own level or shallower.
  const hidden={};
  (b||[]).forEach((bl,i)=>{
    if(bl.type!=='toggle'||bl.open)return;
    for(let j=i+1;j<b.length;j++){
      if((b[j].indent||0)<=(bl.indent||0))break;
      hidden[j]=true;
    }
  });
  return hidden;
}
function toggleBlock(bid){
  const b=blocks(),i=blockIndex(bid);
  if(i<0)return;
  b[i].open=!b[i].open;
  renderBlocks();markDirty();
}
function toggleCount(bid){
  const b=blocks(),i=blockIndex(bid);
  if(i<0)return 0;
  let n=0;
  for(let j=i+1;j<b.length;j++){
    if((b[j].indent||0)<=(b[i].indent||0))break;
    n++;
  }
  return n;
}

/* ---------- inline table block ---------- */
function ensureTable(bl){
  if(!Array.isArray(bl.rows)||!bl.rows.length){
    bl.rows=[['Column A','Column B'],['',''],['','']];
    bl.head=true;
  }
  const w=Math.max.apply(null,bl.rows.map(r=>r.length));
  bl.rows.forEach(r=>{while(r.length<w)r.push('');});
  return bl;
}
function tableBlockHTML(bl){
  ensureTable(bl);
  const cols=bl.rows[0].length;
  const body=bl.rows.map((row,r)=>
    '<tr>'+row.map((cell,c)=>
      '<'+((bl.head&&r===0)?'th':'td')+' class="tb-cell">'
      +'<div class="tb-c" contenteditable="true" spellcheck="true" data-tr="'+r+'" data-tc="'+c+'">'+esc(cell||'')+'</div>'
      +'</'+((bl.head&&r===0)?'th':'td')+'>').join('')
    +'<td class="tb-act"><button class="tb-x" title="Delete this row" onclick="tblRowDel(\''+bl.id+'\','+r+')">&times;</button></td></tr>').join('');
  const colDel='<tr class="tb-colbar">'+bl.rows[0].map((_,c)=>
      '<td><button class="tb-x" title="Delete this column" onclick="tblColDel(\''+bl.id+'\','+c+')">&times;</button></td>').join('')
    +'<td></td></tr>';
  return '<div class="tb-wrap">'
    +'<table class="tb"><tbody>'+body+colDel+'</tbody></table>'
    +'<div class="tb-bar">'
      +'<button class="nx-b sm" onclick="tblRowAdd(\''+bl.id+'\')">+ Row</button>'
      +'<button class="nx-b sm" onclick="tblColAdd(\''+bl.id+'\')">+ Column</button>'
      +'<button class="nx-b sm" onclick="tblHead(\''+bl.id+'\')">'+(bl.head?'No header row':'Header row')+'</button>'+'<button class="nx-b sm danger" onclick="delBlock(\''+bl.id+'\')">Delete table</button>'
      +'<span class="tb-n">'+bl.rows.length+' \u00d7 '+cols+'</span>'
    +'</div></div>';
}
function tblBlock(bid){const b=blocks(),i=blockIndex(bid);return i<0?null:b[i];}
function tblRowAdd(bid){const bl=tblBlock(bid);if(!bl)return;ensureTable(bl);bl.rows.push(bl.rows[0].map(()=>''));renderBlocks();markDirty();}
function tblColAdd(bid){const bl=tblBlock(bid);if(!bl)return;ensureTable(bl);bl.rows.forEach(r=>r.push(''));renderBlocks();markDirty();}
function tblRowDel(bid,r){
  const bl=tblBlock(bid);if(!bl)return;
  if(bl.rows.length<=1){toast('A table needs at least one row');return;}
  bl.rows.splice(r,1);renderBlocks();markDirty();
}
function tblColDel(bid,c){
  const bl=tblBlock(bid);if(!bl)return;
  if(bl.rows[0].length<=1){toast('A table needs at least one column');return;}
  bl.rows.forEach(r=>r.splice(c,1));renderBlocks();markDirty();
}
function tblHead(bid){const bl=tblBlock(bid);if(!bl)return;bl.head=!bl.head;renderBlocks();markDirty();}
/* cells are .tb-c, not .bk-t, so the block editor's handlers ignore them */
document.addEventListener('input',e=>{
  const t=e.target;
  if(!t.classList||!t.classList.contains('tb-c'))return;
  const host=t.closest('.bk');if(!host)return;
  const bl=tblBlock(host.getAttribute('data-bid'));if(!bl)return;
  const r=Number(t.getAttribute('data-tr')),c=Number(t.getAttribute('data-tc'));
  if(bl.rows&&bl.rows[r])bl.rows[r][c]=t.textContent;
  markDirty();
},true);
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!t.classList||!t.classList.contains('tb-c'))return;
  if(e.key==='Tab'){
    e.preventDefault();e.stopPropagation();
    const host=t.closest('.bk');
    const cells=Array.prototype.slice.call(host.querySelectorAll('.tb-c'));
    const i=cells.indexOf(t);
    const nxt=cells[i+(e.shiftKey?-1:1)];
    if(nxt){nxt.focus();
      try{const rg=document.createRange(),sl=window.getSelection();rg.selectNodeContents(nxt);rg.collapse(false);sl.removeAllRanges();sl.addRange(rg);}catch(_){}}
    return;
  }
  if(e.key==='Enter'){e.preventDefault();e.stopPropagation();}   // keep cells single-line
  e.stopPropagation();                                            // never reach the block editor
},true);

/* ---------- duplicate a page ---------- */
async function duplicatePage(id){
  const p=id?pageById(id):curPage();
  if(!p){toast('Open a page first');return;}
  try{
    const content=JSON.parse(JSON.stringify(p.content||(isDb(p)?{}:[])));
    if(Array.isArray(content))content.forEach(b=>{b.id=uid();});
    else if(content&&Array.isArray(content.rows))content.rows.forEach(r=>{
      r.id=uid();
      if(Array.isArray(r.notes))r.notes.forEach(nb=>{nb.id=uid();});
    });
    const row={title:(p.title||'Untitled')+' (copy)',icon:p.icon||'',parent_id:p.parent_id||null,
               sort_order:nextSort(p.parent_id||null),page_type:p.page_type||'doc',
               content:content,created_by:S.user?S.user.email:null};
    const{data,error}=await sb.from('wiki_pages').insert(row).select().single();
    if(error)throw error;
    S.pages.push(data);
    renderTree();openPage(data.id);
    toast('Duplicated');
  }catch(e){toast(writeErr(e,'duplicate the page'),9000);}
}

   - sub-page blocks: link or create a child page inline
