// make sure the access token is usable; returns false if we could not get one
async function ensureToken(force){
  var a=S.auth; if(!a) return false;
  var exp=jwtExp(a.access_token);
  if(!force && exp && exp-Date.now()>60000) return true;
  if(a.src==='cc'){ askParentForToken(); var ok=await waitForToken(5000); return ok && jwtExp(S.auth.access_token)>Date.now(); }
  return await refreshOwn();
}

// ---------- REST helper: every error is thrown with a readable message, never swallowed
function DbError(msg,status,code){ var e=new Error(msg); e.status=status; e.code=code; return e; }
async function api(method,path,body,prefer,retried){
  if(!(await ensureToken(false))) throw DbError('Your sign-in expired. Sign in again to keep saving.',401,'auth');
  var h={apikey:SB_JWT,Authorization:'Bearer '+S.auth.access_token,'Content-Type':'application/json'};
  if(prefer) h.Prefer=prefer;
  var r;
  try{ r=await fetch(SB_URL+'/rest/v1/'+path,{method:method,headers:h,body:body==null?undefined:JSON.stringify(body)}); }
  catch(e){ throw DbError('Could not reach the database. Check the connection.',0,'network'); }
  if(r.status===401 && !retried){ if(await ensureToken(true)) return api(method,path,body,prefer,true); }
  var txt=await r.text(), j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){}
  if(!r.ok){
    var code=j&&j.code, m=(j&&(j.message||j.hint))||txt||('HTTP '+r.status);
    if(code==='42P01'||code==='PGRST205'||/does not exist|Could not find the table/i.test(m)) { S.dbState='missing-tables'; throw DbError('The harness tables are not set up in Supabase yet.',r.status,'missing'); }
    if(r.status===401||r.status===403) throw DbError('Not allowed: '+m+'. Sign in again or check the table policies.',r.status,'auth');
    throw DbError(m,r.status,code||'http');
  }
  return j;
}
function enc(v){ return encodeURIComponent(v); }

// ---------- harness rows
var LIST_COLS='id,name,platform,kind,status,customer,tags,rev,stats,created_by,updated_by,created_at,updated_at';
// Lengths, nets and settings are computed against the OPEN harness (P()). Anything that needs
// them for a harness that is not open - stats for a new, imported, uploaded or demo harness -
// must run inside withProject, or it reads the wrong harness (or crashes when none is open).
function withProject(p,fn){
  var save=S.cur; if(save===p) return fn();
  S.cur=p; touch();
  try{ return fn(); } finally { S.cur=save; touch(); }
}
function projStats(p){ return withProject(p,function(){ return projStatsOpen(p); }); }
function projStatsOpen(p){
  var tot=0, unr=0; p.wires.forEach(function(w){ var l=wireLen(w); if(l==null) unr++; else tot+=l; });
  return {wires:p.wires.length,connectors:p.comps.filter(function(c){return c.type==='connector';}).length,parts:p.comps.length,length_mm:Math.round(tot),unrouted:unr};
}
function projMeta(p){
  return {name:p.name||'Untitled harness',platform:p.platform||'',kind:p.kind||'Engine',status:p.status||'Draft',customer:p.customer||'',tags:p.tags||[],rev:p.rev||'A'};
}
async function loadList(){

    S.list=rows||[]; S.listLoaded=true; S.dbState='ok'; setSync('ok','Connected as '+userName());
  }catch(e){
    S.listLoaded=true;
    if(e.code==='missing'){ setSync('err','Database not set up'); }
    else { S.dbState='error'; setSync('err','Database error'); logErr('Could not load harnesses',e); }
  }

}
function upsertListRow(row){ var i=S.list.findIndex(function(x){return x.id===row.id;}); if(i>=0) S.list[i]=row; else S.list.unshift(row); }
async function openHarness(id){
  if(S.cur && S.dirty){ await saveNow(); if(S.dirty && !confirm('Your last changes to "'+S.cur.name+'" did not save. Leave anyway? They stay on this computer and you can restore them when you reopen it.')) return; }
  setSync('busy','Opening...');
  try{
    var rows=await api('GET','harness_projects?select=id,data,updated_at&id=eq.'+enc(id));
    if(!rows||!rows.length){ toast('That harness no longer exists. Someone may have deleted it.','err'); await loadList(); return; }
    var p=rows[0].data; normalizeProject(p,id);
    S.cur=p; S.curVer=rows[0].updated_at; S.dirty=false; S.conflict=null;
    S.sel=null; S.hiNet=null; S.undo=[]; S.redo=[]; S.segStart=null; touch();
    if(S.view==='browse') S.view='schematic';
    pushRecent(id);
    // a local draft newer than the database copy means a save never made it
    var draft=readJSON(LS_DRAFT+id);
    if(draft && draft.saved_at && draft.saved_at > Date.parse(S.curVer)) S.draftOffer=draft; else { S.draftOffer=null; try{ localStorage.removeItem(LS_DRAFT+id); }catch(e){} }
    setSync('ok','Saved');
    render(); setTimeout(fitView,30);
  }catch(e){ setSync('err','Open failed'); logErr('Could not open the harness',e); }
}
function normalizeProject(p,id){
  p.id=p.id||id; p.comps=p.comps||[]; p.wires=p.wires||[]; p.nodes=p.nodes||[]; p.segs=p.segs||[]; p.notes=p.notes||[];
  if(!p.kind) p.kind='Engine'; if(!p.status) p.status='Draft'; if(p.platform==null) p.platform=''; if(p.customer==null) p.customer=''; if(!p.tags) p.tags=[];

}
async function createHarness(p){

  var out=await api('POST','harness_projects?select='+LIST_COLS,row,'return=representation');
  upsertListRow(out[0]);
  return out[0];
}
var _saveT=null;
function scheduleSave(){
  if(!S.cur) return;
  S.dirty=true; writeDraft();
  setSync('busy','Unsaved changes');
  clearTimeout(_saveT); _saveT=setTimeout(saveNow,1200);
}
function writeDraft(){ if(S.cur) writeJSON(LS_DRAFT+S.cur.id,{saved_at:Date.now(),data:S.cur}); }
async function saveNow(force){
  clearTimeout(_saveT);
  if(!S.cur || !S.dirty || S.saving || (S.conflict && !force)) return;
  var p=S.cur, now=new Date().toISOString();
  var body=Object.assign({data:p,stats:projStats(p),updated_by:userEmail(),updated_at:now},projMeta(p));
  S.saving=true; setSync('busy','Saving...');
  try{
    // only write if nobody else saved since we last read it
    var q='harness_projects?id=eq.'+enc(p.id)+(force?'':'&updated_at=eq.'+enc(S.curVer))+'&select='+LIST_COLS;
    var out=await api('PATCH',q,body,'return=representation');
    if(!out || !out.length){
      var chk=await api('GET','harness_projects?select=id,updated_at,updated_by&id=eq.'+enc(p.id));
      if(!chk.length){ out=[await createHarness(p)]; }
      else { S.conflict={by:chk[0].updated_by,at:chk[0].updated_at}; S.saving=false; setSync('err','Not saved: someone else edited this'); render(); return; }
    }
    S.curVer=out[0].updated_at; upsertListRow(out[0]);
    if(S.cur===p){ S.dirty=false; try{ localStorage.removeItem(LS_DRAFT+p.id); }catch(e){} }
    S.saving=false; setSync('ok','Saved '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}));
    if(S.cur && S.dirty) scheduleSave(); // edits made while saving
  }catch(e){
    S.saving=false; setSync('err','Save failed, kept on this computer');
    logErr('Save failed. Your changes are kept on this computer and will retry',e);
    clearTimeout(_saveT); _saveT=setTimeout(saveNow,15000);
  }
}
function resolveConflict(keepMine){
  var id=S.cur.id;
  if(keepMine){ S.conflict=null; saveNow(true); }
  else { S.conflict=null; S.dirty=false; try{ localStorage.removeItem(LS_DRAFT+id); }catch(e){} openHarness(id); }
}
function restoreDraft(use){
  var d=S.draftOffer; S.draftOffer=null;
  if(use && d && d.data){ pushUndo(); S.cur=normalizeProject(d.data,S.cur.id); touch(); commit(); toast('Restored your unsaved changes.','ok'); }
  else { try{ localStorage.removeItem(LS_DRAFT+S.cur.id); }catch(e){} render(); }
}

    '<div class="form-group" style="margin-bottom:6px"><label class="form-label">Password</label><input class="form-input" id="gPass" type="password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')gateSignIn()"></div>'+
    '<div class="gate-err" id="gErr">'+esc(msg||'')+'</div>'+

async function gateSignIn(){
  var email=$('gEmail').value.trim(), pass=$('gPass').value, btn=$('gBtn'), err=$('gErr');
  if(!email||!pass){ err.textContent='Enter your email and password.'; return; }
  btn.disabled=true; btn.textContent='Signing in...'; err.textContent='';
  try{
    var r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_JWT,'Content-Type':'application/json'},body:JSON.stringify({email:email,password:pass})});
    var d=await r.json().catch(function(){return {};});
    if(!r.ok){ err.textContent=d.error_description||d.msg||'Email or password is wrong.'; btn.disabled=false; btn.textContent='Sign in'; return; }
    var a={access_token:d.access_token,refresh_token:d.refresh_token,email:email,src:'own'};
    writeJSON(HB_SESSION_KEY,a); setAuth(a); afterSignIn();
  }catch(e){ err.textContent='Could not reach the sign-in server. Check the connection.'; btn.disabled=false; btn.textContent='Sign in'; }
}
function signOutLocal(msg){

}

  var last=(readJSON(recKey())||[])[0];

async function uploadLegacy(){
  var n=0, failed=0;
  for(var i=0;i<S.legacy.length;i++){ try{ await createHarness(clone(S.legacy[i])); n++; }catch(e){ failed++; logErr('Upload failed for "'+S.legacy[i].name+'"',e); } }
  if(!failed){ try{ localStorage.removeItem(LS_LEGACY); }catch(e){} }
  S.legacy=failed?S.legacy:[];
  toast('Uploaded '+n+' harness'+(n===1?'':'es')+' to the database.'+(failed?' '+failed+' failed and are still on this computer.':''),failed?'err':'ok');

// ---------- boot
async function bootAuth(){
  if(EMBEDDED){
    showGate('wait'); askParentForToken();
    var ok=await waitForToken(3000);
    if(ok) return; // afterSignIn runs from the message handler
  }
  var cc=readJSON(CC_SESSION_KEY);
  if(cc && cc.access_token){ S.auth={access_token:cc.access_token,refresh_token:cc.refresh_token||'',email:cc.email||'',src:'cc-local'}; if(await ensureToken(false)){ hideGate(); afterSignIn(); return; } }
  var own=readJSON(HB_SESSION_KEY);
  if(own && own.access_token){ S.auth=own; S.auth.src='own'; if(await ensureToken(false)){ hideGate(); afterSignIn(); return; } }
  S.auth=null; showGate('login','');
}

function setupHTML(){
  return '<div class="doc-in"><div class="doc-h"><h2>Set up the database</h2></div><div class="panel"><div class="panel-title">One-time setup</div>'+
    '<p style="margin-bottom:10px;color:var(--text2)">The harness tables are not in Supabase yet. Run this once in the SQL editor for project <code>piamamighqiielfztgic</code>, then click Check again. It is safe to run more than once.</p>'+
    '<textarea class="form-input" readonly rows="14" style="font-family:var(--mono);font-size:var(--t-sm);line-height:1.5" onclick="this.select()">'+esc(HB_SQL)+'</textarea>'+
    '<div class="acts" style="margin-top:10px"><button class="btn btn-sm" onclick="navigator.clipboard.writeText(HB_SQL).then(function(){toast(\'SQL copied\',\'ok\')},function(){toast(\'Copy failed. Select the text and copy it.\',\'err\')})">Copy SQL</button><button class="btn btn-sm btn-primary" onclick="S.dbState=\'idle\';loadList().then(loadLibrary)">Check again</button></div></div></div>';
}
var HB_SQL=[
"-- TGK Harness Builder tables",
"create table if not exists public.harness_projects (",
"  id text primary key,",
"  name text not null default '',",
"  platform text not null default '',",
"  kind text not null default 'Engine',",
"  status text not null default 'Draft',",
"  customer text not null default '',",
"  tags text[] not null default '{}',",
"  rev text not null default 'A',",
"  stats jsonb not null default '{}',",
"  data jsonb not null,",
"  created_by text, updated_by text,",
"  created_at timestamptz not null default now(),",
"  updated_at timestamptz not null default now()",
");",
"create index if not exists harness_projects_updated_idx on public.harness_projects (updated_at desc);",
"create index if not exists harness_projects_platform_idx on public.harness_projects (platform);",
"create table if not exists public.harness_parts (",
"  pn text primary key, data jsonb not null, created_by text,",
"  updated_at timestamptz not null default now()",
");",
"create table if not exists public.harness_templates (",
"  id text primary key, name text not null default '', cat text not null default 'Other',",
"  data jsonb not null, created_by text, updated_at timestamptz not null default now()",
");",
"-- signed-in TGK users only; the public anon key cannot read or write these",
"alter table public.harness_projects enable row level security;",
"alter table public.harness_parts enable row level security;",
"alter table public.harness_templates enable row level security;",
"drop policy if exists hb_projects_auth on public.harness_projects;",
"create policy hb_projects_auth on public.harness_projects for all to authenticated using (true) with check (true);",
"drop policy if exists hb_parts_auth on public.harness_parts;",
"create policy hb_parts_auth on public.harness_parts for all to authenticated using (true) with check (true);",
"drop policy if exists hb_templates_auth on public.harness_templates;",
"create policy hb_templates_auth on public.harness_templates for all to authenticated using (true) with check (true);"
].join('\n');

// ---------- new harness dialog
function openNewHarness(){
  var plats=uniq(S.list.map(function(r){return r.platform;}));
  function g(label,inner){ return '<div class="form-group"><label class="form-label">'+label+'</label>'+inner+'</div>'; }
  $('modalRoot').innerHTML='<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" style="width:560px">'+
    '<div class="modal-title">New harness</div>'+
    '<div class="form-row">'+g('Name','<input class="form-input" id="nhName" placeholder="e.g. B9 S4 engine harness">')+'</div>'+
    '<div class="form-row cols-2">'+g('Vehicle / platform','<input class="form-input" id="nhPlat" list="nhPlats" placeholder="e.g. Audi B9 S4" value="'+esc(S.browse.platform||'')+'"><datalist id="nhPlats">'+plats.map(function(x){return '<option value="'+esc(x)+'">';}).join('')+'</datalist>')+g('Type','<select class="form-input" id="nhKind">'+HB_KINDS.map(function(x){return opt(x,x,'Engine');}).join('')+'</select>')+'</div>'+
    '<div class="form-row">'+g('Customer, order, or build (optional)','<input class="form-input" id="nhCust" placeholder="e.g. Order 10452, or Shop car">')+'</div>'+
    '<div class="form-row">'+g('Start from','<select class="form-input" id="nhFrom">'+opt('blank','Blank harness','blank')+S.list.filter(function(r){return r.status!=='Archived';}).map(function(r){return opt(r.id,'Copy of '+r.name+(r.platform?' ('+r.platform+')':''),'');}).join('')+'</select>')+'</div>'+
    '<div class="note">Vehicle and type are what the harness list is grouped and filtered by, so reuse the same spelling as existing harnesses.</div>'+
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="nhGo" onclick="createFromDialog()">Create harness</button></div></div></div>';
  var nhn=$('nhName'); if(nhn) nhn.focus();
}
async function createFromDialog(){
  var name=$('nhName').value.trim(); if(!name){ toast('Give the harness a name.','err'); return; }
  var from=$('nhFrom').value, btn=$('nhGo'); btn.disabled=true; btn.textContent='Creating...';
  try{
    var p;
    if(from==='blank') p=newProject(name);
    else { var rows=await api('GET','harness_projects?select=data&id=eq.'+enc(from)); p=clone(rows[0].data); p.status='Draft'; p.rev='A'; }
    p.id=uid('h'); p.name=name; p.platform=$('nhPlat').value.trim(); p.kind=$('nhKind').value; p.customer=$('nhCust').value.trim(); p.created=Date.now(); p.updated=Date.now();
    await createHarness(p);
    closeModal(); S.view='schematic'; await openHarness(p.id);
  }catch(e){ btn.disabled=false; btn.textContent='Create harness'; logErr('Could not create the harness',e); }
}
function closeHarness(){
  if(S.dirty) saveNow();
  S.cur=null; S.view='browse'; S.sel=null; render();
}
async function setHarnessMeta(f,v){
  if(!S.cur) return;
  if(f==='tags') v=v.split(',').map(function(x){return x.trim();}).filter(Boolean);
  pushUndo(); S.cur[f]=v; commit();
}
async function archiveHarness(on){
  if(!S.cur) return; pushUndo(); S.cur.status=on?'Archived':'Draft'; commit();
  toast(on?'Archived. Find it under the Archived tab; it can be restored.':'Restored from the archive.','ok');
}
async function deleteHarnessForever(){
  var p=S.cur; if(!p) return;
  if(!confirm('Permanently delete "'+p.name+'" for everyone? This cannot be undone. Archive it instead if you might need it again.')) return;
  try{
    await api('DELETE','harness_projects?id=eq.'+enc(p.id));
    S.list=S.list.filter(function(r){return r.id!==p.id;}); S.dirty=false; try{ localStorage.removeItem(LS_DRAFT+p.id); }catch(e){}
    S.cur=null; S.view='browse'; render(); toast('Deleted "'+p.name+'".','ok');
  }catch(e){ logErr('Delete failed',e); }
}
function bannerHTML(){
  var h='';
  if(S.conflict) h+='<div class="banner err"><b>Not saved.</b> '+esc((S.conflict.by||'Someone').split('@')[0])+' saved this harness '+ago(S.conflict.at)+', after you opened it.<div class="spacer"></div><button class="btn btn-sm" onclick="resolveConflict(false)">Load their version</button><button class="btn btn-sm btn-danger" onclick="if(confirm(\'Overwrite their changes with yours?\'))resolveConflict(true)">Keep mine</button></div>';
  if(S.draftOffer) h+='<div class="banner warn"><b>Unsaved changes found</b> on this computer from '+new Date(S.draftOffer.saved_at).toLocaleString()+'.<div class="spacer"></div><button class="btn btn-sm btn-primary" onclick="restoreDraft(true)">Restore them</button><button class="btn btn-sm" onclick="restoreDraft(false)">Discard</button></div>';
  if(S.cur && S.cur.status==='Released') h+='<div class="banner ok"><b>Released, rev '+esc(S.cur.rev||'A')+'.</b> Builds use this version. To change it, start a new revision so the released one stays on record.<div class="spacer"></div><button class="btn btn-sm btn-teal" onclick="newRevision()">Start rev '+nextRev(S.cur.rev)+'</button></div>';
  return h;
}
function nextRev(r){ r=String(r||'A').toUpperCase(); if(/^[A-Y]$/.test(r)) return String.fromCharCode(r.charCodeAt(0)+1); if(/^\d+$/.test(r)) return String(+r+1); return r+'1'; }
async function newRevision(){
  var p=S.cur; if(!p) return;
  if(!confirm('Make a copy of "'+p.name+'" as rev '+nextRev(p.rev)+'? Rev '+(p.rev||'A')+' stays released and unchanged.')) return;
  try{
    var n=clone(p); n.id=uid('h'); n.rev=nextRev(p.rev); n.status='Draft'; n.prevRev={id:p.id,rev:p.rev||'A'}; n.created=Date.now();
    await createHarness(n); await openHarness(n.id); toast('Rev '+n.rev+' created as a draft.','ok');
  }catch(e){ logErr('Could not start a new revision',e); }
}

// ===== boot =====
(function boot(){
  touch(); render();
  bootAuth().catch(function(e){ logErr('Sign-in failed',e); showGate('login',''); });
})();
</script>
