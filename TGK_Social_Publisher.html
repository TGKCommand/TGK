  --text:#e8eaed;--text2:#b4bcc6;--text3:#8f9aa3;
  --teal-t:#2dd4bf;--teal-l:rgba(45,212,191,.12);--teal-bd:rgba(45,212,191,.3);
  --orange-l:rgba(224,123,40,.14);--red-l:rgba(220,38,38,.16);--green:#4ade80;--green-l:rgba(74,222,128,.12);--amber:#fbbf24;--amber-l:rgba(251,191,36,.12);--blue:#93c5fd;--blue-l:rgba(24,95,165,.2);
  --sb-bg:#141618;--sb-bg4:#26292c;--sb-border:#2a2d30;--sb-text:#e8eaed;--sb-text2:#b4bcc6;--sb-text3:#8f9aa3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg3);color:var(--text);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
svg{flex:none}
#app{display:flex;height:100%;position:relative}

/* ---------- sidebar (same as Ghost Tuning / ERP / Support) ---------- */
#side{width:220px;min-width:220px;background:var(--sb-bg);border-right:1px solid var(--sb-border);display:flex;flex-direction:column;position:relative;overflow-y:auto}
#side .logo{height:52px;flex:none;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--sb-border);margin-bottom:6px}
#side .logo img{height:28px;display:block}
#side::after{content:"";position:absolute;left:0;right:0;top:51px;height:2px;background:linear-gradient(90deg,#0d9488,#e07b28 60%,transparent);pointer-events:none}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sb-text3);padding:14px 16px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 16px;border:0;background:none;color:var(--sb-text2);font-size:13.5px;font-weight:600;text-align:left;border-left:3px solid transparent;white-space:nowrap}
.nav:hover{background:var(--sb-bg4);color:var(--sb-text)}
.nav.on{background:var(--teal-l);color:var(--teal-t);border-left-color:var(--teal-t)}
.nav .ct{margin-left:auto;font-size:11px;font-weight:700;padding:1px 7px;border:1px solid var(--sb-border);border-radius:var(--r);color:var(--sb-text3)}
.nav.on .ct{color:var(--teal-t);background:var(--teal-l);border-color:var(--teal-bd)}
.nav .ct.warn{color:var(--red);border-color:rgba(220,38,38,.35);background:var(--red-l)}
#side .foot{margin-top:auto;padding:12px 16px 14px;border-top:1px solid var(--sb-border);font-size:11px;color:var(--sb-text3);line-height:1.6}
#side .foot b{color:var(--sb-text2)}
#conn-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9ca3af;margin-right:6px}
#conn-dot.ok{background:#16a34a}#conn-dot.bad{background:var(--red)}

/* ---------- main ---------- */
#main{flex:1;min-width:0;min-height:0;width:100%;display:flex;flex-direction:column;overflow:hidden}
.hero{flex:none;display:flex;align-items:center;gap:14px;padding:0 24px;min-height:60px;color:#E4E9EC;
  background-color:#2c3237;
  background-image:linear-gradient(104deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 46%,rgba(255,255,255,0) 62%),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 42%,rgba(0,0,0,.20)),var(--gm-tex);
  background-size:100% 100%,100% 100%,256px 256px;background-repeat:no-repeat,no-repeat,repeat;
  border-bottom:2px solid rgba(42,191,170,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.hero h1{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.hero .sub{font-size:12.5px;color:#9fb0b8;font-weight:500}
.hero .sp{flex:1}
.hero .tz{font-size:11.5px;color:#9fb0b8;font-family:var(--mono)}
#view{flex:1;overflow-y:auto;padding:20px 24px 40px}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}
.card-h .sp{flex:1}
.card-b{padding:14px}
.lbl{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.inp,.sel,.txt{width:100%;background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;outline:none}
html[data-theme="dark"] .inp,html[data-theme="dark"] .sel,html[data-theme="dark"] .txt{background:#141618}
.inp:focus,.sel:focus,.txt:focus{border-color:var(--teal-t);box-shadow:0 0 0 2px var(--teal-l)}
.txt{resize:vertical;min-height:130px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border:1px solid var(--border2);background:var(--bg);color:var(--text);border-radius:var(--r);font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.btn:hover{border-color:var(--teal-t);color:var(--teal-t)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.pri:hover{background:var(--orange-dark);border-color:var(--orange-dark);color:#fff}
.btn.sec{background:var(--teal-l);border-color:var(--teal-bd);color:var(--teal-t)}
.btn.dng{color:var(--red);border-color:rgba(220,38,38,.35);background:var(--red-l)}
.btn.dng:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.sm{min-height:28px;padding:0 10px;font-size:11.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--text3)}
.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--border2);border-radius:var(--r);font-size:11.5px;font-weight:700;color:var(--text2);background:var(--bg)}
.st{display:inline-flex;align-items:center;padding:2px 8px;border-radius:var(--r);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;border:1px solid transparent;white-space:nowrap}
.st.draft{color:var(--text2);background:var(--bg3);border-color:var(--border2)}
.st.scheduled{color:var(--blue);background:var(--blue-l);border-color:rgba(24,95,165,.3)}
.st.publishing{color:var(--amber);background:var(--amber-l);border-color:rgba(217,119,6,.35)}
.st.published{color:var(--green);background:var(--green-l);border-color:rgba(21,128,61,.3)}
.st.partial{color:var(--amber);background:var(--amber-l);border-color:rgba(217,119,6,.35)}
.st.failed{color:var(--red);background:var(--red-l);border-color:rgba(220,38,38,.35)}
.st.cancelled{color:var(--text3);background:var(--bg3);border-color:var(--border)}
.pcode{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 5px;border-radius:var(--r);background:#2c3237;color:#e4e9ec;font-size:10.5px;font-weight:800;letter-spacing:.04em}
.pcode.ok{background:var(--green);color:#fff}.pcode.bad{background:var(--red);color:#fff}
html[data-theme="dark"] .pcode.ok{color:#04210f}
.note{padding:10px 12px;border:1px solid var(--border2);border-left:3px solid var(--teal-t);background:var(--teal-l);border-radius:var(--r);font-size:13px;color:var(--text2)}
.note.warn{border-left-color:var(--amber);background:var(--amber-l)}
.note.bad{border-left-color:var(--red);background:var(--red-l)}
.empty{padding:40px 20px;text-align:center;color:var(--text3)}
.empty b{display:block;color:var(--text2);font-size:15px;margin-bottom:4px}

/* ---------- compose ---------- */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
#drop{border:2px dashed var(--border2);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--text3);background:var(--bg);transition:border-color .12s,background .12s}
#drop.over{border-color:var(--teal-t);background:var(--teal-l);color:var(--teal-t)}
#drop b{display:block;color:var(--text);font-size:15px;margin:8px 0 2px}
#drop .pickbtn{margin-top:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:12px}
.th{position:relative;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;background:#0f1113;aspect-ratio:1/1}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:var(--r);background:rgba(0,0,0,.65);color:#fff;font-size:15px;line-height:1}
.th .x:hover{background:var(--red)}
.th .mv{position:absolute;bottom:4px;left:4px;display:flex;gap:3px}
.th .mv button{width:22px;height:22px;border:0;border-radius:var(--r);background:rgba(0,0,0,.65);color:#fff;font-size:12px;line-height:1}
.th .kind{position:absolute;top:4px;left:4px;padding:1px 6px;border-radius:var(--r);background:rgba(0,0,0,.65);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em}
.th .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.2)}
.th .bar i{display:block;height:100%;background:var(--teal);width:0}
.th.err{border-color:var(--red)}
.th .em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font-size:11px;color:#fff;background:rgba(127,29,29,.85)}
.recent{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:10px}
.recent .rt{width:46px;height:46px;flex:none;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;background:#0f1113;padding:0}
.recent .rt:hover{border-color:var(--teal-t)}
.recent .rt img,.recent .rt video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.acct{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);text-align:left;color:var(--text2);font-size:13px;font-weight:600;position:relative}
.acct .pcode{flex:none}
.acct:hover{border-color:var(--teal-t)}
.acct.on{border-color:var(--teal-t);background:var(--teal-l);color:var(--text)}
.acct.on::after{content:"\2713";position:absolute;right:8px;top:6px;color:var(--teal-t);font-weight:800;font-size:12px}
.acct.off{opacity:.55;background:var(--bg3)}
.acct small{display:block;font-size:10.5px;font-weight:600;color:var(--text3)}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);overflow-x:auto}
.tab{padding:9px 14px;border:0;background:none;border-bottom:2px solid transparent;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab.on{color:var(--teal-t);border-bottom-color:var(--teal-t)}
.cnt{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:11.5px;font-family:var(--mono)}
.cnt span{color:var(--text3)}.cnt span.over{color:var(--red);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--bg);padding:7px 14px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);border-right:1px solid var(--border2)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--teal-l);color:var(--teal-t)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pv{border:1px solid var(--border2);border-radius:var(--r);background:var(--bg);overflow:hidden}
.pv-h{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border)}
.pv-m{background:#0f1113;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:#6b7480;font-size:12px;overflow:hidden}
.pv-m img,.pv-m video{width:100%;height:100%;object-fit:cover}
.pv-t{padding:10px;font-size:13px;white-space:pre-wrap;word-break:break-word;max-height:160px;overflow:auto}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:5px 0;color:var(--text2)}
.chk i{font-style:normal;font-weight:800;width:14px;flex:none}
.chk.ok i{color:var(--green)}.chk.warn i{color:var(--amber)}.chk.bad i{color:var(--red)}
.sticky-bar{position:sticky;bottom:-40px;margin:16px -24px -40px;padding:12px 24px;background:var(--card);border-top:1px solid var(--border2);display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:5}

/* ---------- queue ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl thead{background-color:#2c3237;background-image:linear-gradient(104deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.07) 46%,rgba(255,255,255,0) 62%),linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 42%,rgba(0,0,0,.20)),var(--gm-tex);background-size:100% 100%,100% 100%,256px 256px;background-repeat:no-repeat,no-repeat,repeat}
.tbl th{padding:9px 12px;text-align:left;font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#E4E9EC;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--teal-l)}
.tbl .cap{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{width:40px;height:40px;border-radius:var(--r);background:#0f1113;overflow:hidden;border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;color:#6b7480;font-size:10px}
.mini img,.mini video{width:100%;height:100%;object-fit:cover}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.fbtn{padding:6px 12px;border:1px solid var(--border2);background:var(--bg);border-radius:var(--r);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.fbtn.on{border-color:var(--teal-t);background:var(--teal-l);color:var(--teal-t)}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-left:1px solid var(--border);border-top:1px solid var(--border);background:var(--card)}
.cal .dh{padding:8px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#E4E9EC;background:#2c3237;border-right:1px solid #1f2428;border-bottom:1px solid var(--border)}
.cal .dc{min-height:104px;padding:5px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;overflow:hidden}
.cal .dc:hover{background:var(--teal-l)}
.cal .dc.dim{background:var(--bg3);color:var(--text3)}
.cal .dc.today .dn{background:var(--teal-t);color:#fff}
.cal .dn{display:inline-block;min-width:22px;text-align:center;padding:1px 5px;border-radius:var(--r);font-size:12px;font-weight:700;margin-bottom:3px}
.cal .ev{display:block;width:100%;text-align:left;padding:2px 6px;margin-top:3px;border:0;border-left:3px solid var(--teal-t);background:var(--teal-l);border-radius:var(--r);font-size:11.5px;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.published{border-left-color:var(--green)}.cal .ev.failed,.cal .ev.partial{border-left-color:var(--red)}.cal .ev.draft{border-left-color:var(--border2)}
.cal .more{font-size:11px;color:var(--text3);margin-top:3px}

/* ---------- drawer / modal / toast ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none}
#scrim.on{display:block}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--card);border-left:1px solid var(--border2);z-index:60;transform:translateX(100%);transition:transform .18s;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .dh2{display:flex;align-items:center;gap:10px;padding:0 16px;min-height:52px;color:#E4E9EC;background-color:#2c3237;background-image:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 42%,rgba(0,0,0,.20)),var(--gm-tex);background-size:100% 100%,256px 256px;border-bottom:2px solid rgba(42,191,170,.6)}
#drawer .dh2 b{font-size:13px;letter-spacing:.08em;text-transform:uppercase}
#drawer .db{flex:1;overflow-y:auto;padding:16px}
#drawer .df{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
.xbtn{border:0;background:none;color:#E4E9EC;font-size:22px;line-height:1;padding:4px 8px}
#modal{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.5)}
#modal.on{display:flex}
#modal .mb{width:min(460px,100%);background:var(--card);border:1px solid var(--border2);border-radius:var(--r);overflow:hidden}
#modal .mh{padding:12px 16px;font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E4E9EC;background-color:#2c3237;background-image:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0) 42%,rgba(0,0,0,.20)),var(--gm-tex);background-size:100% 100%,256px 256px;border-bottom:2px solid rgba(42,191,170,.6)}
#modal .mc{padding:16px;font-size:14px;color:var(--text2)}
#modal .mf{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:80;max-width:min(380px,calc(100vw - 32px))}
.toast{padding:10px 14px;border-radius:var(--r);background:#1e2022;color:#e8eaed;border-left:3px solid var(--teal);font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.toast.bad{border-left-color:var(--red)}.toast.ok{border-left-color:#16a34a}
pre.code{background:#0f1113;color:#cfe3e1;font-family:var(--mono);font-size:12px;line-height:1.55;padding:12px;border-radius:var(--r);overflow:auto;max-height:340px;border:1px solid #2a2d30;white-space:pre}
.steps{counter-reset:s;display:flex;flex-direction:column;gap:16px}
.stp{position:relative;padding-left:40px}
.stp::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:var(--r);background:#2c3237;color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.stp h3{font-size:14px;margin-bottom:4px}

/* ---------- mobile ---------- */
#mnav{display:none}
@media (max-width:1100px){.cmp{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  #app{flex-direction:column}
  #side{width:100%;min-width:0;flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--sb-border);flex:none}
  #side::after,#side .foot,#side .sec-lbl,#side .logo{display:none}
  .nav{width:auto;border-left:0;border-bottom:3px solid transparent;padding:12px 14px}
  .nav.on{border-bottom-color:var(--teal-t)}
  .hero{padding:0 14px;min-height:52px}.hero .sub,.hero .tz{display:none}
  #view{padding:14px 12px 40px}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .sticky-bar{margin:16px -12px -40px;padding:10px 12px}
  .tbl thead{display:none}.tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{padding:10px 12px;border-bottom:1px solid var(--border)}.tbl td{border:0;padding:2px 0}
  .tbl .cap{max-width:none;white-space:normal}
  .cal .dc{min-height:64px;padding:3px}.cal .ev{font-size:10px;padding:1px 3px}
  .cal .ev .t{display:none}
}
</style>
</head>
<body>

<script>
/* TGK Social Publisher - single-file tool. Vanilla JS, global state, render() dispatch. ASCII-only source. */
var TGK_SOCIAL_VERSION = 'v1.0';
var SB_URL = 'https://piamamighqiielfztgic.supabase.co';
var SB_KEY = 'sb_publishable_JHTuiKlkCD_EHoyDtWtKsQ_gyQ6kgfJ';
var SB_JWT = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBpYW1hbWlnaHFpaWVsZnp0Z2ljIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NjkxMzUsImV4cCI6MjA5MzQ0NTEzNX0.YwLflTw6F4cRzmY78QoAY6Zud2IHGVP5xL_yvMFxheA';
var BUCKET = 'social-media';
var POST_PFX = 'tgk_social_post_';
var SET_ID = 'tgk_social_settings_v1';
var EDGE_SRC = "// TGK Social Publisher backend - Supabase Edge Function name: social-publish\n// Posting provider: Ayrshare (one API key reaches Instagram, Facebook, TikTok, YouTube,\n// X, Threads, Pinterest, LinkedIn, Google Business and Bluesky).\n// Secrets to set on this function:\n//   AYRSHARE_API_KEY       (required)\n//   AYRSHARE_PROFILE_KEY   (optional - only if you use an Ayrshare Business plan profile)\n// Only signed-in TGK users can call it. Provider-specific option names live in buildPayload()\n// below - if the provider ever rejects an option, that is the one place to edit.\n\nconst CORS: Record<string, string> = {\n  'Access-Control-Allow-Origin': '*',\n  'Access-Control-Allow-Headers': 'authorization, x-client-info, apikey, content-type',\n  'Access-Control-Allow-Methods': 'POST, OPTIONS',\n};\n\nfunction out(body: unknown, status = 200): Response {\n  return new Response(JSON.stringify(body), {\n    status: status,\n    headers: Object.assign({ 'Content-Type': 'application/json' }, CORS),\n  });\n}\n\nasync function signedIn(req: Request): Promise<boolean> {\n  const tok = (req.headers.get('authorization') || '').replace(/^Bearer\\s+/i, '');\n  if (!tok) return false;\n  try {\n    const r = await fetch((Deno.env.get('SUPABASE_URL') || '') + '/auth/v1/user', {\n      headers: { apikey: Deno.env.get('SUPABASE_ANON_KEY') || '', Authorization: 'Bearer ' + tok },\n    });\n    return r.ok;\n  } catch (_e) {\n    return false;\n  }\n}\n\nasync function ay(path: string, method: string, body?: unknown): Promise<{ status: number; data: any }> {\n  const key = Deno.env.get('AYRSHARE_API_KEY');\n  if (!key) return { status: 500, data: { message: 'AYRSHARE_API_KEY secret is not set on this function' } };\n  const headers: Record<string, string> = { Authorization: 'Bearer ' + key, 'Content-Type': 'application/json' };\n  const profile = Deno.env.get('AYRSHARE_PROFILE_KEY');\n  if (profile) headers['Profile-Key'] = profile;\n  const r = await fetch('https://api.ayrshare.com/api' + path, {\n    method: method,\n    headers: headers,\n    body: body ? JSON.stringify(body) : undefined,\n  });\n  let data: any = null;\n  try { data = await r.json(); } catch (_e) { data = null; }\n  return { status: r.status, data: data };\n}\n\n// Neutral job from the app -> provider payload. ONE place for provider option names.\nfunction buildPayload(j: any): any {\n  const o = j.options || {};\n  const p: any = { post: j.text || '', platforms: j.platforms };\n  if (j.mediaUrls && j.mediaUrls.length) {\n    p.mediaUrls = j.mediaUrls;\n    if (j.isVideo) p.isVideo = true;\n  }\n  if (j.scheduleDate) p.scheduleDate = j.scheduleDate;\n  if (o.instagram && o.instagram.format === 'reel') p.instagramOptions = { reels: true };\n  if (o.instagram && o.instagram.format === 'story') p.instagramOptions = { stories: true };\n  if (o.facebook && o.facebook.format === 'reel') p.faceBookOptions = { reels: true };\n  if (o.facebook && o.facebook.format === 'story') p.faceBookOptions = { stories: true };\n  if (o.youtube) {\n    p.youTubeOptions = {\n      title: String(o.youtube.title || j.text || 'Video').split('\\n')[0].slice(0, 100),\n      visibility: o.youtube.visibility || 'public',\n    };\n  }\n  if (o.pinterest) {\n    p.pinterestOptions = {\n      title: String(o.pinterest.title || '').slice(0, 100) || undefined,\n      link: o.pinterest.link || undefined,\n      boardId: o.pinterest.board || undefined,\n    };\n  }\n  return p;\n}\n\nfunction statusOf(s: any): string {\n  const t = String(s || '').toLowerCase();\n  if (/success|publish|posted/.test(t)) return 'published';\n  if (/error|fail/.test(t)) return 'failed';\n  if (/schedul|pending|process|queue/.test(t)) return 'scheduled';\n  if (/delet|cancel/.test(t)) return 'cancelled';\n  return '';\n}\n\nfunction results(item: any): any[] {\n  const rs: any[] = [];\n  const ids = (item && item.postIds) || [];\n  for (let i = 0; i < ids.length; i++) {\n    rs.push({ platform: ids[i].platform, status: statusOf(ids[i].status) || 'published', url: ids[i].postUrl || '', error: '' });\n  }\n  const errs = (item && item.errors) || [];\n  for (let i = 0; i < errs.length; i++) {\n    rs.push({ platform: errs[i].platform || '', status: 'failed', url: '', error: String(errs[i].message || errs[i].code || 'Error') });\n  }\n  return rs;\n}\n\nfunction normPost(d: any, platforms: string[], scheduled: boolean, http: number): any {\n  const item = Array.isArray(d) ? d[0] : d;\n  const ref = item && item.id ? String(item.id) : '';\n  let rs = results(item);\n  const top = statusOf(item && item.status);\n  if (!rs.length) {\n    const msg = String((item && (item.message || (item.errors && item.errors[0] && item.errors[0].message))) || '');\n    const st = http < 300 && top !== 'failed' ? (scheduled ? 'scheduled' : 'published') : 'failed';\n    rs = platforms.map(function (p) { return { platform: p, status: st, url: '', error: st === 'failed' ? (msg || 'Provider refused the post (HTTP ' + http + ')') : '' }; });\n  }\n  return { ref: ref, scheduled: scheduled, results: rs };\n}\n\nDeno.serve(async function (req: Request) {\n  if (req.method === 'OPTIONS') return new Response('ok', { headers: CORS });\n  if (!(await signedIn(req))) return out({ ok: false, error: 'Not signed in' }, 401);\n  let body: any = {};\n  try { body = await req.json(); } catch (_e) { body = {}; }\n  const action = body.action;\n\n  if (action === 'status') {\n    const r = await ay('/user', 'GET');\n    const d = r.data || {};\n    if (r.status >= 300) return out({ ok: false, error: String(d.message || 'Provider error HTTP ' + r.status) });\n    return out({ ok: true, connected: d.activeSocialAccounts || [], names: d.displayNames || [] });\n  }\n\n  if (action === 'publish') {\n    const jobs = body.jobs || [];\n    const res: any[] = [];\n    for (let i = 0; i < jobs.length; i++) {\n      const j = jobs[i];\n      const r = await ay('/post', 'POST', buildPayload(j));\n      res.push(normPost(r.data,     '<div class="stp"><h3>Deploy the function</h3><div class="muted" style="margin-bottom:8px">Supabase dashboard &gt; Edge Functions &gt; Deploy a new function &gt; name it exactly <b class="mono">social-publish</b> &gt; paste this code &gt; Deploy. Leave the JWT check on.</div><pre class="code">' + esc(EDGE_SRC) + '</pre><div style="margin-top:8px"><button class="btn sm sec" onclick="copyText(EDGE_SRC,\'Function code\')">' + ic('copy', 14) + 'Copy function code</button></div></div>' +
    '<div class="stp"><h3>Add the secret</h3><div class="muted">Edge Functions &gt; Secrets &gt; add <b class="mono">AYRSHARE_API_KEY</b> with the key from step 1.</div></div>' +
    '<div class="stp"><h3>Test it</h3><div class="muted" style="margin-bottom:8px">Should list the accounts you linked.</div><button class="btn pri" onclick="checkConn()">' + ic('refresh', 14) + 'Check connection</button> <span id="setup-res" class="muted" style="margin-left:8px">' + (S.connected === null ? esc(S.connErr || '') : esc(S.connected.length + ' linked: ' + S.connected.join(', '))) + '</span></div>' +
    '</div>';
  $('view').innerHTML = h;
}

/* ---------------- shell ---------------- */
var VIEWS = {
  compose: { t: 'Compose', s: 'One post, every account', r: renderCompose },
  queue: { t: 'Queue', s: 'Scheduled, published and drafts', r: renderQueue },
  calendar: { t: 'Calendar', s: 'What goes out and when', r: renderCalendar },
  accounts: { t: 'Accounts', s: 'Which accounts it may post to', r: renderAccounts },
  setup: { t: 'Backend Setup', s: 'One-time setup', r: renderSetup }
};
function go(v) { S.view = v; closeDrawer(); render(); var m = $('view'); if (m) m.scrollTop = 0; }
function render() {
  var V = VIEWS[S.view] || VIEWS.compose;
  document.querySelectorAll('.nav').forEach(function (n) { n.classList.toggle('on', n.getAttribute('data-v') === S.view); });
  $('h-title').textContent = V.t; $('h-sub').textContent = V.s;
  $('h-act').innerHTML = S.view === 'queue' ? '<button class="btn sm" onclick="refreshQueue()" style="background:rgba(255,255,255,.08);color:#E4E9EC;border-color:rgba(255,255,255,.25)">' + ic('refresh', 14) + 'Refresh</button>' : '';
  V.r();
}
async function refreshQueue() { try { await loadPosts(); await syncHistory(true); } catch (e) { toast('Could not load posts: ' + e.message, 'bad'); } render(); }
function boot() {
  document.querySelectorAll('[data-ic]').forEach(function (el) { el.innerHTML = ic(el.getAttribute('data-ic'), 17); });
  $('h-tz').textContent = TZ; $('ver').textContent = TGK_SOCIAL_VERSION; paintWho();
  document.addEventListener('dragover', function (e) { e.preventDefault(); });
  document.addEventListener('drop', function (e) { e.preventDefault(); if (S.view === 'compose' && e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length && !(e.target && e.target.closest && e.target.closest('#drop'))) addFiles(e.dataTransfer.files); });
  document.addEventListener('paste', function (e) { if (S.view !== 'compose' || !e.clipboardData) return; var fs = []; for (var i = 0; i < e.clipboardData.files.length; i++) fs.push(e.clipboardData.files[i]); if (fs.length) { e.preventDefault(); addFiles(fs); } });
  $('filepick').addEventListener('change', function () { addFiles(this.files); this.value = ''; });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDrawer(); closeModal(); } });
  S.draft = newDraft(); render();
  try { window.parent.postMessage({ type: 'tgk-tool-ready' }, '*'); } catch (e) {}
  (async function () {
    try { await token(); } catch (e) {}
    paintWho();
    await loadSettings();
    try { await loadPosts(); } catch (e) { toast('Could not load posts: ' + e.message, 'bad'); S.postsLoaded = true; }
    await checkConn(true);
    if (S.draft && !S.draft.touched && !S.draft.text && !S.draft.media.length) S.draft.platforms = allowedIds();
    if (S.view === 'compose') { renderAccts(); renderPostCard(); refresh(); } else render();
    syncHistory(false);
    setInterval(function () { if (!document.hidden) { loadPosts().then(function () { return syncHistory(false); }).then(function () { if (S.view === 'queue' || S.view === 'calendar') render(); }).catch(function () {}); } }, 90000);
  })();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

</script>
